,"en":"Interaction Cost","entityKind":"problem","status":"established","x":4020,"y":3580,"w":298,"h":76,"summary":"只靠真实试错难以迁移到机器人和开放环境。","why":"只靠真实试错难以迁移到机器人和开放环境。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-self-play-search","label":"Self-Play + Neural Search / 自博弈搜索","en":"Self-Play and Neural-Guided Search","entityKind":"technical_route","status":"established","x":4430,"y":3220,"w":300,"h":76,"summary":"用自身对局生成课程，再以神经网络引导树搜索。","why":"巨大决策树无法穷举，人类棋谱也会限制策略上限。","mechanism":"策略与价值网络缩小搜索范围，自博弈不断产生更强训练数据。","changed":"在规则清晰、可模拟环境中达到并超越顶尖人类水平。","limits":"依赖准确模拟器、明确胜负与大量计算，难直接迁移到开放现实任务。","plainLanguage":"如果规则明确、环境能模拟，系统可以反复和自己对弈产生训练数据。再用神经网络给搜索提供方向，就能在极大的决策空间里达到很高水平。","evidence":[{"kind":"paper","year":2018,"title":"A general reinforcement learning algorithm that masters chess, shogi, and Go through self-play","url":"https://www.science.org/doi/10.1126/science.aar6404","note":"AlphaZero 直接把自博弈课程、策略价值网络和 MCTS 组合成神经引导搜索路线。"}],"actors":[{"name":"Google DeepMind","role":"标志性推进","kind":"Frontier Lab","url":"https://www.science.org/doi/10.1126/science.aar6404","note":"AlphaZero 用自博弈生成训练数据，并把策略价值网络与树搜索闭环结合，在明确规则环境中持续提升。","sourceTitle":"A general reinforcement learning algorithm that masters chess, shogi, and Go","year":2018}]},{"id":"tech-model-free-rl","label":"Model-Free RL / 无模型强化学习","en":"Model-Free Value and Policy Learning","entityKind":"technical_route","status":"established","x":4430,"y":3400,"w":300,"h":76,"summary":"不显式学习环境动力学，直接从经验优化价值函数或策略。","why":"真实环境复杂，准确建模可能比直接学行动更难。","mechanism":"依据轨迹回报更新 Q 值、优势函数或参数化策略。","changed":"避开模型误差，在足够交互下可学到高性能控制。","limits":"需要大量试错，难以前瞻解释，也无法轻易复用环境知识做规划。","plainLanguage":"无模型强化学习不先学一套世界规律，而是直接从试错中学“这个状态该怎么做”。它避开建模误差，但通常需要大量交互，也很难提前解释后果。","evidence":[{"kind":"paper","year":1992,"title":"Q-learning","url":"https://link.springer.com/article/10.1007/BF00992698","note":"Q-learning 不学习显式环境模型，直接从转移经验更新最优动作价值，是 Model-Free RL 的经典原始工作。"},{"kind":"paper","year":2015,"title":"Human-level control through deep reinforcement learning","url":"https://www.nature.com/articles/nature14236","note":"深度网络从像素学习价值函数，打通感知与控制。"}],"actors":[{"name":"Christopher Watkins","role":"理论奠基","kind":"人物","url":"https://link.springer.com/article/10.1007/BF00992698","note":"Q-learning 证明不必先学习环境动力学，也能直接从状态、动作和回报更新最优行动价值。","sourceTitle":"Q-learning","year":1992}]},{"id":"tech-model-based-rl","label":"Model-Based RL / 基于模型的强化学习","en":"Model-Based Reinforcement Learning","entityKind":"technical_route","status":"established","x":4430,"y":3580,"w":295,"h":76,"summary":"学习或使用环境模型，在真正行动前预测后果与规划。","why":"无模型方法必须通过大量昂贵或危险的真实交互学习。","mechanism":"估计动作引起的状态转移与奖励，再在模型中搜索、优化或生成想象经验。","changed":"同一经验可被反复用于规划，显著提升样本效率。","limits":"模型误差会在长时规划中累积，策略也可能钻学习模型的漏洞。","plainLanguage":"基于模型的强化学习先学环境大致怎样变化，再在内部模型里试动作和做规划。好处是能提前推演，风险是模型一旦学错，规划会利用这些错误。","evidence":[{"kind":"paper","year":1990,"title":"Integrated Modeling and Control Based on Reinforcement Learning and Dynamic Programming","url":"https://papers.nips.cc/paper_files/paper/1990/hash/d9fc5b73a8d78fad3d6dffe419384e70-Abstract.html","note":"Dyna 已把真实试错、学习到的动作条件模型和内部规划放进同一闭环，是现代 model-based RL 的直接源流。"},{"kind":"paper","year":2018,"title":"Learning Latent Dynamics for Planning from Pixels","url":"https://arxiv.org/abs/1811.04551","note":"PlaNet 从交互中学习动作条件的潜空间动力学，并直接在潜空间在线规划。"},{"kind":"paper","year":2019,"title":"Dream to Control: Learning Behaviors by Latent Imagination","url":"https://arxiv.org/abs/1912.01603","note":"Dreamer 在学习到的潜空间世界模型里展开想象轨迹，并用其优化 actor 与 critic。"}],"actors":[{"name":"Richard Sutton","role":"理论奠基","kind":"人物","url":"https://papers.nips.cc/paper_files/paper/1990/hash/d9fc5b73a8d78fad3d6dffe419384e70-Abstract.html","note":"Dyna 把真实经验学习、环境模型学习和模型内规划放进同一循环，确立基于模型强化学习的基本结构。","sourceTitle":"Integrated Modeling and Control Based on Reinforcement Learning and Dynamic Programming","year":1990}]},{"id":"cap-superhuman-decision","label":"可在巨大决策空间中达到高水平","en":"High-Performance Decisions in Vast Spaces","entityKind":"capability_outcome","status":"established","x":4840,"y":3400,"w":298,"h":76,"summary":"学习到的先验与搜索结合，避免穷举全部行动。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-world-prediction","label":"预测世界与行动后果","en":"World & Consequence Prediction","entityKind":"composite_capability","status":"established","x":1550,"y":3720,"w":233,"h":74,"summary":"形成能支持预测、反事实比较和规划的内部世界模型。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-trial-and-error","label":"真实试错慢、贵且危险","en":"Costly Trial and Error","entityKind":"problem","status":"established","x":1960,"y":3720,"w":254,"h":66,"summary":"智能体需要在行动前模拟可能后果。","why":"智能体需要在行动前模拟可能后果。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-action-conditioned-world","label":"Action Conditioning / 动作条件动力学","en":"Action Conditioning for World Models","entityKind":"enabler","status":"established","x":2380,"y":3720,"w":300,"h":76,"summary":"明确建模“采取动作 a 后，状态或观测会怎样变化”。","why":"被动时间预测无法区分环境自行变化与 Agent 动作造成的变化。","mechanism":"把当前状态与动作共同输入转移模型，预测下一状态、观测、奖励或抽象表征。","changed":"世界模型获得反事实动作接口，成为规划、控制和交互模拟的共同使能条件。","limits":"动作数据昂贵且跨机体不统一；条件预测仍不等于识别了真实因果机制。","plainLanguage":"只预测下一帧还不够，Agent 需要知道“如果我做这个动作，世界会怎么变”。动作条件模型把行动明确放进预测条件，建立世界模型与控制之间的共同接口。","evidence":[{"kind":"paper","year":1990,"title":"Integrated Modeling and Control Based on Reinforcement Learning and Dynamic Programming","url":"https://papers.nips.cc/paper_files/paper/1990/hash/d9fc5b73a8d78fad3d6dffe419384e70-Abstract.html","note":"Dyna 已把真实试错、学习到的动作条件模型和内部规划放进同一闭环，是现代 model-based RL 的直接源流。"},{"kind":"paper","year":2015,"title":"Action-Conditional Video Prediction using Deep Networks in Atari Games","url":"https://arxiv.org/abs/1507.08750","note":"证明高维视频预测可以显式以控制动作作为条件；动作条件建模早于 JEPA 路线。"},{"kind":"paper","year":2018,"title":"Learning Latent Dynamics for Planning from Pixels","url":"https://arxiv.org/abs/1811.04551","note":"PlaNet 从交互中学习动作条件的潜空间动力学，并直接在潜空间在线规划。"}],"actors":[{"name":"Junhyuk Oh 等","role":"关键推进","kind":"人物","url":"https://arxiv.org/abs/1507.08750","note":"把动作显式作为视频预测条件，让模型学到“采取这个动作之后画面怎样变化”，而不是只外推被动视频。","sourceTitle":"Action-Conditional Video Prediction using Deep Networks in Atari Games","year":2015},{"name":"1X","role":"公司路线","kind":"Neo Lab","url":"https://www.1x.tech/1x-world-model.pdf","note":"1X World Model 把当前图像与输入动作作为条件，预测未来机器人观测和任务级状态价值；它直接学习的是“做这个动作后会看到什么”。","sourceTitle":"1X World Model: Evaluating Bits, not Atoms","year":2025},{"name":"Odyssey","role":"公司路线","kind":"Neo Lab","url":"https://odyssey.ml/introducing-odyssey-1","note":"Odyssey-1 把当前状态、动作和历史状态动作一起输入，逐帧预测下一状态；公司明确把世界模型定义为动作条件动力学，而非一次性视频生成。","sourceTitle":"Introducing Odyssey-1: A Playable World Model","year":2025}]},{"id":"problem-world-prediction-choice","label":"关键分叉：模型究竟需要预测什么？","en":"What Must a World Model Predict?","entityKind":"problem","status":"established","x":2790,"y":3720,"w":298,"h":76,"summary":"控制、搜索、理解与生成环境需要保留的未来信息并不相同。","why":"不同任务需要的未来表征不同，因此这里不是一条架构逐代替代另一条架构的单线历史。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-latent-world-models","label":"Latent Dynamics / 潜空间动力学","en":"Action-Conditioned Latent Dynamics","entityKind":"technical_route","status":"established","x":3200,"y":3380,"w":300,"h":76,"summary":"把高维观测压缩成 latent state，并学习该状态在动作作用下如何变化。","why":"从像素直接做多步规划成本高，也容易把容量浪费在与决策无关的纹理。","mechanism":"编码器形成紧凑状态，动作条件的转移模型预测下一 latent、奖励或终止信号。","changed":"Agent 可以在紧凑状态空间做规划或生成想象经验。","limits":"latent 是否保留任务关键变量并无保证，长程 rollout 仍会漂移。","plainLanguage":"逐像素预测未来太贵，也会把精力花在无关细节上。潜空间世界模型先把环境压缩成内部状态，再在这个较小空间里预测和规划。","evidence":[{"kind":"paper","year":2018,"title":"World Models","url":"https://arxiv.org/abs/1803.10122","note":"在压缩潜空间中学习环境动力学并训练控制器。"},{"kind":"paper","year":2018,"title":"Learning Latent Dynamics for Planning from Pixels","url":"https://arxiv.org/abs/1811.04551","note":"PlaNet 从交互中学习动作条件的潜空间动力学，并直接在潜空间在线规划。"}],"actors":[{"name":"David Ha & Jürgen Schmidhuber","role":"标志性提出","kind":"人物","url":"https://arxiv.org/abs/1803.10122","note":"World Models 把视觉压缩、潜空间动力学和控制器拆开，展示 Agent 可以在内部生成的低维世界里学习行为。","sourceTitle":"World Models","year":2018}]},{"id":"tech-value-equivalent-model","label":"MuZero / 决策等价模型","en":"Value-Equivalent World Models","entityKind":"technical_route","status":"established","x":3200,"y":3550,"w":256,"h":74,"summary":"只学习规划所需的奖励、价值和策略，而不重建完整观测。","why":"精确预测所有像素并非决策所必需，反而增加建模难度。","mechanism":"表示函数、动力学函数和预测头共同训练，使隐状态对搜索的价值等价。","changed":"世界模型可以围绕决策充分性而非视觉保真度设计。","limits":"隐状态缺少直观解释，仍依赖可模拟搜索和清晰奖励。","plainLanguage":"做决策不一定要重建完整世界，只需保留会影响奖励、价值和策略的信息。MuZero 这类模型学习“对规划够用”的内部世界，而不是追求画面逼真。","evidence":[{"kind":"paper","year":2020,"title":"Mastering Atari, Go, chess and shogi by planning with a learned model","url":"https://www.nature.com/articles/s41586-020-03051-4","note":"只学习规划所需的奖励、价值与策略，而非完整重建环境。"}],"actors":[{"name":"Google DeepMind","role":"提出者","kind":"Frontier Lab","url":"https://www.nature.com/articles/s41586-020-03051-4","note":"MuZero 不要求重建完整环境，只学习足够支持奖励、价值与策略规划的内部动力学。","sourceTitle":"Mastering Atari, Go, chess and shogi by planning with a learned model","year":2020}]},{"id":"tech-jepa","label":"JEPA / 表征空间预测","en":"Joint-Embedding Predictive Architecture","entityKind":"technical_route","status":"frontier","x":3200,"y":3720,"w":239,"h":74,"summary":"在抽象表征空间预测被遮挡或未来部分，而非生成全部像素。","why":"像素级重建会过度关注纹理噪声，不一定学到对象与语义结构。","mechanism":"上下文编码器预测目标编码器的 latent representation，并避免逐像素解码。","changed":"形成一条面向理解的非生成式预测路线；I-JEPA 与 V-JEPA 首先解决表征学习，而非控制。","limits":"无动作版本只能从观察中学习共现；什么表征足以支持规划仍需验证。","plainLanguage":"有些未来细节根本无法准确猜出，硬生成像素反而会分散注意力。JEPA 只预测未来在抽象表示上应具有什么关键信息。","evidence":[{"kind":"paper","year":2022,"title":"A Path Towards Autonomous Machine Intelligence","url":"https://openreview.net/pdf?id=BZ5a1r-kVsf","note":"提出在抽象表征空间预测而非重建全部像素的 JEPA 思路。"},{"kind":"paper","year":2023,"title":"Self-Supervised Learning from Images with a Joint-Embedding Predictive Architecture","url":"https://arxiv.org/abs/2301.08243","note":"I-JEPA 验证非生成式的表征预测可以学习语义视觉表示；它首先是一条自监督表征路线。"},{"kind":"paper","year":2024,"title":"Revisiting Feature Prediction for Learning Visual Representations from Video","url":"https://arxiv.org/abs/2404.08471","note":"V-JEPA 把特征预测扩展到视频，但仍主要用于理解与预测，不接收 Agent 动作。"}],"actors":[{"name":"Meta FAIR","role":"提出与推进","kind":"Frontier Lab","url":"https://ai.meta.com/research/publications/v-jepa-2-self-supervised-video-models-enable-understanding-prediction-and-planning/","note":"沿 JEPA 路线在表征空间预测视频中重要但不可见的状态。","sourceTitle":"V-JEPA 2","year":2025}]},{"id":"tech-interactive-world-model","label":"Generative Interactive Worlds / 生成式交互世界","en":"Generative Interactive World Models","entityKind":"technical_route","status":"frontier","x":3200,"y":3890,"w":276,"h":76,"summary":"在用户或 Agent 控制下实时生成连贯、可探索的动态环境。","why":"普通视频生成只续写观察，无法成为可行动、可反事实查询的环境。","mechanism":"结合视频生成、动作条件或 latent action、状态记忆，递推生成动作后的下一世界状态。","changed":"世界模型成为可交互模拟器，可用于环境创作以及 Agent 训练与评估。","limits":"视觉逼真不等于物理真实；对象恒常、长时一致性、实时性和可验证性仍是硬瓶颈。","plainLanguage":"普通视频只能播放既定内容，生成式交互世界希望用户一边行动，画面和环境一边继续生成。它更像可操控的模拟器，但长期一致性和真实物理仍处在前沿阶段。","evidence":[{"kind":"paper","year":2024,"title":"Genie: Generative Interactive Environments","url":"https://deepmind.google/research/publications/60474/","note":"从无动作标签的互联网视频中学习 latent action，生成可逐帧控制的交互环境。"},{"kind":"technical report","year":2024,"title":"Genie 2: A large-scale foundation world model","url":"https://deepmind.google/blog/genie-2-a-large-scale-foundation-world-model/","note":"把生成式交互世界扩展到多样、可控制的三维环境，同时暴露长时一致性限制。"},{"kind":"technical report","year":2025,"title":"Genie 3: A new frontier for world models","url":"https://deepmind.google/blog/genie-3-a-new-frontier-for-world-models/","note":"推进到实时交互和分钟级一致性，但仍不能等同于可靠的物理模拟器。"},{"kind":"paper","year":2025,"title":"A generative model of the world from video","url":"https://www.nature.com/articles/s41586-025-08600-3","note":"从视频学习可交互、可生成的时空环境模型。"}],"actors":[{"name":"Google DeepMind / Genie","role":"推进者","kind":"Frontier Lab","url":"https://deepmind.google/blog/genie-2-a-large-scale-foundation-world-model/","note":"Genie 从视频学习可控制环境，并把生成世界作为 Agent 的训练与评估空间。","sourceTitle":"Genie 2","year":2024},{"name":"World Labs","role":"公司路线","kind":"Neo Lab","url":"https://www.worldlabs.ai/blog/marble-world-model","note":"Marble 从文本、图像和视频生成可持续浏览、编辑和导出的 3D 世界。","sourceTitle":"Marble: A Multimodal World Model","year":2025},{"name":"Decart","role":"公司路线","kind":"Neo Lab","url":"https://decart.ai/","note":"Oasis 把低延迟生成视频做成由用户动作实时驱动的交互世界模型。","sourceTitle":"Oasis interactive world model","year":2024},{"name":"Runway","role":"公司路线","kind":"Frontier Lab","url":"https://runwayml.com/","note":"Runway 的 GWM-1 被明确设计为实时、可探索、可控制的通用世界模型，并分为可交互世界、虚拟人物和机器人三个方向。","sourceTitle":"Introducing GWM-1","year":2025},{"name":"Odyssey","role":"公司路线","kind":"Neo Lab","url":"https://odyssey.ml/introducing-odyssey-1","note":"Odyssey-1 根据用户实时动作每 40ms 生成下一帧，能够连续输出数分钟；交互输入会立刻改变模型生成的后续世界。","sourceTitle":"Introducing Odyssey-1: A Playable World Model","year":2025}]},{"id":"tech-world-action-model","label":"World–Action Joint Models / WAM","en":"World–Action Joint Models","entityKind":"technical_route","status":"frontier","x":3200,"y":4060,"w":300,"h":76,"summary":"在同一模型里联合学习世界变化与行动分布的前沿方向。","why":"世界预测与策略往往分别训练，预测结果难以自然成为可执行动作。","mechanism":"共享序列或 latent 同时建模观测、动作、奖励与未来，并在生成和控制目标间联合优化。","changed":"有望把世界模拟、规划与策略统一到同一生成式接口。","limits":"WAM 尚不是边界稳定的单一架构；可靠性、实时控制和评测都处于早期。","plainLanguage":"传统系统把世界预测和动作策略分成两个模块。WAM 尝试把“世界接下来怎样”和“Agent 接下来怎样做”放进同一个生成模型里联合学习。","evidence":[{"kind":"paper","year":2025,"title":"JOWA: Jointly Optimized World-Action Model","url":"https://proceedings.iclr.cc/paper_files/paper/2025/file/689cffc97600f9deb8374fc8fa918b8e-Paper-Conference.pdf","note":"World–Action 联合建模的代表性近期工作；该术语仍未完全收敛。"}],"actors":[{"name":"Jie Cheng 等 / JOWA","role":"提出者","kind":"研究团队","url":"https://proceedings.iclr.cc/paper_files/paper/2025/file/689cffc97600f9deb8374fc8fa918b8e-Paper-Conference.pdf","note":"用共享 Transformer 同时优化世界预测和动作价值，在多游戏离线数据上学习可迁移的表征与决策。","sourceTitle":"Scaling Offline Model-Based RL via Jointly-Optimized World-Action Model Pretraining","year":2025}]},{"id":"tech-latent-imagination","label":"Dreamer / 潜空间想象","en":"Latent Imagination","entityKind":"technical_route","status":"established","x":3610,"y":3380,"w":243,"h":74,"summary":"在学到的 latent world model 中生成想象轨迹并训练策略。","why":"仅学会预测世界还不够，模型必须把预测转化为更好的行动。","mechanism":"从当前 latent 展开多步 imagined rollout，用预测回报优化 actor 与 critic。","changed":"真实经验可被内部模拟反复利用，控制的样本效率显著提高。","limits":"策略可能利用模型误差；长程想象质量和现实校准仍是核心瓶颈。","plainLanguage":"Dreamer 不让 Agent 把每个候选动作都拿到现实里试，而是在学到的内部世界中先做很多次“梦”。策略主要从这些想象轨迹中学习，现实交互因此更省。","evidence":[{"kind":"paper","year":2019,"title":"Dream to Control: Learning Behaviors by Latent Imagination","url":"https://arxiv.org/abs/1912.01603","note":"Dreamer 在学习到的潜空间世界模型里展开想象轨迹，并用其优化 actor 与 critic。"}],"actors":[{"name":"Google DeepMind","role":"提出与推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/1912.01603","note":"Dreamer 在学习到的潜空间动力学里想象大量未来轨迹，再用这些想象训练策略，减少真实环境交互。","sourceTitle":"Dream to Control","year":2019}]},{"id":"problem-passive-world-model","label":"只看视频，学不到行动造成的变化","en":"Passive World Modeling","entityKind":"problem","status":"established","x":3610,"y":3720,"w":298,"h":76,"summary":"时间共现无法单独识别行动干预的因果效果。","why":"时间共现无法单独识别行动干预的因果效果。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-action-conditioned-jepa","label":"Action-Conditioned JEPA / 动作条件表征预测","en":"Action-Conditioned Predictive Representations","entityKind":"technical_route","status":"frontier","x":4020,"y":3720,"w":300,"h":76,"summary":"在大规模无动作视频表征上，再学习动作条件的 latent transition 用于规划。","why":"观察式表征预测能理解运动，却不能直接比较 Agent 候选动作的后果。","mechanism":"先用无动作视频学习抽象状态，再用少量交互轨迹让 predictor 接收动作并进行模型预测控制。","changed":"表征预测路线与经典动作条件世界模型在机器人规划处汇合。","limits":"现有结果仍以短程视觉目标为主，数据效率、长程规划和跨机体稳定性尚未确立。","plainLanguage":"普通 JEPA 预测世界会怎样变化，动作条件 JEPA 还把“做了什么”纳入预测。它关注行动后哪些抽象状态会改变，而不是把每个像素都生成出来。","evidence":[{"kind":"paper","year":2025,"title":"V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning","url":"https://ai.meta.com/research/publications/v-jepa-2-self-supervised-video-models-enable-understanding-prediction-and-planning/","note":"V-JEPA 2-AC 先以无动作视频预训练，再用少量机器人交互数据做动作条件后训练，形成表征预测与控制规划的汇合。"}],"actors":[{"name":"Meta FAIR","role":"提出与推进","kind":"Frontier Lab","url":"https://ai.meta.com/research/publications/v-jepa-2-self-supervised-video-models-enable-understanding-prediction-and-planning/","note":"V-JEPA 2-AC 在无动作视频预训练后加入少量机器人交互数据，使预测可服务规划。","sourceTitle":"V-JEPA 2","year":2025}]},{"id":"cap-planning-in-imagination","label":"行动前可在内部模型中预演","en":"Plan by Internal Simulation","entityKind":"capability_outcome","status":"established","x":4430,"y":3480,"w":298,"h":74,"summary":"Agent 可以比较想象轨迹，而不是把每个候选动作都放到现实中试。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-counterfactual-world","label":"可比较不同动作会带来什么后果","en":"Action-Sensitive Counterfactual Prediction","entityKind":"capability_outcome","status":"established","x":4430,"y":3920,"w":298,"h":76,"summary":"世界预测从被动续帧推进到对行动干预敏感。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-world-consistency","label":"共同瓶颈：长时一致性、物理真实性与可验证性不足","en":"Long-Horizon World Consistency","entityKind":"problem","status":"established","x":4840,"y":3700,"w":298,"h":76,"summary":"想象或生成的世界会随时间漂移，视觉可信也不保证动力学可用于决策。","why":"想象或生成的世界会随时间漂移，视觉可信也不保证动力学可用于决策。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-spatial-world","label":"持续的三维空间与对象表征","en":"Persistent Spatial World Representation","entityKind":"composite_capability","status":"established","x":1550,"y":4120,"w":298,"h":74,"summary":"在视角和时间变化中持续理解场景几何、对象关系和可导航空间。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-2d-observation","label":"二维观测缺乏显式三维一致性","en":"2D Observation Limitation","entityKind":"problem","status":"established","x":1960,"y":4120,"w":298,"h":76,"summary":"单帧像素难以支撑新视角、几何推理和长期空间记忆。","why":"单帧像素难以支撑新视角、几何推理和长期空间记忆。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-neural-3d","label":"Neural 3D / NeRF & 3DGS","en":"Neural 3D Representations","entityKind":"technical_route","status":"established","x":2380,"y":4120,"w":274,"h":74,"summary":"从多视角图像学习可连续查询或实时渲染的三维场景表示。","why":"二维照片没有显式保存相机移动后的几何一致性。","mechanism":"NeRF 用神经场映射位置与方向到密度和颜色；3DGS 用显式高斯基元近似辐射场。","changed":"模型能够合成一致的新视角，并形成可编辑空间资产的基础。","limits":"通常依赖多视角覆盖，动态对象、语义与长期交互仍不是表示本身解决的。","plainLanguage":"传统三维重建需要复杂几何管线，NeRF 和 3DGS 直接从多视角照片学习一个可渲染的场景。它们解决的是一致的新视角，不等于已经理解时间、行动或物理。","evidence":[{"kind":"paper","year":2020,"title":"NeRF: Representing Scenes as Neural Radiance Fields","url":"https://arxiv.org/abs/2003.08934","note":"用连续神经场实现多视角一致的新视角合成。"},{"kind":"paper","year":2023,"title":"3D Gaussian Splatting for Real-Time Radiance Field Rendering","url":"https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/","note":"以显式 3D 高斯获得实时高质量渲染。"}],"actors":[{"name":"World Labs","role":"公司路线","kind":"Neo Lab","url":"https://www.worldlabs.ai/blog/marble-world-model","note":"以多模态世界模型直接生成可导出的 Gaussian splat、mesh 与视频。","sourceTitle":"Marble: A Multimodal World Model","year":2025}]},{"id":"cap-novel-view-geometry","label":"从已有视角生成一致的新视角","en":"Novel-View Consistent Geometry","entityKind":"capability_outcome","status":"established","x":2790,"y":4120,"w":298,"h":76,"summary":"场景表示能维持相机移动后的几何一致性。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-static-scenes","label":"静态场景表征缺乏时间、对象和交互","en":"Static Scene Limitation","entityKind":"problem","status":"established","x":3200,"y":4120,"w":298,"h":76,"summary":"重建几何不等于理解动态世界如何随行动变化。","why":"重建几何不等于理解动态世界如何随行动变化。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-spatiotemporal-world","label":"Spatiotemporal World Models / 时空世界模型","en":"Spatiotemporal Generative World Models","entityKind":"technical_route","status":"frontier","x":3610,"y":4120,"w":254,"h":76,"summary":"联合保持场景的三维结构、时间变化与对象连续性。","why":"静态三维重建无法解释对象如何运动、消失、重现或受交互影响。","mechanism":"把空间表示、视频生成与持久状态结合，跨时间递推世界 latent。","changed":"环境可以作为持续变化的整体被生成与查询，而非一组独立画面。","limits":"长时记忆、遮挡后对象恒常、尺度扩展与真实物理仍不可靠。","plainLanguage":"静态三维场景不会动，也不知道物体遮住后是否还存在。时空世界模型试图同时维护空间结构、时间变化和对象连续性。","evidence":[{"kind":"paper","year":2021,"title":"D-NeRF: Neural Radiance Fields for Dynamic Scenes","url":"https://openaccess.thecvf.com/content/CVPR2021/html/Pumarola_D-NeRF_Neural_Radiance_Fields_for_Dynamic_Scenes_CVPR_2021_paper.html","note":"D-NeRF 把静态神经辐射场扩展到随时间形变的场景，直接支撑动态时空表示分支。"},{"kind":"paper","year":2025,"title":"A generative model of the world from video","url":"https://www.nature.com/articles/s41586-025-08600-3","note":"从视频学习可交互、可生成的时空环境模型。"}],"actors":[{"name":"World Labs","role":"公司路线","kind":"Neo Lab","url":"https://www.worldlabs.ai/blog/bigger-better-worlds","note":"重点推进持久、可导航、可控制且空间一致的生成式 3D 世界。","sourceTitle":"Generating Bigger and Better Worlds","year":2025},{"name":"NVIDIA Cosmos","role":"公司路线","kind":"Frontier Lab","url":"https://nvidianews.nvidia.com/news/nvidia-launches-cosmos-world-foundation-model-platform-to-accelerate-physical-ai-development","note":"Cosmos 的 World Foundation Models 面向机器人和自动驾驶生成具有物理连续性的未来视频与世界状态，并支持按真实物理任务继续训练。","sourceTitle":"NVIDIA Launches Cosmos World Foundation Model Platform","year":2025}]},{"id":"cap-persistent-generative-world","label":"世界可被持续生成，并保持空间状态","en":"Persistent Generative Worlds","entityKind":"capability_outcome","status":"established","x":4020,"y":4120,"w":298,"h":76,"summary":"模型跨时间维护场景与对象，而不是只生成互不相干的帧。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-wam-reliability","label":"动态世界仍缺少稳定的对象恒常与真实物理","en":"Persistent Spatial Reliability","entityKind":"problem","status":"established","x":4430,"y":4120,"w":298,"h":76,"summary":"时空生成可能在遮挡、长时程和交互后破坏对象身份、几何或物理规律。","why":"时空生成可能在遮挡、长时程和交互后破坏对象身份、几何或物理规律。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-embodied-generalization","label":"机器人技能向新任务与新环境迁移","en":"Generalist Embodied Intelligence","entityKind":"composite_capability","status":"established","x":1550,"y":4520,"w":298,"h":76,"summary":"让机器人理解自然指令，并把学会的技能迁移到新对象、新场景和新任务。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-robot-programming","label":"手写控制与单任务策略难扩展","en":"Task-Specific Robot Programming","entityKind":"problem","status":"established","x":1960,"y":4520,"w":298,"h":76,"summary":"每个任务单独编程无法覆盖开放世界中的组合变化。","why":"每个任务单独编程无法覆盖开放世界中的组合变化。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-imitation-learning","label":"Imitation Learning / 模仿学习","en":"Imitation Learning and Behavior Cloning","entityKind":"technical_route","status":"established","x":2380,"y":4440,"w":290,"h":76,"summary":"从专家示范中直接学习观测到动作的映射。","why":"机器人手工规则难覆盖复杂感知和接触行为，而在线试错又昂贵危险。","mechanism":"Behavior Cloning 把示范当监督数据；DAgger 等方法再收集学习策略访问到的状态进行纠正。","changed":"机器人技能可以从人类遥操作或历史轨迹中批量获得。","limits":"一旦偏离示范分布，错误会累积；模型也可能复制示范者的次优行为。","plainLanguage":"最直接的机器人学习方式，是看人或专家怎么做，再照着学。它能批量利用示范，但机器人一旦走到示范没覆盖的状态，错误容易越积越多。","evidence":[{"kind":"paper","year":2011,"title":"A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning","url":"https://proceedings.mlr.press/v15/ross11a.html","note":"DAgger 直接刻画行为克隆的分布偏移与误差复利，并给出交互式纠正路线。"}],"actors":[{"name":"Stéphane Ross, Geoffrey Gordon & Drew Bagnell / Carnegie Mellon","role":"关键推进","kind":"人物与 Lab","url":"https://proceedings.mlr.press/v15/ross11a.html","note":"DAgger 让学习到的策略不断收集自己会访问的状态，并请求专家补标签，直接处理行为克隆的分布偏移。","sourceTitle":"A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning","year":2011}]},{"id":"tech-offline-rl","label":"Offline RL / 离线强化学习","en":"Offline Reinforcement Learning","entityKind":"technical_route","status":"established","x":2380,"y":4600,"w":295,"h":68,"summary":"只用固定历史数据优化策略，不在训练期间继续探索环境。","why":"真实机器人在线试错成本高，但组织通常已有大量日志与失败轨迹。","mechanism":"学习价值或策略时约束其不要过度依赖数据集中未覆盖的动作。","changed":"历史数据中的奖励与失败经验可以超越纯模仿被利用。","limits":"分布外动作的价值会被高估；离线评估无法完全替代真实部署验证。","plainLanguage":"组织常有大量历史操作数据，却不敢让机器人在线乱试。离线强化学习只用这些固定日志学习策略，并尽量避免相信数据里没出现过的动作。","evidence":[{"kind":"paper","year":2019,"title":"Off-Policy Deep Reinforcement Learning without Exploration","url":"https://proceedings.mlr.press/v97/fujimoto19a.html","note":"BCQ 直接揭示固定数据上的外推误差，并用 batch constraint 限制数据分布外动作。"}],"actors":[{"name":"Scott Fujimoto, David Meger & Doina Precup","role":"关键推进","kind":"人物","url":"https://proceedings.mlr.press/v97/fujimoto19a.html","note":"BCQ 通过限制策略只选择离线数据支持的动作，降低对数据分布之外 Q 值的错误高估。","sourceTitle":"Off-Policy Deep Reinforcement Learning without Exploration","year":2019}]},{"id":"cap-learned-robot-policy","label":"机器人动作可以从数据中学习","en":"Learn Robot Policies from Data","entityKind":"capability_outcome","status":"established","x":2790,"y":4520,"w":298,"h":76,"summary":"控制不再完全依赖手工状态机和逐任务编程。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-robot-data","label":"真实机器人数据稀缺且机体割裂","en":"Robot Data Bottleneck","entityKind":"problem","status":"established","x":3200,"y":4520,"w":298,"h":76,"summary":"采集慢、成本高，不同机器人和任务的数据难共享。","why":"采集慢、成本高，不同机器人和任务的数据难共享。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-simulation-sim2real","label":"Simulation & Sim-to-Real / 仿真迁移","en":"Simulation, Domain Randomization and Sim-to-Real","entityKind":"technical_route","status":"established","x":3610,"y":4420,"w":300,"h":76,"summary":"先在可大规模试错的模拟器中训练，再把策略迁移到真实机器人。","why":"现实采集慢、贵、危险，也难覆盖长尾失败。","mechanism":"在仿真中并行生成经验，并通过域随机化、系统辨识或适配缩小现实差距。","changed":"训练数据与探索规模不再完全受真实硬件吞吐限制。","limits":"模拟器遗漏的接触、传感器和环境细节会造成 reality gap。","plainLanguage":"真实机器人试错慢、贵又危险，所以先在模拟器里大规模练习，再迁移到现实。最大难点是模拟世界与真实接触、传感器和环境之间始终有差距。","evidence":[{"kind":"paper","year":2017,"title":"Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World","url":"https://arxiv.org/abs/1703.06907","note":"通过随机化仿真外观缩小 sim-to-real 差距。"}],"actors":[{"name":"Skild AI","role":"公司路线","kind":"Neo Lab","url":"https://www.skild.ai/blogs/omni-bodied","note":"在大规模仿真中训练跨十万种机器人形态的控制策略，再验证零样本本体适应。","sourceTitle":"The case for an omni-bodied robot brain","year":2025},{"name":"NVIDIA Cosmos","role":"公司路线","kind":"Frontier Lab","url":"https://nvidianews.nvidia.com/news/nvidia-launches-cosmos-world-foundation-model-platform-to-accelerate-physical-ai-development","note":"Cosmos 把可控世界生成、视频数据处理和 Omniverse 仿真接在一起，用大量合成场景训练和评估机器人与自动驾驶模型，再把能力迁移到真实系统。","sourceTitle":"NVIDIA Launches Cosmos World Foundation Model Platform","year":2025}]},{"id":"tech-robot-foundation","label":"Robot Foundation Models / 机器人基础模型","en":"Cross-Embodiment Robot Foundation Models","entityKind":"technical_route","status":"frontier","x":3610,"y":4620,"w":290,"h":76,"summary":"在多任务、多环境甚至多种机器人数据上预训练可迁移策略。","why":"单台机器人、单个任务的数据太少，策略和机体绑定后无法复用。","mechanism":"统一不同数据集的观测与动作表示，并以大模型吸收跨任务规律。","changed":"机器人学习开始获得类似语言模型的“预训练底座 + 下游适配”路径。","limits":"动作空间和传感器仍不统一，跨机体迁移收益会被数据质量和物理差异限制。","plainLanguage":"单台机器人、单个任务的数据太少，学到的技能也难复用。机器人基础模型把多任务、多环境甚至多种机体的数据汇到一个预训练底座上。","evidence":[{"kind":"paper","year":2024,"title":"Open X-Embodiment: Robotic Learning Datasets and RT-X Models","url":"https://arxiv.org/abs/2310.08864","note":"跨机构、跨机体数据与模型推动机器人策略迁移。"}],"actors":[{"name":"Physical Intelligence","role":"公司路线","kind":"Neo Lab","url":"https://www.physicalintelligence.company/download/pi05.pdf","note":"π0.5 将跨机器人数据、VLM 语义与连续动作专家组合成通用机器人策略。","sourceTitle":"π0.5","year":2025},{"name":"Skild AI","role":"公司路线","kind":"Neo Lab","url":"https://www.skild.ai/blogs/building-the-general-purpose-robotic-brain","note":"以仿真、互联网视频和真实机器人数据训练跨任务、跨本体的统一机器人基模。","sourceTitle":"Building the general-purpose robotic brain","year":2025},{"name":"Figure","role":"公司路线","kind":"Neo Lab","url":"https://www.figure.ai/news/helix","note":"Helix 用同一组权重覆盖多种操作和两台机器人协作，不为每个任务单独微调；它把通用语义知识与可复用机器人控制接成预训练底座。","sourceTitle":"Helix: A Vision-Language-Action Model for Generalist Humanoid Control","year":2025},{"name":"Generalist","role":"公司路线","kind":"Neo Lab","url":"https://generalistai.com/blog/gen-0","note":"GEN-0 直接在大规模真实物理交互上预训练，并报告跨 6DoF、7DoF 与半人形机器人迁移；其核心主张是机器人能力也会随数据、算力和模型规模稳定增长。","sourceTitle":"GEN-0: Embodied Foundation Models That Scale with Physical Interaction","year":2025},{"name":"Covariant","role":"公司路线","kind":"Frontier Lab","url":"https://covariant.ai/our-approach/","note":"Covariant 把 RFM-1 定义为其首个商业机器人基础模型，并以多年仓储机器人部署作为路线背景；当前公开页未披露足够架构与训练细节，因此这里只把它作为路线证据，不把性能主张视为已验证事实。","sourceTitle":"Covariant launches RFM-1","year":2024}]},{"id":"problem-semantic-action-gap","label":"互联网语义知识与连续动作脱节","en":"Semantic–Action Gap","entityKind":"problem","status":"established","x":4020,"y":4520,"w":298,"h":76,"summary":"VLM 知道对象和语言，却没有机器人动作接口与控制经验。","why":"VLM 知道对象和语言，却没有机器人动作接口与控制经验。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-vla","label":"VLA / Vision–Language–Action","en":"Vision–Language–Action Models","entityKind":"technical_route","status":"frontier","x":4430,"y":4520,"w":290,"h":76,"summary":"把图像、语言指令与机器人动作放进同一序列模型。","why":"互联网预训练有丰富语义知识，却不会直接输出连续、具身的动作。","mechanism":"将动作离散为 token 或专门 action head，并与视觉语言 token 联合预测。","changed":"自然语言可以指定机器人任务，语义概念也能迁移到操作策略。","limits":"离散 token 难覆盖高频精密控制；互联网知识与真实动力学仍有巨大鸿沟。","plainLanguage":"视觉语言模型知道“看到了什么、指令是什么意思”，但不会直接控制机器人。VLA 把图像、语言和动作放进同一模型，让自然语言能够调动真实操作。","evidence":[{"kind":"paper","year":2023,"title":"RT-2: Vision-Language-Action Models","url":"https://robotics-transformer2.github.io/","note":"把机器人动作表示为 token，使视觉语言预训练可迁移到控制。"}],"actors":[{"name":"Google DeepMind","role":"提出者","kind":"Frontier Lab","url":"https://robotics-transformer2.github.io/","note":"RT-2 把动作表示为 token，使视觉语言知识可以迁移到机器人控制。","sourceTitle":"RT-2: Vision-Language-Action Models","year":2023},{"name":"Physical Intelligence","role":"公司路线","kind":"Neo Lab","url":"https://www.physicalintelligence.company/download/pi0.pdf","note":"π0 在预训练 VLM 上加入连续动作专家，面向多机器人、多任务泛化。","sourceTitle":"π0","year":2024},{"name":"Figure","role":"公司路线","kind":"Neo Lab","url":"https://www.figure.ai/news/helix","note":"Helix 用较慢的视觉语言模型产生语义目标，再由 200Hz 的视觉运动策略把目标变成连续上肢动作；这是一条明确的语言到机器人控制 VLA 路线。","sourceTitle":"Helix: A Vision-Language-Action Model for Generalist Humanoid Control","year":2025}]},{"id":"cap-semantic-robot-policy","label":"机器人能按语言迁移到更多任务","en":"Semantically Generalist Robot Policies","entityKind":"capability_outcome","status":"established","x":4840,"y":4520,"w":298,"h":76,"summary":"视觉语言知识开始成为理解任务和迁移技能的共同接口。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-multimodal-actions","label":"动作分布多峰、连续且长时依赖","en":"Multimodal Continuous Actions","entityKind":"problem","status":"established","x":5250,"y":4420,"w":298,"h":76,"summary":"同一目标可能有多条有效轨迹，逐步回归容易平均化或抖动。","why":"同一目标可能有多条有效轨迹，逐步回归容易平均化或抖动。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-generative-policy","label":"Generative Action Policies / 生成式动作策略","en":"Generative Action Policies","entityKind":"technical_route","status":"frontier","x":5660,"y":4420,"w":300,"h":76,"summary":"用 Diffusion 或 Flow 等生成模型表示多峰、连续的动作序列。","why":"同一观测往往有多种合理动作，回归平均值会生成不可执行的折中动作。","mechanism":"条件生成模型一次产生动作 chunk 或轨迹，并在推理时采样、重规划。","changed":"策略可以表达多种行为模式，并生成平滑、协调的连续控制。","limits":"多步采样带来延迟，长程任务仍需要更高层规划与闭环纠错。","plainLanguage":"同一个场景往往有多种合理动作，简单取平均反而可能生成谁都不会做的动作。生成式策略直接学习多种完整动作序列，再从中采样和重规划。","evidence":[{"kind":"paper","year":2023,"title":"Diffusion Policy","url":"https://arxiv.org/abs/2303.04137","note":"用条件扩散表达多峰、高维连续动作分布。"}],"actors":[{"name":"Physical Intelligence","role":"公司路线","kind":"Neo Lab","url":"https://www.physicalintelligence.company/download/pi0.pdf","note":"以 flow matching 生成连续动作块，保留灵巧操作所需的多峰动作分布。","sourceTitle":"π0","year":2024}]},{"id":"problem-demonstration-ceiling","label":"示范分布外失败，策略难自我纠正","en":"Demonstration Ceiling","entityKind":"problem","status":"established","x":5250,"y":4620,"w":298,"h":76,"summary":"只模仿成功样本，无法从失败、探索和真实反馈持续改进。","why":"只模仿成功样本，无法从失败、探索和真实反馈持续改进。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-real-world-rl","label":"Real-World RL / 真实世界策略后训练","en":"Real-World RL and Policy Post-Training","entityKind":"technical_route","status":"frontier","x":5660,"y":4620,"w":300,"h":76,"summary":"让机器人在部署环境中利用结果反馈继续改进策略。","why":"示范与离线数据无法覆盖真实运行遇到的全部状态和失败。","mechanism":"在安全约束、重置机制和人类监督下进行在线强化学习或后训练。","changed":"策略可以修正示范分布外错误，并适应具体硬件与环境。","limits":"物理试错不可逆，奖励难写，数据吞吐与安全审查仍是硬边界。","plainLanguage":"示范和离线数据永远覆盖不了真实部署中的所有失败。真实世界 RL 让机器人在安全约束和监督下，根据实际结果继续修正策略。","evidence":[{"kind":"paper","year":2018,"title":"QT-Opt: Scalable Deep Reinforcement Learning for Vision-Based Robotic Manipulation","url":"https://arxiv.org/abs/1806.10293","note":"大规模真实机器人交互和闭环强化学习的代表工作，早于当前 VLA 后训练叙事。"}],"actors":[{"name":"Google Robotics","role":"规模化实践","kind":"Frontier Lab","url":"https://arxiv.org/abs/1806.10293","note":"QT-Opt 在真实机器人集群上积累大规模抓取经验，证明深度强化学习可以跨机器并行训练真实操作策略。","sourceTitle":"QT-Opt","year":2018}]},{"id":"problem-embodied-safety","label":"物理试错不可逆，长期泛化仍不可靠","en":"Embodied Safety Boundary","entityKind":"problem","status":"established","x":6070,"y":4520,"w":298,"h":76,"summary":"现实部署要求低延迟、可恢复、安全验证和跨环境鲁棒性。","why":"现实部署要求低延迟、可恢复、安全验证和跨环境鲁棒性。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-trustworthy-intelligence","label":"可评价、可校正的模型行为","en":"Evaluable & Correctable Intelligence","entityKind":"composite_capability","status":"established","x":1550,"y":4920,"w":298,"h":74,"summary":"识别模型何时可能失败、解释失败原因，并让外部监督能够纠正它。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-benchmark-gap","label":"离线指标不能代表开放环境可靠性","en":"Benchmark–Reality Gap","entityKind":"problem","status":"established","x":1960,"y":4720,"w":298,"h":76,"summary":"平均分掩盖分布外、对抗和长程失败。","why":"平均分掩盖分布外、对抗和长程失败。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-black-box","label":"内部表征和失效因果难理解","en":"Black-Box Failure","entityKind":"problem","status":"established","x":1960,"y":4920,"w":298,"h":66,"summary":"仅看输入输出难定位模型为何形成危险行为。","why":"仅看输入输出难定位模型为何形成危险行为。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-supervision-scale","label":"模型能力超过人工逐步监督","en":"Scalable Supervision","entityKind":"problem","status":"established","x":1960,"y":5120,"w":298,"h":66,"summary":"复杂输出和长期行动无法由人类逐项验证。","why":"复杂输出和长期行动无法由人类逐项验证。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-uncertainty-calibration","label":"Uncertainty & Calibration / 不确定性校准","en":"Uncertainty Estimation and Calibration","entityKind":"technical_route","status":"established","x":2380,"y":4640,"w":293,"h":76,"summary":"让模型置信度尽量反映真实正确概率，并识别未知输入。","why":"高分不等于可靠，模型在分布外也可能给出非常自信的错误。","mechanism":"通过概率校准、集成、贝叶斯近似或选择性预测估计认知与数据不确定性。","changed":"系统可以据置信度拒答、求助或升级人工处理。","limits":"神经网络常在分布变化下失准，单一概率也无法概括所有失效类型。","plainLanguage":"模型说得很自信，不代表它真的更可能正确。不确定性校准希望让置信度更接近真实风险，从而决定何时回答、复核或交给人。","evidence":[{"kind":"paper","year":2017,"title":"On Calibration of Modern Neural Networks","url":"https://arxiv.org/abs/1706.04599","note":"系统刻画现代深网置信度与真实正确率的不一致。"}],"actors":[{"name":"Chuan Guo, Geoff Pleiss, Yu Sun & Kilian Weinberger","role":"关键推进","kind":"人物","url":"https://arxiv.org/abs/1706.04599","note":"系统揭示现代深网置信度常常过高，并证明简单温度缩放就能显著改善概率校准。","sourceTitle":"On Calibration of Modern Neural Networks","year":2017}]},{"id":"tech-adversarial-robustness","label":"Adversarial Robustness / 对抗鲁棒性","en":"Adversarial Robustness","entityKind":"technical_route","status":"established","x":2380,"y":4800,"w":283,"h":76,"summary":"训练并评估模型抵抗刻意构造的小扰动与攻击。","why":"人眼几乎看不出的输入变化就可能让深网产生完全不同的预测。","mechanism":"生成最坏情况扰动进行对抗训练，并用认证或检测方法约束敏感性。","changed":"安全评测从平均准确率扩展到有敌手时的最坏情况行为。","limits":"防御常只覆盖特定威胁模型，并可能牺牲干净数据性能或被新攻击绕过。","plainLanguage":"有些人眼几乎看不出的改动，会让模型判断完全相反。对抗鲁棒性研究最坏情况下怎样攻击和训练模型，而不只看平均准确率。","evidence":[{"kind":"paper","year":2015,"title":"Explaining and Harnessing Adversarial Examples","url":"https://arxiv.org/abs/1412.6572","note":"揭示神经网络在微小定向扰动下的脆弱性。"}],"actors":[{"name":"Ian Goodfellow, Jonathon Shlens & Christian Szegedy","role":"标志性提出","kind":"人物","url":"https://arxiv.org/abs/1412.6572","note":"用线性解释和快速梯度方法展示极小输入扰动也能系统性欺骗深网，确立对抗鲁棒性问题。","sourceTitle":"Explaining and Harnessing Adversarial Examples","year":2014}]},{"id":"tech-interpretability","label":"Mechanistic Interpretability / 机制可解释性","en":"Interpretability and Mechanistic Analysis","entityKind":"technical_route","status":"frontier","x":2380,"y":4960,"w":293,"h":99,"summary":"分析模型内部哪些表示与计算导致某个输出或失效。","why":"只看输入输出无法定位错误因果，也难判断模型是否依赖了错误线索。","mechanism":"用归因、探针、特征分解、因果干预或电路分析检查内部计算。","changed":"研究者可以提出更具体的机制假设，并对部分行为做局部审计。","limits":"解释方法可能不忠实，规模化到大模型全局行为仍非常困难。","plainLanguage":"只看输入和输出，很难知道模型为何成功或失败。机制可解释性试图打开内部计算，找出哪些表示、特征或计算回路真正影响了结果。","evidence":[{"kind":"paper","year":2021,"title":"A Mathematical Framework for Transformer Circuits","url":"https://transformer-circuits.pub/2021/framework/index.html","note":"以可组合电路分析 Transformer 内部机制的代表性工作。"}],"actors":[{"name":"Anthropic","role":"前沿推进","kind":"Frontier Lab","url":"https://www.anthropic.com/research/decomposing-language-models-into-understandable-components","note":"用字典学习把叠加的神经激活分解成更可解释的特征，是其长期安全研究主张。","sourceTitle":"Towards Monosemanticity","year":2023},{"name":"Goodfire","role":"公司路线","kind":"Neo Lab","url":"https://www.goodfire.ai/research/open-problems-in-mech-interp","note":"围绕机制可解释性的关键未解问题建设模型理解与干预工具。","sourceTitle":"Open Problems in Mechanistic Interpretability","year":2025},{"name":"Transluce","role":"研究推进","kind":"Lab","url":"https://github.com/TransluceAI/circuits","note":"Transluce 的 ADAG 工具链沿 MLP 神经元追踪归因、聚类激活模式并自动生成自然语言解释，把电路分析做成可重复运行的公开基础设施。","sourceTitle":"ADAG: Automatically Describing Attribution Graphs","year":2026}]},{"id":"tech-scalable-oversight","label":"Scalable Oversight / 可扩展监督","en":"Scalable Oversight and AI Feedback","entityKind":"technical_route","status":"frontier","x":2380,"y":5120,"w":290,"h":76,"summary":"用分解、AI 辅助评价或弱监督来监督超过个人直接判断能力的模型。","why":"模型能力提高后，人类无法逐步检查所有推理与行动。","mechanism":"把任务拆小、让模型互审、用宪法规则或弱模型反馈放大监督信号。","changed":"人类监督可以从亲自完成任务转向设计和审计评价过程。","limits":"监督链可能共同犯错，强模型也可能学习迎合或操纵评价器。","plainLanguage":"当模型比单个人更会做某项任务时，人就无法逐步亲自判卷。可扩展监督通过拆任务、AI 互审和规则化评价，把人的监督能力放大。","evidence":[{"kind":"paper","year":2023,"title":"Weak-to-Strong Generalization","url":"https://arxiv.org/abs/2312.09390","note":"研究能力较弱的监督者如何监督更强模型。"}],"actors":[{"name":"OpenAI","role":"前沿推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/2312.09390","note":"Weak-to-Strong 研究较弱监督者能否训练更强模型，直接触及人类难以逐条判断超人系统输出时的监督瓶颈。","sourceTitle":"Weak-to-Strong Generalization","year":2023},{"name":"Transluce","role":"研究推进","kind":"Lab","url":"https://transluce.org/","note":"Transluce 把模型内部理解、行为监测和异常发现组织为公开监督技术栈，目标是让人类能够规模化检查越来越强的模型。","sourceTitle":"Infrastructure for understanding AI","year":2026}]},{"id":"cap-aware-of-failure","label":"模型知道何时可能出错并选择求助","en":"Failure-Aware Behavior","entityKind":"capability_outcome","status":"established","x":2790,"y":4720,"w":298,"h":76,"summary":"系统能把不确定性转化为拒答、复核或降级策略。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-governed-autonomy","label":"自主行为可以被约束、审计和纠正","en":"Governed and Correctable Autonomy","entityKind":"capability_outcome","status":"established","x":2790,"y":5120,"w":298,"h":76,"summary":"监督不只评价最终得分，也介入权限、过程和停止条件。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-evaluator-capture","label":"评价器可能被投机或与真实目标错位","en":"Evaluator Capture","entityKind":"problem","status":"established","x":3200,"y":4920,"w":298,"h":76,"summary":"系统越会优化，越可能利用代理指标的漏洞。","why":"系统越会优化，越可能利用代理指标的漏洞。", 可以共同发现问题与解法，而不只优化预先固定的答案。","limits":"资源消耗巨大，进展难衡量，新颖性也不保证有用或安全。","plainLanguage":"只盯着一个固定分数，搜索很容易挤到同一种解法。开放式进化搜索保留多样性，让任务、环境和解法一起变化，持续寻找新方向。","evidence":[{"kind":"paper","year":2019,"title":"POET: Paired Open-Ended Trailblazer","url":"https://arxiv.org/abs/1901.01753","note":"共同生成环境与解法，代表开放式进化搜索。"}],"actors":[{"name":"Sakana AI","role":"前沿推进","kind":"Frontier Lab","url":"https://sakana.ai/rsi-lab/","note":"用候选档案、变异和外部评测保持多样改进路径，而非只沿单一梯度爬升。","sourceTitle":"Sakana AI RSI Lab","year":2025}]},{"id":"cap-automated-design","label":"机器可提出并筛选模型设计","en":"Automated Design Search","entityKind":"capability_outcome","status":"established","x":2790,"y":5880,"w":298,"h":74,"summary":"明确搜索空间内的结构与超参数试验可以由系统自动完成。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-proxy-evaluation","label":"自动搜索受限于可计算代理指标","en":"Proxy Evaluation Ceiling","entityKind":"problem","status":"established","x":3200,"y":5880,"w":298,"h":76,"summary":"没有可信评价器，自动实验只会更快优化错误目标。","why":"没有可信评价器，自动实验只会更快优化错误目标。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-verifiable-self-play","label":"Verifiable Self-Play / 可验证自生成课程","en":"Verifiable Self-Play and Curriculum","entityKind":"technical_route","status":"frontier","x":3610,"y":5780,"w":291,"h":76,"summary":"让系统自行生成难度递增且结果可验证的任务与训练数据。","why":"人类题库有限，纯模仿无法让模型持续超越示范分布。","mechanism":"出题者、解题者与验证器循环互动，保留既有信息增益又能自动判定的样本。","changed":"训练课程可以随模型能力自动增长，减少对静态人工数据的依赖。","limits":"只在规则明确的封闭领域稳定；生成任务可能狭窄、投机或偏离真实价值。","plainLanguage":"人工题库会被用完，系统就自己出更难、但仍能自动判对错的题，再自己解。这样训练课程能随能力增长，但目前更适合规则清晰的领域。","evidence":[{"kind":"paper","year":2025,"title":"Absolute Zero: Reinforced Self-play Reasoning with Zero Data","url":"https://arxiv.org/abs/2505.03335","note":"在代码可验证域中让模型同时生成任务并求解，较准确地支撑可验证自生成课程节点。"}],"actors":[{"name":"Tsinghua University, BIGAI & Pennsylvania State University","role":"提出者","kind":"研究团队","url":"https://arxiv.org/abs/2505.03335","note":"Absolute Zero 让同一模型提出可学习任务并求解，由代码执行器同时验证任务有效性和答案，在零外部数据下形成自博弈课程。","sourceTitle":"Absolute Zero","year":2025}]},{"id":"tech-ai-rd-loop","label":"AI R&D Loops / 自动研究闭环","en":"AI R&D and Automated Science Loops","entityKind":"technical_route","status":"frontier","x":3610,"y":5940,"w":293,"h":76,"summary":"用 Agent 串联提出假设、写代码、运行实验、分析结果与修订方案。","why":"研究迭代由人类在多个工具和长反馈周期之间串行协调。","mechanism":"把文献、实验环境、评价器和版本控制接进可记录、可回退的 Agent 工作流。","changed":"机器可以参与完整实验循环，而不只是回答单个研究问题。","limits":"评价标准易被投机，实验成本和错误结论会被自动化放大，真正新颖性也难判定。","plainLanguage":"研究不是问一次问题，而是查资料、写代码、做实验、看结果再改方案。自动研究闭环把这些步骤接成可记录、可回退的工作流，让 AI 参与完整迭代。","evidence":[{"kind":"paper","year":2024,"title":"The AI Scientist","url":"https://arxiv.org/abs/2408.06292","note":"将提出想法、实验、写作与评审串成自动研究流程的早期系统。"}],"actors":[{"name":"Sakana AI","role":"提出与推进","kind":"Frontier Lab","url":"https://sakana.ai/ai-scientist/","note":"AI Scientist 把提出想法、写代码、跑实验和撰写结果串成自动研究闭环。","sourceTitle":"The AI Scientist","year":2024},{"name":"Google DeepMind","role":"前沿推进","kind":"Frontier Lab","url":"https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/","note":"AlphaEvolve 将模型生成、进化搜索和可执行验证结合，用于算法发现。","sourceTitle":"AlphaEvolve","year":2025}]},{"id":"cap-closed-improvement-loop","label":"机器可参与提出—实验—评估—改进闭环","en":"Machine-Operated Improvement Loops","entityKind":"capability_outcome","status":"established","x":4020,"y":5880,"w":298,"h":76,"summary":"AI 开始连接完整研发反馈链，而不只承担其中一个步骤。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-self-reference","label":"系统尚不能稳定修改自身改进机制","en":"Self-Reference & Stability","entityKind":"problem","status":"established","x":4430,"y":5880,"w":298,"h":76,"summary":"局部自动优化不等于提升产生下一代改进的能力。","why":"局部自动优化不等于提升产生下一代改进的能力。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-self-modifying-agent","label":"Self-Modifying Agents / 自修改 Agent","en":"Self-Modifying Agents","entityKind":"technical_route","status":"frontier","x":4840,"y":5780,"w":300,"h":76,"summary":"让 Agent 修改自己的提示、代码、工具或学习流程，并在评测后保留改动。","why":"固定 Agent 无法把长期运行中发现的问题沉淀为结构性改进。","mechanism":"提出自我补丁，在沙箱与回归评测中验证，再通过门控更新自身组件。","changed":"系统从“记住经验”迈向“改变产生行为的机制”。","limits":"当前证据集中在编码基准和人工定义评价器；它不等于一般智能或递归自我改进已实现。","plainLanguage":"普通 Agent 只能记住经验，结构本身不会变。自修改 Agent 会提出对自身提示、代码或工具的改动，先经过沙箱和回归测试，再决定是否保留。","evidence":[{"kind":"paper","year":2025,"title":"Darwin Gödel Machine: Open-Ended Evolution of Self-Improving Agents","url":"https://arxiv.org/abs/2505.22954","note":"以代码修改、开放式候选档案和基准评测形成自修改 Agent 的直接实证证据，但仍不证明一般 RSI。"}],"actors":[{"name":"Sakana AI RSI Lab","role":"提出与推进","kind":"Frontier Lab","url":"https://sakana.ai/rsi-lab/","note":"Darwin Gödel Machine 让 Agent 修改自身代码，并由外部基准决定哪些改动进入开放档案。","sourceTitle":"Darwin Gödel Machine","year":2025}]},{"id":"thesis-rsi","label":"RSI / 递归自我改进假设","en":"Recursive Self-Improvement","entityKind":"thesis","status":"hypothesis","x":4840,"y":5940,"w":270,"h":74,"summary":"系统改进自身的改进能力，从而可能形成递归加速的理论假设。","why":"如果 AI 能承担 AI 研发，它是否会进一步提升自己承担研发的能力。","mechanism":"假设每轮能力提升都提高下一轮研究、设计与验证效率，形成正反馈。","changed":"它提供理解某些前沿 Lab 与“自动 AI 研发”叙事的远端坐标。","limits":"没有证据表明开放环境中的 RSI 已经实现；目标稳定、验证、资源与收益递减都可能中断递归。","plainLanguage":"RSI 不是已经实现的产品路线，而是一个远端假设：如果 AI 能改进自己做 AI 研发的能力，下一轮改进是否会更快。它提供坐标，但当前证据远不足以证明递归加速已经发生。","evidence":[{"kind":"paper","year":2008,"title":"The Basic AI Drives","url":"https://arxiv.org/abs/0712.3329","note":"分析足够高级的目标驱动系统为何可能寻求自我改进；属于理论论证而非实证范式。"}],"actors":[{"name":"Sakana AI RSI Lab","role":"研究路线","kind":"Frontier Lab","url":"https://sakana.ai/rsi-lab/","note":"公开把自修改 Agent、进化搜索与自动研究串为现代 RSI 研究计划；当前仍是受限任务上的早期证据。","sourceTitle":"Sakana AI RSI Lab","year":2025}]},{"id":"problem-rsi-control","label":"目标稳定、验证与可控性尚无解","en":"RSI Control & Verification","entityKind":"problem","status":"established","x":5250,"y":5880,"w":298,"h":76,"summary":"递归改进缺少可信的跨代评价、目标保持和安全边界。","why":"递归改进缺少可信的跨代评价、目标保持和安全边界。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-rapid-adaptation","label":"以少量经验快速适应新任务","en":"Rapid & Continual Adaptation","entityKind":"composite_capability","status":"established","x":1550,"y":6200,"w":298,"h":74,"summary":"复用既有知识，在数据分布变化时快速学习且不过度遗忘。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-train-from-scratch","label":"每个新任务都从头训练","en":"Training From Scratch","entityKind":"problem","status":"established","x":1960,"y":6080,"w":254,"h":66,"summary":"任务之间的表征和经验无法复用，数据与计算被重复消耗。","why":"任务之间的表征和经验无法复用，数据与计算被重复消耗。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-transfer-learning","label":"Transfer Learning / 迁移学习","en":"Transfer Learning and Pretrain–Finetune","entityKind":"technical_route","status":"established","x":2380,"y":6080,"w":300,"h":76,"summary":"把源任务学到的参数或表征迁移到新任务，再做少量适配。","why":"每个任务从零训练浪费已有知识，也需要大量新标签。","mechanism":"先在大数据或相关任务上预训练，再冻结、微调或轻量适配模型。","changed":"知识能够跨任务复用，并奠定基础模型的训练范式。","limits":"迁移收益取决于源目标相似性；全量微调还可能过拟合并遗忘旧能力。","plainLanguage":"新任务不必每次从零训练。迁移学习把旧任务学到的参数或表示带到新任务，再用少量数据做适配。","evidence":[{"kind":"paper","year":2014,"title":"Learning and Transferring Mid-Level Image Representations using Convolutional Neural Networks","url":"https://openaccess.thecvf.com/content_cvpr_2014/html/Oquab_Learning_and_Transferring_2014_CVPR_paper.html","note":"直接证明在大数据集学到的中层表征可以迁移到样本更少的新任务。"}],"actors":[{"name":"Maxime Oquab 等","role":"深度迁移关键推进","kind":"人物","url":"https://openaccess.thecvf.com/content_cvpr_2014/html/Oquab_Learning_and_Transferring_2014_CVPR_paper.html","note":"把在大数据集上学到的卷积特征迁移到新视觉任务，证明深层中间表征可跨标签空间复用。","sourceTitle":"Learning and Transferring Mid-Level Image Representations","year":2014}]},{"id":"cap-knowledge-reuse","label":"已有知识可用于更快学习新任务","en":"Reuse Knowledge Across Tasks","entityKind":"capability_outcome","status":"established","x":2790,"y":6080,"w":298,"h":76,"summary":"新任务不必从随机参数和零经验开始。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-few-shot-adaptation","label":"微调仍需数据，且可能过拟合单一任务","en":"Few-Shot Adaptation","entityKind":"problem","status":"established","x":3200,"y":6080,"w":298,"h":76,"summary":"希望模型学会快速学习，而不只是复用固定参数。","why":"希望模型学会快速学习，而不只是复用固定参数。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-meta-learning","label":"Meta-Learning / 元学习","en":"Meta-Learning: Learning to Learn","entityKind":"technical_route","status":"established","x":3610,"y":6080,"w":264,"h":74,"summary":"在许多任务上学习一种能用少量样本快速适应新任务的学习机制。","why":"普通微调仍需要较多数据和步骤，也没有显式优化“适应速度”。","mechanism":"跨任务优化初始化、更新规则或记忆，使少量梯度步骤或示例即可适配。","changed":"模型可以把“如何学习新任务”本身作为训练目标。","limits":"元训练任务分布决定了泛化边界，分布外任务未必能快速适应。","plainLanguage":"迁移学习复用已有知识，元学习更进一步，直接训练模型“怎样更快学会新任务”。目标是让它只看少量样本、做少数几步更新就能适应。","evidence":[{"kind":"paper","year":2017,"title":"Model-Agnostic Meta-Learning","url":"https://arxiv.org/abs/1703.03400","note":"学习一个能用少量样本快速适应新任务的初始化。"}],"actors":[{"name":"Chelsea Finn, Pieter Abbeel & Sergey Levine","role":"提出者","kind":"人物","url":"https://arxiv.org/abs/1703.03400","note":"MAML 直接优化一个能用少量梯度步骤适应新任务的初始化，使“快速学会”本身成为训练目标。","sourceTitle":"Model-Agnostic Meta-Learning","year":2017}]},{"id":"problem-catastrophic-forgetting","label":"顺序学习新任务会灾难性遗忘","en":"Catastrophic Forgetting","entityKind":"problem","status":"established","x":1960,"y":6360,"w":298,"h":76,"summary":"模型更新新知识时会破坏此前能力。","why":"模型更新新知识时会破坏此前能力。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-continual-learning","label":"Continual Learning / 持续学习","en":"Continual Learning","entityKind":"technical_route","status":"frontier","x":4020,"y":6360,"w":290,"h":76,"summary":"按时间顺序学习新任务或新分布，同时尽量保留旧能力。","why":"静态训练假设与真实部署不符，直接更新模型又会灾难性遗忘。","mechanism":"通过回放、正则约束、参数隔离或动态结构平衡可塑性与稳定性。","changed":"模型有可能在不完全重训的情况下持续吸收新经验。","limits":"开放环境中任务边界模糊，存储、隐私、迁移与安全评价仍缺统一答案。","plainLanguage":"真实系统会不断遇到新任务，不能每次全部重训，也不能学新忘旧。持续学习研究怎样一边吸收新经验，一边尽量保留旧能力。","evidence":[{"kind":"paper","year":2017,"title":"Overcoming catastrophic forgetting in neural networks","url":"https://doi.org/10.1073/pnas.1611835114","note":"EWC 以参数重要性约束新任务更新，是持续学习中稳定—可塑性权衡的标志性原始工作。"}],"actors":[{"name":"Google DeepMind","role":"标志性推进","kind":"Frontier Lab","url":"https://doi.org/10.1073/pnas.1611835114","note":"EWC 根据参数对旧任务的重要性限制后续更新，给神经网络缓解灾难性遗忘提供了清晰机制。","sourceTitle":"Overcoming catastrophic forgetting in neural networks","year":2017}]},{"id":"cap-lifelong-adaptation","label":"模型可持续吸收新经验而少忘旧知识","en":"Lifelong Adaptation","entityKind":"capability_outcome","status":"established","x":4430,"y":6360,"w":298,"h":76,"summary":"学习从一次性训练扩展为部署期间的长期过程。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-continual-evaluation","label":"开放分布下难定义保留、迁移与安全边界","en":"Continual Evaluation","entityKind":"problem","status":"established","x":4840,"y":6360,"w":298,"h":76,"summary":"现实环境缺少固定任务边界，在线更新还会改变系统风险。","why":"现实环境缺少固定任务边界，在线更新还会改变系统风险。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-autonomous-discovery","label":"自主提出并验证科学新知识","en":"Autonomous Scientific Discovery","entityKind":"composite_capability","status":"frontier","x":1550,"y":6520,"w":298,"h":74,"summary":"让 AI 不只复述既有知识，而能提出可检验假设、调用工具或实验并根据证据修正判断。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-static-science","label":"只学习既有语料，无法验证关于未知世界的假设","en":"Static Scientific Knowledge","entityKind":"problem","status":"established","x":1960,"y":6520,"w":298,"h":76,"summary":"论文和数据库记录的是过去；新的科学知识必须通过形式证明、模拟或真实实验接受现实约束。","why":"论文和数据库记录的是过去；新的科学知识必须通过形式证明、模拟或真实实验接受现实约束。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-scientific-agents","label":"Scientific Agents / 科学研究 Agent","en":"Scientific Tool-Using Agents","entityKind":"technical_route","status":"frontier","x":2380,"y":6360,"w":300,"h":76,"summary":"用 Agent 编排检索、建模、实验设计、执行、分析与修订，而不是只回答一次性科学问题。","why":"语言模型可以复述论文或生成假设，却不会自然地把开放问题推进为可检查、可迭代的研究过程。","mechanism":"把文献、代码、专业模型、实验环境与评价器组织成带状态的工作流，并依据每轮结果选择下一步。","changed":"AI 开始覆盖完整研究循环中的多个步骤，研究过程可被记录、复现并重复执行。","limits":"流程完整不等于结论可靠；评价器偏差、工具错误和自动评审会把貌似完整的低质量研究放大。","plainLanguage":"科学研究不是把论文总结一遍，而是把开放问题推进成可检查的假设、实验和下一步。科学 Agent 把文献、代码、专业工具和实验环境串成持续迭代的研究流程。","evidence":[{"kind":"paper","year":2024,"title":"The AI Scientist","url":"https://arxiv.org/abs/2408.06292","note":"将提出想法、实验、写作与评审串成自动研究流程的早期系统。"}],"actors":[{"name":"FutureHouse","role":"前沿实践","kind":"Neo Lab","url":"https://www.futurehouse.org/news/launching-futurehouse-platform-ai-agents","note":"以专用 Agent 完成文献检索、综述、空白识别和实验规划，再组合为科学工作流。","sourceTitle":"FutureHouse Platform","year":2025},{"name":"Edison Scientific","role":"公司路线","kind":"Neo Lab","url":"https://edisonscientific.com/","note":"Kosmos 面向研发团队执行文献、数据分析、假设生成和多步科学工作流。","sourceTitle":"Kosmos","year":2025}]},{"id":"tech-formal-science-verification","label":"Formal Verification / 形式验证","en":"Formal Scientific Verification","entityKind":"technical_route","status":"frontier","x":2380,"y":6520,"w":300,"h":76,"summary":"把数学、代码或其他可形式化主张写成机器可检查的命题，并由小型可信内核判定证明是否成立。","why":"自然语言论证可能流畅却包含缺口；科学 Agent 需要一种低歧义、可自动判定的正确性反馈。","mechanism":"把定义、命题和证明编码进 Lean 等形式系统，由类型检查器逐步验证候选证明是否满足原始陈述。","changed":"部分数学与计算主张可以获得确定性反馈，也能成为推理训练和搜索中的 verifier。","limits":"它只能证明形式陈述内部的正确性，不能自动保证陈述忠实刻画现实、结论新颖或研究问题重要。","plainLanguage":"自然语言证明看起来流畅，也可能藏着逻辑漏洞。形式验证把主张写成机器能逐步检查的命题，让部分数学和代码问题获得明确的对错反馈。","evidence":[{"kind":"paper","year":2021,"title":"The Lean 4 Theorem Prover and Programming Language","url":"https://lean-lang.org/papers/lean4.pdf","note":"Lean 4 以小型可信内核检查形式证明，为数学与可形式化系统提供确定性反馈接口。"}],"actors":[{"name":"Harmonic","role":"公司路线","kind":"Neo Lab","url":"https://harmonic.fun/news/intro-harmonic/","note":"以 Lean 等形式系统让数学推理结果可由机器检查，而不只依赖自然语言说服力。","sourceTitle":"Introducing Harmonic","year":2023}]},{"id":"tech-autonomous-labs","label":"Autonomous Laboratories / 自主实验室","en":"Autonomous Laboratories","entityKind":"technical_route","status":"frontier","x":2380,"y":6680,"w":293,"h":76,"summary":"把机器学习决策、实验自动化、机器人和测量仪器接成能迭代选择并执行真实实验的闭环。","why":"仅靠历史论文和静态数据库无法判断关于未知材料或生物系统的新假设是否符合现实。","mechanism":"系统根据已有结果选择实验参数，自动完成制备与测量，再把观测结果返回主动学习或研究 Agent。","changed":"AI 能通过物理行动主动获得新证据，而不再只在固定数据集内预测。","limits":"实验吞吐、仪器覆盖、污染与故障、测量误差和人工设定的目标仍限制所谓“自主”；自动运行也不等于自主发现重要问题。","plainLanguage":"仅靠读论文，AI 无法知道一个新材料或生物假设在现实里是否成立。自主实验室把选实验、机器人操作、测量和结果分析接成真实闭环。","evidence":[{"kind":"paper","year":2023,"title":"An autonomous laboratory for the accelerated synthesis of inorganic materials","url":"https://www.nature.com/articles/s41586-023-06734-w","note":"A-Lab 把机器人、材料数据库、数据解释与主动学习接成真实材料合成闭环，是自主实验室的直接实证。"}],"actors":[{"name":"Periodic Labs","role":"公司路线","kind":"Neo Lab","url":"https://periodic.com/","note":"把 AI Scientist 与可由其直接操作的物理实验室结合，让假设接受真实实验检验。","sourceTitle":"Periodic Labs research thesis","year":2025},{"name":"LILA Sciences","role":"公司路线","kind":"Neo Lab","url":"https://www.lila.ai/tech","note":"以 AI Science Factory 把推理模型、仪器、自动化和实验 verifier 接成闭环。","sourceTitle":"LILA Intelligence Flywheel","year":2025}]},{"id":"cap-hypothesis-test-loop","label":"机器可运行假设—实验—解释闭环","en":"Machine-Operated Hypothesis–Test Loop","entityKind":"capability_outcome","status":"established","x":3200,"y":6520,"w":298,"h":76,"summary":"系统能把开放问题转成可检验命题，并依据形式或物理证据选择下一步。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-scientific-feedback","label":"一次性实验尚未形成可扩展的学习信号","en":"Scientific Feedback Bottleneck","entityKind":"problem","status":"established","x":3610,"y":6520,"w":298,"h":76,"summary":"实验吞吐、负结果保留、奖励定义和跨实验归因限制闭环能否持续学习。","why":"实验吞吐、负结果保留、奖励定义和跨实验归因限制闭环能否持续学习。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-experiment-driven-learning","label":"Experiment-Driven Learning / 实验驱动学习","en":"Experiment-Driven Learning","entityKind":"technical_route","status":"frontier","x":4020,"y":6520,"w":275,"h":76,"summary":"把每轮真实实验的成功、失败与新测量转成数据、奖励或课程，持续更新研究策略和模型。","why":"一次性自动实验只提高执行效率；若结果不能进入学习循环，系统不会因做过更多实验而成为更好的科学家。","mechanism":"保留正负结果与实验上下文，用 verifier、信息增益或任务奖励选择后续实验，并把累积数据用于模型后训练。","changed":"实验室从被 Agent 调用的工具变成持续扩展训练分布和可验证反馈的环境。","limits":"稀疏延迟反馈难归因，容易优化可测但不重要的代理指标；跨仪器、跨领域迁移仍缺少充分公开证据。","plainLanguage":"自动做完一次实验，只是省了人力；系统还要从成功和失败中变得更会研究。实验驱动学习把每轮结果重新变成训练数据或反馈，用来选择下一轮实验。","evidence":[{"kind":"paper","year":2023,"title":"An autonomous laboratory for the accelerated synthesis of inorganic materials","url":"https://www.nature.com/articles/s41586-023-06734-w","note":"A-Lab 把机器人、材料数据库、数据解释与主动学习接成真实材料合成闭环，是自主实验室的直接实证。"},{"kind":"official","year":2025,"title":"Periodic Labs — AI scientists and autonomous laboratories","url":"https://periodic.com/","note":"Periodic 明确区分阅读有限语料与通过真实实验产生新数据，并把自主实验室视为 AI scientist 的证据接口。"},{"kind":"official","year":2026,"title":"Lila AI Science Factories","url":"https://www.lila.ai/tech","note":"Lila 公开描述 reasoning model、工具、自动化与 verifier 的闭环，以及把每次实验转为后训练信号的实验学习飞轮。"}],"actors":[{"name":"Periodic Labs","role":"公司路线","kind":"Neo Lab","url":"https://periodic.com/","note":"把自然当作可验证环境，用实验生成互联网上不存在的正负训练信号。","sourceTitle":"Periodic Labs research thesis","year":2025},{"name":"LILA Sciences","role":"公司路线","kind":"Neo Lab","url":"https://www.lila.ai/tech","note":"让每次真实实验都回流为科学推理模型的训练 token 与奖励信号。","sourceTitle":"LILA Intelligence Flywheel","year":2025}]},{"id":"cap-evidence-generating-ai","label":"AI 可通过行动持续产生新证据","en":"Evidence-Generating AI","entityKind":"capability_outcome","status":"established","x":4430,"y":6520,"w":300,"h":76,"summary":"系统不只在固定题库上回答，而会通过证明、模拟或实验扩大可学习事实集合。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-scientific-significance","label":"可验证不等于新颖、重要或能跨领域泛化","en":"Scientific Significance & Generalization","entityKind":"problem","status":"established","x":4840,"y":6520,"w":298,"h":76,"summary":"系统可能优化容易测量的代理目标，产生大量正确但无关紧要、不可迁移的结果。","why":"系统可能优化容易测量的代理目标，产生大量正确但无关紧要、不可迁移的结果。","mechanism":"","changed":"","limi erial-recurrence"],"primaryCapabilityIds":["cap-model-memory"],"supportingCapabilityIds":["cap-grounding"]},{"id":"representation","rank":4,"title":"模型怎样学到可跨任务、跨模态迁移的表征？","short":"Embedding / GNN / 自监督 / 跨模态","summary":"表征学习把离散符号、关系结构和不同模态映射到可复用的内部空间，使一次学习获得的知识能够迁移到更多任务。","titleEn":"How do models learn representations that transfer across tasks and modalities?","summaryEn":"Representation learning maps symbols, relational structure and multiple modalities into reusable internal spaces, so knowledge learned once can transfer to more tasks.","shortEn":"Embeddings · GNNs · self-supervised and multimodal representations","nodeIds":["cap-transferable-representation","problem-sparse-symbols","problem-relational-data","tech-embeddings","tech-gnn","tech-self-supervised","tech-masked-modeling","tech-autoregressive-pretraining","tech-contrastive-learning","tech-clip","tech-multimodal-foundation","cap-relational-representation","cap-foundation-representation","cap-open-vocabulary","problem-label-dependence","problem-modality-silos","problem-passive-multimodal"],"primaryCapabilityIds":["cap-learning-generalization","cap-grounding"],"supportingCapabilityIds":["cap-model-memory"]},{"id":"generative","rank":5,"title":"模型怎样稳定生成高质量内容？","short":"AR / VAE / GAN / Flow / Diffusion","summary":"不同生成模型在训练稳定性、分布覆盖、样本质量、生成速度和可控性之间寻找平衡，并逐步形成可跨模态扩展的生成骨干。","titleEn":"How do models generate high-quality content reliably?","summaryEn":"Generative families balance training stability, coverage, sample quality, speed and controllability, gradually becoming reusable backbones across modalities.","shortEn":"Autoregressive · VAE · GAN · flow · diffusion","nodeIds":["cap-generative-modeling","problem-density-modeling","tech-autoregressive-generation","tech-vae","tech-gan","tech-normalizing-flows","tech-diffusion","tech-latent-diffusion","tech-dit","tech-flow-matching","tech-video-generation","tech-diffusion-language","cap-neural-generation","cap-high-fidelity-generation","cap-scalable-generative","problem-generative-tradeoff","problem-pixel-diffusion-cost","problem-generative-grounding"],"primaryCapabilityIds":["cap-learning-generalization"],"supportingCapabilityIds":["cap-model-memory"]},{"id":"scaling","rank":6,"title":"大模型怎样规模化，并学会遵循人的意图？","short":"Scaling Laws / Efficient Architectures / Post-Training","summary":"基础模型一方面要更高效地吸收数据与算力，另一方面要把“预测下一个 token”转化为真正理解和遵循用户意图的行为。","titleEn":"How do large models scale and learn to follow human intent?","summaryEn":"Foundation models must absorb more data and compute efficiently, while post-training turns next-token prediction into behavior that better understands and follows human intent.","shortEn":"Scaling laws · MoE · efficient sequence models · alignment","nodeIds":["cap-general-foundation-model","problem-task-specific-models","tech-scaling-laws","tech-foundation-models","tech-moe","tech-ssm","tech-hybrid-architectures","tech-instruction-tuning","tech-rlhf","tech-dpo","cap-predictable-scaling","cap-instruction-following","problem-dense-compute","problem-context-complexity","problem-objective-intent-gap","problem-alignment-generalization"],"primaryCapabilityIds":["cap-learning-generalization","cap-evaluation-regulation"],"supportingCapabilityIds":[]},{"id":"reasoning","rank":7,"title":"模型怎样从直接作答走向审慎、可验证的推理？","short":"CoT → Search / Verifier → RLVR","summary":"推理从一次直接生成，发展为展开中间步骤、搜索多条候选路径，再用过程或结果验证器筛选和训练推理策略。","titleEn":"How do models move from immediate answers to deliberate, verifiable reasoning?","summaryEn":"Reasoning evolved from one-pass generation to explicit intermediate steps, search over candidate paths, and verification of processes or outcomes for selection and training.","shortEn":"Chain-of-thought · search · verification","nodeIds":["cap-reliable-reasoning","problem-single-pass-reasoning","tech-cot","tech-test-time-search","tech-verifiers","tech-rlvr","cap-deliberate-reasoning","cap-verified-reasoning","cap-learned-reasoning-policy","problem-greedy-reasoning","problem-imitation-ceiling","problem-open-verification"],"primaryCapabilityIds":["cap-reasoning-decision","cap-evaluation-regulation"],"supportingCapabilityIds":["cap-model-memory"]},{"id":"agents","rank":8,"title":"模型怎样获得知识、记忆和工具，长期完成任务？","short":"RAG / Tool Use / ReAct / Memory","summary":"语言模型通过检索获得可更新知识，通过工具改变环境，并用状态和记忆把多轮推理与行动连接成长程任务闭环。","titleEn":"How do models gain knowledge, memory and tools for long-horizon work?","summaryEn":"Retrieval provides updatable knowledge, tools let models change the environment, and state plus memory connect multi-step reasoning and action into long-horizon task loops.","shortEn":"RAG · tool use · memory · agent loops","nodeIds":["cap-long-horizon-agency","problem-parametric-knowledge","tech-rag","tech-external-memory","tech-tool-use","tech-react","tech-stateful-agents","tech-agentic-workflows","cap-grounded-knowledge","cap-agent-loop","problem-no-environment-action","problem-reason-action-separation","problem-long-horizon-errors","problem-agent-reliability"],"primaryCapabilityIds":["cap-model-memory","cap-action-interaction"],"supportingCapabilityIds":["cap-reasoning-decision","cap-evaluation-regulation"]},{"id":"rl","rank":9,"title":"没有标准动作答案，机器怎样从结果中学习决策？","short":"Model-Free / Model-Based / Self-Play + Search","summary":"强化学习用长期回报替代逐步动作标签。直接学习价值/策略与学习环境模型后规划是长期并行的两条传统；深度网络后来同时增强两者，自博弈与神经引导搜索则在规则可模拟的环境中形成第三种组合。","titleEn":"How can a machine learn decisions when there is no correct action label?","summaryEn":"Reinforcement learning replaces step-by-step labels with long-term return. Model-free and model-based approaches remain parallel traditions; self-play with neural-guided search is a third combination for simulatable environments.","shortEn":"Model-free RL · model-based RL · self-play and search","nodeIds":["cap-adaptive-control","problem-no-action-labels","tech-reinforcement-learning","tech-model-free-rl","tech-model-based-rl","tech-deep-rl","tech-self-play-search","cap-reward-driven-policy","cap-superhuman-decision","problem-high-dimensional-state","problem-large-search-space","problem-sample-efficiency"],"primaryCapabilityIds":["cap-learning-generalization","cap-reasoning-decision","cap-action-interaction"],"supportingCapabilityIds":[]},{"id":"world","rank":10,"title":"模型怎样在行动前推演不同的未来？","short":"Latent Dynamics / MuZero / JEPA / Interactive Worlds / WAM","summary":"真实世界试错昂贵，所以模型需要先预测“采取某个动作后会发生什么”。共同的动作条件接口之后，技术按照“需要预测什么”分成五条并行路线：潜在状态、决策信息、抽象表征、可交互画面，以及世界—动作联合分布。它们最终服务于行动前预演或比较不同动作的后果。","titleEn":"How can a model simulate possible futures before it acts?","summaryEn":"Because real-world trial and error is expensive, a model must predict what follows an action. Parallel approaches predict latent state, decision-relevant information, abstract representation, interactive pixels, or a joint world–action distribution.","shortEn":"Latent world models · JEPA · video worlds · world-action models","nodeIds":["cap-world-prediction","problem-trial-and-error","problem-world-prediction-choice","tech-action-conditioned-world","tech-latent-world-models","tech-value-equivalent-model","tech-jepa","tech-interactive-world-model","tech-world-action-model","tech-latent-imagination","tech-action-conditioned-jepa","cap-planning-in-imagination","cap-counterfactual-world","problem-passive-world-model","problem-world-consistency"],"primaryCapabilityIds":["cap-model-memory","cap-reasoning-decision"],"supportingCapabilityIds":["cap-action-interaction","cap-grounding"]},{"id":"spatial","rank":11,"title":"模型怎样建立持续、可交互的三维世界？","short":"Neural 3D → Dynamic Spatial Representation","summary":"空间智能先解决多视角几何一致性，再处理动态、遮挡和对象恒常。它为交互世界提供空间记忆，但三维重建本身不会自然变成行动策略。","titleEn":"How do models build a persistent, interactive 3D world?","summaryEn":"Spatial intelligence begins with multi-view geometric consistency and then handles dynamics, occlusion and object permanence. It provides spatial memory, but reconstruction alone does not become an action policy.","shortEn":"Neural 3D · dynamic scenes · object-centric spatial memory","nodeIds":["cap-spatial-world","problem-2d-observation","tech-neural-3d","tech-spatiotemporal-world","cap-novel-view-geometry","cap-persistent-generative-world","problem-static-scenes","problem-wam-reliability"],"primaryCapabilityIds":["cap-grounding","cap-model-memory"],"supportingCapabilityIds":["cap-action-interaction"]},{"id":"embodied","rank":12,"title":"机器人怎样从单项技能走向跨任务泛化？","short":"Robot Data / VLA / Generative Policy / Real-World RL","summary":"机器人策略同时面对数据规模、语义迁移、连续多峰动作和在线反馈四个问题。Robot FM、VLA、生成式策略和真实世界 RL 分别回答不同问题，并可汇合在同一策略系统中。","titleEn":"How do robots move from isolated skills to cross-task generalization?","summaryEn":"Robot policies face four distinct problems: data scale, semantic transfer, continuous multimodal actions and online feedback. Robot foundation models, VLA, generative policies and real-world RL answer different parts and may converge in one system.","shortEn":"Robot data · robot foundation models · VLA · generative policies · real-world RL","nodeIds":["cap-embodied-generalization","problem-robot-programming","tech-imitation-learning","tech-offline-rl","tech-simulation-sim2real","tech-robot-foundation","tech-vla","tech-generative-policy","tech-real-world-rl","cap-learned-robot-policy","cap-semantic-robot-policy","problem-robot-data","problem-semantic-action-gap","problem-multimodal-actions","problem-demonstration-ceiling","problem-embodied-safety"],"primaryCapabilityIds":["cap-grounding","cap-action-interaction"],"supportingCapabilityIds":["cap-learning-generalization"]},{"id":"safety","rank":13,"title":"怎样知道模型何时会错，并让它可以被纠正？","short":"Calibration / Robustness / Interpretability / Oversight","summary":"可信智能包含四个并行问题：知道自己有多确定、在扰动下是否稳定、内部为何做出判断，以及当任务超过人类直接判断能力时如何继续监督。它们可以互相支持，但不是先后升级关系。","titleEn":"How do we know when a model will fail and keep it corrigible?","summaryEn":"Trustworthy intelligence combines calibration, robustness, interpretability and oversight. These tracks support one another but are not successive upgrades of the same technique.","shortEn":"Calibration · robustness · interpretability · oversight","nodeIds":["cap-trustworthy-intelligence","problem-benchmark-gap","problem-black-box","problem-supervision-scale","tech-uncertainty-calibration","tech-adversarial-robustness","tech-interpretability","tech-scalable-oversight","cap-aware-of-failure","cap-governed-autonomy","problem-evaluator-capture"],"primaryCapabilityIds":["cap-evaluation-regulation"],"supportingCapabilityIds":["cap-reasoning-decision","cap-action-interaction"]},{"id":"self","rank":14,"title":"AI 怎样参与并改进自身的研发过程？","short":"Bounded Search / Self-Play / AI R&D / Self-Modification / RSI Thesis","summary":"自动搜索、自生成课程、自动研发闭环与自修改是范围逐步扩大的机制，但 RSI 是独立的远端理论假设，不应从当前 Demo 直接推出已经出现递归加速。","titleEn":"How can AI participate in and improve its own R&D process?","summaryEn":"Automated search, self-generated curricula, AI R&D loops and self-modification expand the scope of automation. Recursive self-improvement remains a separate long-range thesis, not a conclusion that follows from current demos.","shortEn":"AutoML · self-generated curricula · AI R&D loops · RSI","nodeIds":["cap-self-improvement","problem-human-improvement-loop","tech-automl-nas","tech-evolutionary-search","tech-verifiable-self-play","tech-ai-rd-loop","tech-self-modifying-agent","thesis-rsi","cap-automated-design","cap-closed-improvement-loop","problem-proxy-evaluation","problem-self-reference","problem-rsi-control"],"primaryCapabilityIds":["cap-learning-generalization","cap-evaluation-regulation"],"supportingCapabilityIds":["cap-reasoning-decision"]},{"id":"adaptation","rank":15,"title":"模型怎样用少量经验持续适应新任务？","short":"Transfer / Meta-Learning / Continual","summary":"这里包含三个不同问题设置：迁移学习复用已有知识，元学习优化“如何快速学”，持续学习处理随时间到来的经验与遗忘。它们相互使能，但不是一条先后替代的单线。","titleEn":"How do models keep adapting to new tasks from limited experience?","summaryEn":"Transfer learning reuses existing knowledge, meta-learning optimizes how to learn quickly, and continual learning handles experience arriving over time without forgetting. They interact, but are not a single replacement sequence.","shortEn":"Transfer learning · meta-learning · continual learning","nodeIds":["cap-rapid-adaptation","problem-train-from-scratch","problem-catastrophic-forgetting","tech-transfer-learning","tech-meta-learning","tech-continual-learning","cap-knowledge-reuse","cap-lifelong-adaptation","problem-few-shot-adaptation","problem-continual-evaluation"],"primaryCapabilityIds":["cap-learning-generalization"],"supportingCapabilityIds":["cap-model-memory","cap-evaluation-regulation"]},{"id":"discovery","rank":16,"title":"AI 怎样从回答已有问题走向产生并验证科学新知识？","short":"Scientific Agents / Formal Verification / Autonomous Labs","summary":"科学发现不只是更强的问答。系统必须把假设接到可约束它的证据接口：形式证明、专业模拟或真实实验；再把结果转化为下一轮研究的学习信号。科学 Agent、形式验证和自主实验室因此是互补路线，而非同一技术的上下游标签。","titleEn":"How does AI move from answering known questions to creating and testing new knowledge?","summaryEn":"Scientific discovery requires hypotheses to meet constraining evidence through proofs, simulations or physical experiments, then converts results into the next learning signal. Scientific agents, formal verification and autonomous labs are complementary routes.","shortEn":"Scientific agents · formal verification · autonomous laboratories","nodeIds":["cap-autonomous-discovery","problem-static-science","tech-scientific-agents","tech-formal-science-verification","tech-autonomous-labs","tech-experiment-driven-learning","cap-hypothesis-test-loop","cap-evidence-generating-ai","problem-scientific-feedback","problem-scientific-significance"],"primaryCapabilityIds":["cap-reasoning-decision","cap-action-interaction","cap-evaluation-regulation"],"supportingCapabilityIds":["cap-learning-generalization","cap-model-memory"]}],"translations":{"meta":{"method":"offline editorial translation","generatedAt":"2026-11-10T19:38:08.816Z"},"nodes":{"cap-adaptive-intelligence":{"id":"cap-adaptive-intelligence","label":"开放环境中的通用适应性智能","englishLabel":"General Adaptive Intelligence","summary":"Continuously perceive, model, learn, decide and act in open, changing and only partially knowable environments, while correcting behavior from feedback.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-grounding":{"id":"cap-grounding","label":"感知与扎根","englishLabel":"Perception & Grounding","summary":"Connect pixels, sounds and language to real-world objects, relations and states.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-model-memory":{"id":"cap-model-memory","label":"建模与记忆","englishLabel":"Modeling & Memory","summary":"Retain relevant history, represent the current state and predict what may happen next.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-learning-generalization":{"id":"cap-learning-generalization","label":"学习与泛化","englishLabel":"Learning & Generalization","summary":"Transfer training experience to unseen examples, tasks and environments.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-reasoning-decision":{"id":"cap-reasoning-decision","label":"推理、规划与决策","englishLabel":"Reasoning, Planning & Decision","summary":"Compare options, plan steps and make decisions under uncertainty and resource constraints.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-action-interaction":{"id":"cap-action-interaction","label":"行动与交互","englishLabel":"Action & Interaction","summary":"Change the environment through digital tools or physical actions, then feed the outcome into the next cycle.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-evaluation-regulation":{"id":"cap-evaluation-regulation","label":"评价与自我调节","englishLabel":"Evaluation & Self-Regulation","summary":"Know when to continue, correct an error, seek help, refuse or stop.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-explicit-intelligence":{"id":"cap-explicit-intelligence","label":"机器可学习的知识与问题求解","englishLabel":"Machine Learning & Problem Solving","summary":"Enable machines both to manipulate explicit knowledge and to infer patterns and internal representations from data.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-encode-intelligence":{"id":"problem-encode-intelligence","label":"知识与求解过程难以形式化","englishLabel":"How to Encode Intelligence","summary":"Early AI first had to answer two questions: how should knowledge be represented, and how could a machine execute a problem-solving process?","why":"Early AI first had to answer two questions: how should knowledge be represented, and how could a machine execute a problem-solving process?","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-symbolic-ai":{"id":"tech-symbolic-ai","label":"Symbolic AI / 符号主义","englishLabel":"Symbolic AI","summary":"Represent knowledge and problem-solving steps explicitly through symbols, logic, rules and search.","why":"Early AI needed machines to manipulate knowledge rather than merely execute fixed arithmetic procedures.","mechanism":"Encode objects and relations as symbols, then use logical inference, state-space search or planning to find a solution.","changed":"For the first time, machines could reason and plan through steps that people could inspect.","limits":"Open-world exceptions cannot be exhaustively enumerated, and there is no natural account of how symbols arise from perception.","plainLanguage":"Early AI treated human problem-solving methods like a rulebook a machine could execute. Every step could be checked, but real life contains so many exceptions that the rulebook quickly became impossible to finish.","evidence":[{"title":"Computer Science as Empirical Inquiry: Symbols and Search","note":"Newell and Simon defined the core claim of classical symbolic AI through the physical symbol system hypothesis and heuristic search."}],"actors":[{"name":"Allen Newell & Herbert A. Simon","role":"Proponents","note":"They defined the classical symbolic AI program through physical symbol systems and heuristic search."}]},"cap-explicit-reasoning":{"id":"cap-explicit-reasoning","label":"可追踪的推理与规划","englishLabel":"Traceable Reasoning & Planning","summary":"Reasoning steps can be inspected, composed and reused.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-symbolic-brittleness":{"id":"problem-symbolic-brittleness","label":"规则脆弱，知识获取成本高","englishLabel":"Brittleness & Knowledge Acquisition","summary":"Exceptions and uncertainty in the open world cause hand-written rule sets to expand rapidly.","why":"Exceptions and uncertainty in the open world cause hand-written rule sets to expand rapidly.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-expert-systems":{"id":"tech-expert-systems","label":"Expert Systems / 专家系统","englishLabel":"Expert Systems","summary":"Store domain experts' decision rules in a knowledge base for an inference engine to apply.","why":"General symbolic solvers lacked industry-specific knowledge, so expert judgment had to be engineered into the system.","mechanism":"Separate knowledge from execution through a rule base, fact base and inference engine.","changed":"Demonstrated that knowledge-intensive AI could become a practical product in narrow domains such as medicine and computer configuration.","limits":"Acquiring and maintaining knowledge and handling exceptions are extremely costly, while the system struggles to learn from new data on its own.","plainLanguage":"Expert systems turn the experience of doctors, engineers and other specialists into a library of rules such as ‘if A happens, do B.’ They showed that AI could work in narrow domains, but people still had to enter and maintain the knowledge by hand.","evidence":[{"title":"R1: An Expert in the Computer Systems Domain","note":"R1 showed how a rule-based expert system could engineer domain knowledge into a real production workflow; it is an applied branch of symbolic AI."}],"actors":[{"name":"John McDermott / Carnegie Mellon University","role":"Representative pioneer","note":"R1, later called XCON, encoded expert knowledge as executable rules for configuring computer systems and became a landmark case of expert systems moving from research into real operations."}]},"tech-probabilistic-models":{"id":"tech-probabilistic-models","label":"Probabilistic Graphical Models / 概率图模型","englishLabel":"Probabilistic Graphical Models","summary":"Use graph structures to express dependencies among variables and make probabilistic inferences from incomplete information.","why":"Real-world information is noisy and incomplete, while deterministic rules cannot express degrees of uncertainty.","mechanism":"Factor a joint probability distribution with a directed or undirected graph, then perform conditional inference and learning.","changed":"Brought degrees of possibility into structured reasoning and connected statistical learning with domain knowledge.","limits":"Statistical dependence is not automatically causal, and exact inference in complex graphs may be computationally intractable.","plainLanguage":"Real-world information is often incomplete, so a machine cannot answer only ‘yes’ or ‘no.’ Probabilistic graphical models let it consider several possibilities at once and update its judgment as new evidence arrives.","evidence":[{"title":"Bayesian Networks: A Model of Self-Activated Memory for Evidential Reasoning","note":"Pearl's original technical report organized probabilistic dependencies into a directed network through which evidence could propagate, directly establishing the main line of probabilistic graphical models."}],"actors":[{"name":"Judea Pearl","role":"Proponent","note":"He organized probabilistic dependencies into directed netwo
