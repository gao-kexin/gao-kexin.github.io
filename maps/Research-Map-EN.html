single-pass-reasoning","label":"一次生成难以完成复杂推演","englishLabel":"Single-Pass Reasoning","summary":"A single forward generation lacks an explicit workspace, search, and backtracking.","why":"A single forward generation lacks an explicit workspace, search, and backtracking.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-cot":{"id":"tech-cot","label":"Chain-of-Thought / CoT","englishLabel":"Chain-of-Thought","summary":"Generates decomposed intermediate reasoning steps before the final answer.","why":"Directly producing an answer provides no explicit workspace, so intermediate variables are easily lost in complex problems.","mechanism":"Examples or prompts encourage the model to decompose a problem into a continuous language-based reasoning trace.","changed":"Enabled large models to spend more tokens on arithmetic, common-sense, and symbolic reasoning without changing their parameters.","limits":"The trace may be a plausible post-hoc explanation rather than faithful reasoning, and errors can propagate through every later step.","plainLanguage":"When a model jumps straight to an answer, it can easily miss intermediate conditions. CoT makes it write out several reasoning steps first, like adding a temporary scratchpad. A plausible-looking scratchpad, however, is not necessarily faithful or correct.","evidence":[{"title":"Chain-of-Thought Prompting Elicits Reasoning","note":"Intermediate reasoning text can substantially improve large models on multi-step tasks."}],"actors":[{"name":"Google Research","role":"Landmark Introduction","note":"Showed that a few examples containing intermediate reasoning steps can significantly improve arithmetic, common-sense, and symbolic reasoning in large models."}]},"cap-deliberate-reasoning":{"id":"cap-deliberate-reasoning","label":"问题可以拆成多步再作答","englishLabel":"Decomposed Multi-Step Reasoning","summary":"Intermediate variables and reasoning steps can be expanded, reviewed, and carried into further computation.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-greedy-reasoning":{"id":"problem-greedy-reasoning","label":"单一路径会早期承诺并累积错误","englishLabel":"Greedy Reasoning Path","summary":"A single reasoning attempt cannot compare alternatives, backtrack, or correct errors.","why":"A single reasoning attempt cannot compare alternatives, backtrack, or correct errors.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-test-time-search":{"id":"tech-test-time-search","label":"Test-Time Compute & Search / 测试时计算","englishLabel":"Test-Time Compute & Search","summary":"Generates, compares, or searches multiple candidate reasoning paths at answer time.","why":"Once greedy generation takes a wrong turn early, later tokens rarely recover.","mechanism":"Adds sampling, tree search, reflection, or iterative revision, then uses a scorer to select the result.","changed":"Model capability no longer depends only on training scale; additional computation per problem can also improve quality.","limits":"Benefits depend on candidate diversity and scoring reliability, while cost and latency rise substantially.","plainLanguage":"The first answer is not always the best one. Test-time search lets the model explore several approaches, compare them, backtrack, or extend promising paths. It trades more reasoning time for a higher chance of success.","evidence":[{"title":"Scaling LLM Test-Time Compute Optimally","note":"Systematically studied how to allocate additional computation, sampling, and search at inference time."}],"actors":[{"name":"Google DeepMind","role":"Systematic Research","note":"Quantified when extra inference compute should strengthen the verifier and when it should explore more candidate solutions."}]},"tech-verifiers":{"id":"tech-verifiers","label":"Verifiers & Process Supervision / 验证器","englishLabel":"Verifiers & Process Supervision","summary":"Uses outcome or process verifiers to evaluate reasoning traces instead of relying only on the model's self-assessment.","why":"Generating more candidates is not enough; the system also needs to determine which path is more trustworthy.","mechanism":"Trains models to judge final answers or individual reasoning steps, then uses them for filtering, search, or dense feedback.","changed":"Made reasoning externally checkable and moved error localization from the final answer to intermediate steps.","limits":"Open-ended tasks often lack objective judgments, and verifiers themselves can be fooled by out-of-distribution inputs or strategic exploitation.","plainLanguage":"After a model generates many candidate solutions, something still has to grade them. A verifier checks final answers or intermediate steps, turning “try more times” into “select the more trustworthy attempt.”","evidence":[{"title":"Let's Verify Step by Step","note":"Process supervision provides denser signals for correcting reasoning than judging only the final answer."}],"actors":[{"name":"OpenAI","role":"Scaled Advance","note":"Extended human feedback from judging only final answers to evaluating each reasoning step, using process reward models to distinguish superficially correct solutions from genuinely reliable ones."}]},"cap-verified-reasoning":{"id":"cap-verified-reasoning","label":"可搜索多条路径，并用验证器筛选","englishLabel":"Searchable and Verifiable Reasoning","summary":"The system does not have to treat its first generation as the final answer.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-imitation-ceiling":{"id":"problem-imitation-ceiling","label":"模仿现有解题轨迹限制策略发现","englishLabel":"Reasoning Imitation Ceiling","summary":"Supervised fine-tuning can only reproduce strategies present in its data and struggles to discover better ones.","why":"Supervised fine-tuning can only reproduce strategies present in its data and struggles to discover better ones.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-rlvr":{"id":"tech-rlvr","label":"RLVR / 可验证奖励强化学习","englishLabel":"Reinforcement Learning with Verifiable Rewards","summary":"Uses automatically checkable rewards so models can discover reasoning strategies through exploration.","why":"Imitating existing solution traces confines a model to the distribution of human demonstrations.","mechanism":"Samples reasoning on verifiable tasks such as mathematics and code, then optimizes the policy using final-answer correctness.","changed":"Enabled models to discover solution strategies not explicitly shown in demonstrations and internalize some test-time deliberation into the policy.","limits":"Its scope is constrained to verifiable tasks; reward hacking, training stability, and cross-domain transfer remain unresolved.","plainLanguage":"When an answer can be checked automatically, correctness can directly serve as a training reward. RLVR lets the model explore more effective solution strategies, but it mainly applies to verifiable domains such as mathematics and code.","evidence":[{"title":"DeepSeek-R1: Incentivizing Reasoning Capability via Reinforcement Learning","note":"Showed that reinforcement learning with verifiable rewards can elicit reasoning behavior, while open-ended tasks still lack reliable rewards."}],"actors":[{"name":"DeepSeek","role":"Scaled Advance","note":"DeepSeek-R1 showed that large-scale reinforcement learning based only on verifiable outcome rewards can elicit long-chain reasoning strategies."}]},"cap-learned-reasoning-policy":{"id":"cap-learned-reasoning-policy","label":"模型可通过结果反馈发现推理策略","englishLabel":"Learned Reasoning Policies","summary":"Verifiable rewards let a model explore and reinforce effective problem-solving behavior.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-open-verification":{"id":"problem-open-verification","label":"开放任务缺少可靠判定器","englishLabel":"Open-Ended Verification","summary":"Real-world problems rarely provide automatic, unambiguous rewards that cannot be gamed.","why":"Real-world problems rarely provide automatic, unambiguous rewards that cannot be gamed.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-long-horizon-agency":{"id":"cap-long-horizon-agency","label":"长程自主完成任务","englishLabel":"Long-Horizon Agency","summary":"Continually gathers information, uses tools, takes actions, and replans from feedback to pursue a goal.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-parametric-knowledge":{"id":"problem-parametric-knowledge","label":"参数知识过时且难追溯","englishLabel":"Static Parametric Knowledge","summary":"Knowledge inside model parameters is difficult to update and cannot reliably expose its sources.","why":"Knowledge inside model parameters is difficult to update and cannot reliably expose its sources.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-rag":{"id":"tech-rag","label":"RAG / 检索增强生成","englishLabel":"Retrieval-Augmented Generation","summary":"Retrieves relevant material from an external knowledge base before generation and conditions the answer on that material.","why":"Parametric knowledge becomes outdated, is difficult to trace, and is expensive to retrain.","mechanism":"Maps a query into a document index, retrieves passages, and provides them to the generator alongside the prompt.","changed":"Allowed knowledge to be updated, cited, and permissioned independently, while making answers easier to trace.","limits":"Retrieval errors directly contaminate generation; relevant documents do not guarantee correct answers, and integrating long contexts remains difficult.","plainLanguage":"Knowledge stored in model parameters becomes outdated and rarely reveals its source. RAG searches external material before answering and gives the retrieved content to the model together with the question.","evidence":[{"title":"Retrieval-Augmented Generation for Knowledge-Intensive NLP","note":"Connected updatable non-parametric memory to a generative model."}],"actors":[{"name":"Facebook AI Research","role":"Originator","note":"Combined retrievable external documents as non-parametric memory with a generative model, allowing answers to draw dynamically on knowledge beyond the model's parameters."}]},"tech-external-memory":{"id":"tech-external-memory","label":"External Memory / 外部记忆","englishLabel":"External and Differentiable Memory","summary":"Stores readable and writable state outside model parameters for use across steps or sessions.","why":"A fixed context window cannot preserve long-term experience, while parameter updates are unsuitable for writing events in real time.","mechanism":"Stores and retrieves history through vector databases, key-value stores, differentiable memory, or structured state.","changed":"Gave models updatable working memory, episodic memory, and long-term user state.","limits":"When to write, what to write, and when to forget remain unstable, while incorrect memories can cause persistent downstream errors.","plainLanguage":"Context windows are limited, and models do not naturally remember long-term experience. External memory stores important state and experience outside the model, then retrieves it when needed.","evidence":[{"title":"Neural Turing Machines","note":"Connected neural networks to external memory through differentiable reading and writing."},{"title":"Reflexion: Language Agents with Verbal Reinforcement Learning","note":"Stored task feedback as language memory to improve later attempts."}],"actors":[{"name":"DeepMind","role":"Originator and Key Advance","note":"Neural Turing Machines added differentiable external storage to neural networks, enabling them to learn algorithms such as copying, sorting, and associative recall."}]},"cap-grounded-knowledge":{"id":"cap-grounded-knowledge","label":"知识可实时更新，并能追溯来源","englishLabel":"Updatable and Attributable Knowledge","summary":"Facts can remain in external sources that update independently, while model answers can point to their basis.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-no-environment-action":{"id":"problem-no-environment-action","label":"模型只能输出文本，无法改变环境","englishLabel":"No Environment Action","summary":"Knowledge and plans cannot complete real tasks unless they can call tools or APIs.","why":"Knowledge and plans cannot complete real tasks unless they can call tools or APIs.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-tool-use":{"id":"tech-tool-use","label":"Tool Use & Function Calling / 工具调用","englishLabel":"Tool Use and Function Calling","summary":"Lets models call search, code, databases, or business APIs instead of only producing text.","why":"Language model parameters cannot perform exact computation, access real-time data, or change external systems.","mechanism":"The model emits a structured function name and arguments; an executor returns the result to the ongoing context.","changed":"Turned the model from a content generator into a control interface that can compose digital capabilities.","limits":"Incorrect arguments, permissions, security, and tool failures bring software-system risks into the Agent.","plainLanguage":"A language model by itself can only generate text. Tool use lets it search, calculate, query databases, or operate software, so its output can become a real action rather than just an answer.","evidence":[{"title":"Toolformer","note":"Taught a language model when and how to call external tools."}],"actors":[{"name":"Meta AI","role":"Landmark Advance","note":"Toolformer used self-supervised filtering of API-call examples to teach a model when to invoke calculators, search, and other tools."}]},"problem-reason-action-separation":{"id":"problem-reason-action-separation","label":"推理、行动与观察彼此割裂","englishLabel":"Reasoning–Action Separation","summary":"Completing a plan before acting prevents intermediate feedback from correcting the model's understanding.","why":"Completing a plan before acting prevents intermediate feedback from correcting the model's understanding.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-react":{"id":"tech-react","label":"ReAct / Reasoning + Acting","englishLabel":"ReAct: Reasoning and Acting","summary":"Let a model alternate among reasoning, action and observations from the environment.","why":"Reasoning to completion before acting relies on stale assumptions and cannot use action outcomes to revise the plan in time.","mechanism":"At each step, produce a thought and an action, execute the action, and incorporate the resulting observation into the next step.","changed":"Agents gained a perception–reasoning–action loop that lets them update plans while working.","limits":"Language trajectories are brittle and costly, and the loop can stall, drift or repeat mistakes.","plainLanguage":"A plan that never checks its results can quickly drift off course. ReAct cycles through ‘think one step, act, inspect the feedback,’ then adjusts the next step to what actually happened.","evidence":[{"title":"ReAct: Synergizing Reasoning and Acting","note":"The method alternates reasoning and actions, incorporating environmental observations into later reasoning."}],"actors":[{"name":"Princeton University & Google Research","role":"Proponents","note":"ReAct alternates language reasoning traces with actions in the environment, letting a model think, retrieve information and revise its next step from observations."}]},"cap-agent-loop":{"id":"cap-agent-loop","label":"模型能观察结果并继续采取行动","englishLabel":"Observe–Reason–Act Loop","summary":"An output is no longer the endpoint; it becomes one step in changing the environment, gathering feedback and revising the plan.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-long-horizon-errors":{"id":"problem-long-horizon-errors","label":"长程状态漂移与错误复利","englishLabel":"Long-Horizon Error Compounding","summary":"As tasks grow longer, conflicting memories, tool failures and plan drift accumulate more easily.","why":"As tasks grow longer, conflicting memories, tool failures and plan drift accumulate more easily.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-stateful-agents":{"id":"tech-stateful-agents","label":"Stateful Agents / 有状态 Agent","englishLabel":"Stateful Agents and Persistent Memory","summary":"Long-running agents that explicitly maintain task state, plans, memory and changes in the environment.","why":"A single conversational call cannot carry a complex task across hours or sessions.","mechanism":"Persist working memory, event logs, plan graphs and checkpoints, then retrieve them selectively on each turn.","changed":"Agents could resume after interruption, track commitments and adjust behavior from historical feedback.","limits":"State schemas and memory governance are not yet standardized, while stale information and faulty summaries can cause state drift.","plainLanguage":"A long task cannot restart from zero at every step. A stateful agent saves the current goal, completed actions, environmental changes and remaining work so it can continue across many turns.","evidence":[{"title":"Reflexion: Language Agents with Verbal Reinforcement Learning","note":"The method writes task feedback into language memory to improve later attempts."}],"actors":[{"name":"Noah Shinn 等 / Reflexion","role":"Key advance","note":"Reflexion writes verbal reflections after failures into episodic memory, improving later attempts without updating model parameters."}]},"tech-agentic-workflows":{"id":"tech-agentic-workflows","label":"Agentic Workflows / Agent 工作流","englishLabel":"Agentic Workflows","summary":"Combine multiple model calls through specialized roles, tool nodes and control flow.","why":"One agent struggles to plan, execute, verify and isolate permissions well at the same time.","mechanism":"Use graphs, state machines or orchestrators to connect specialized roles, with retries, human review and deterministic code where needed.","changed":"Complex tasks could be decomposed into observable, replaceable and governable execution systems.","limits":"Multiple agents do not automatically outperform one; communication overhead, cascading errors and evaluation remain major problems.","plainLanguage":"One agent rarely completes a complex workflow reliably. Agentic workflows split the work into explicit steps, connect tools and checkpoints, and add human approval where necessary so execution can be traced and retried.","evidence":[{"title":"ReAct: Synergizing Reasoning and Acting","note":"The method alternates reasoning and actions, incorporating environmental observations into later reasoning."}],"actors":[{"name":"Reflection AI","role":"Company approach","note":"The company publicly frames autonomous coding as a core problem and uses reinforcement learning to increase language-model autonomy on computers."}]},"problem-agent-reliability":{"id":"problem-agent-reliability","label":"开放环境中缺乏可证明的自主可靠性","englishLabel":"Agent Reliability Boundary","summary":"Current agents struggle to operate reliably over long horizons, through irreversible actions and under out-of-distribution events.","why":"Current agents struggle to operate reliably over long horizons, through irreversible actions and under out-of-distribution events.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-adaptive-control":{"id":"cap-adaptive-control","label":"通过交互学习决策与控制","englishLabel":"Learning to Decide by Interaction","summary":"Learn policies from the consequences of actions and delayed rewards.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-no-action-labels":{"id":"problem-no-action-labels","label":"最佳行动没有现成监督标签","englishLabel":"No Supervised Action Labels","summary":"In sequential decisions, behavior can be judged only through trial and error and long-term return.","why":"In sequential decisions, behavior can be judged only through trial and error and long-term return.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-reinforcement-learning":{"id":"tech-reinforcement-learning","label":"Reinforcement Learning / RL","englishLabel":"Reinforcement Learning","summary":"Learn a policy from cumulative rewards after actions, without requiring the correct label for every step.","why":"Decision tasks often provide feedback only through future outcomes, and the best action usually has no ready-made demonstration.","mechanism":"Connect states, actions and long-term return through value functions, temporal-difference learning or policy gradients.","changed":"Machines could learn control and sequential decisions through trial and error.","limits":"Rewards are difficult to design, exploration is costly, and flawed proxy objectives can produce unintended behavior.","plainLanguage":"Many tasks do not have a correct action for every step; they only reveal whether the final outcome was good. Reinforcement learning uses reward to connect a sequence of actions with its long-term result.","evidence":[{"title":"Learning to Predict by the Methods of Temporal Differences","note":"TD learning assigns credit through differences between successive predictions, directly originating modern value learning in reinforcement learning."},{"title":"Simple Statistical Gradient-Following Algorithms for Connectionist Reinforcement Learning","note":"REINFORCE established the main policy-gradient approach for optimizing parameterized policies from returns."}],"actors":[{"name":"Reflection AI","role":"Frontier practice","note":"The company combines RL with language models to pursue AlphaGo-like autonomy for tasks performed on computers."}]},"cap-reward-driven-policy":{"id":"cap-reward-driven-policy","label":"没有动作标签，也能从结果学习策略","englishLabel":"Learn Policies from Outcomes","summary":"Delayed rewards can connect actions with long-term outcomes.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-high-dimensional-state":{"id":"problem-high-dimensional-state","label":"高维感知状态需要人工压缩","englishLabel":"High-Dimensional State","summary":"Traditional RL struggles to process complex observations such as images directly.","why":"Traditional RL struggles to process complex observations such as images directly.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-deep-rl":{"id":"tech-deep-rl","label":"Deep Reinforcement Learning / Deep RL","englishLabel":"Deep Reinforcement Learning","summary":"Use deep networks to learn values or policies directly from high-dimensional perceptual input.","why":"Classical RL depended on hand-crafted states and could not directly process complex observations such as pixels and audio.","mechanism":"Combine neural representations with RL algorithms such as value learning, policy optimization and experience replay.","changed":"Perception and control could be trained end to end and scaled to large state spaces.","limits":"Training is unstable and sample-inefficient, with extreme sensitivity to hyperparameters and rewards.","plainLanguage":"Traditional reinforcement learning struggles to represent images or enormous state spaces. Deep RL uses a deep network to learn the state, value or policy from raw input, joining the two technical approaches.","evidence":[{"title":"Human-level control through deep reinforcement learning","note":"A deep network learned value functions from pixels, connecting perception directly to control."}],"actors":[{"name":"Google DeepMind","role":"Landmark advance","note":"DQN combined deep visual representations, Q-learning and experience replay so that one algorithm could learn multiple Atari games directly from pixels."}]},"problem-large-search-space":{"id":"problem-large-search-space","label":"巨大决策树无法穷举","englishLabel":"Combinatorial Search Space","summary":"The branching factor of long-horizon planning far exceeds the capacity of traditional search.","why":"The branching factor of long-horizon planning far exceeds the capacity of traditional search.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-sample-efficiency":{"id":"problem-sample-efficiency","label":"真实交互昂贵，Model-Free 样本效率低","englishLabel":"Interaction Cost","summary":"Learning only through real-world trial and error does not transfer easily to robots or open environments.","why":"Learning only through real-world trial and error does not transfer easily to robots or open environments.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-self-play-search":{"id":"tech-self-play-search","label":"Self-Play + Neural Search / 自博弈搜索","englishLabel":"Self-Play and Neural-Guided Search","summary":"Generate a curriculum through self-play, then use neural networks to guide tree search.","why":"Vast decision trees cannot be exhaustively searched, while human game records can cap the strategy ceiling.","mechanism":"Policy and value networks narrow the search space, while self-play continually generates stronger training data.","changed":"Reached and surpassed top human performance in environments with clear rules and accurate simulation.","limits":"Requires an accurate simulator, explicit outcomes and substantial compute, making direct transfer to open real-world tasks difficult.","plainLanguage":"When rules are clear and the environment can be simulated, a system can repeatedly play against itself to generate training data. A neural network then guides search through the enormous decision space, enabling very high performance.","evidence":[{"title":"A general reinforcement learning algorithm that masters chess, shogi, and Go through self-play","note":"AlphaZero directly combined a self-play curriculum, policy and value networks, and MCTS into a neural-guided search system."}],"actors":[{"name":"Google DeepMind","role":"Landmark advance","note":"AlphaZero generated training data through self-play and closed the loop between policy and value networks and tree search, improving continually in environments with explicit rules."}]},"tech-model-free-rl":{"id":"tech-model-free-rl","label":"Model-Free RL / 无模型强化学习","englishLabel":"Model-Free Value and Policy Learning","summary":"Optimize value functions or policies directly from experience without explicitly learning environmental dynamics.","why":"Real environments are complex, and learning an accurate model may be harder than learning the action directly.","mechanism":"Update Q-values, advantage functions or parameterized policies from trajectory returns.","changed":"Avoided model error and could learn high-performance control with enough interaction.","limits":"Requires extensive trial and error, offers little forward-looking explanation, and cannot easily reuse environmental knowledge for planning.","plainLanguage":"Model-free RL does not first learn a set of world rules. It learns directly from trial and error what to do in each state. This avoids model error but usually requires many interactions and makes consequences difficult to explain in advance.","evidence":[{"title":"Q-learning","note":"Q-learning updates optimal action values directly from transition experience without learning an explicit environmental model, making it a classic origin of Model-Free RL."},{"title":"Human-level control through deep reinforcement learning","note":"A deep network learned value functions from pixels, connecting perception directly to control."}],"actors":[{"name":"Christopher Watkins","role":"Theoretical founder","note":"Q-learning showed that optimal action values can be updated directly from states, actions and rewards without first learning environmental dynamics."}]},"tech-model-based-rl":{"id":"tech-model-based-rl","label":"Model-Based RL / 基于模型的强化学习","englishLabel":"Model-Based Reinforcement Learning","summary":"Learn or use a model of the environment to predict consequences and plan before acting in the real world.","why":"Model-free methods must learn through large numbers of costly or dangerous real-world interactions.","mechanism":"Estimate action-conditioned state transitions and rewards, then search, optimize or generate imagined experience inside the model.","changed":"The same experience could be reused repeatedly for planning, greatly improving sample efficiency.","limits":"Model errors compound over long planning horizons, and a policy may exploit flaws in the learned model.","plainLanguage":"Model-based RL first learns roughly how the environment changes, then tests actions and plans inside that model. It can simulate outcomes before acting, but if the model is wrong, the plan may exploit those errors.","evidence":[{"title":"Integrated Modeling and Control Based on Reinforcement Learning and Dynamic Programming","note":"Dyna placed real-world trial and error, a learned action-conditioned model and internal planning in one loop, making it a direct source of modern model-based RL."},{"title":"Learning Latent Dynamics for Planning from Pixels","note":"PlaNet learns action-conditioned latent dynamics from interaction and plans online directly in the latent space."},{"title":"Dream to Control: Learning Behaviors by Latent Imagination","note":"Dreamer rolls out imagined trajectories inside a learned latent world model and uses them to optimize an actor and critic."}],"actors":[{"name":"Richard Sutton","role":"Theoretical founder","note":"Dyna placed learning from real experience, learning an environmental model and planning inside that model in one loop, establishing the basic structure of model-based reinforcement learning."}]},"cap-superhuman-decision":{"id":"cap-superhuman-decision","label":"可在巨大决策空间中达到高水平","englishLabel":"High-Performance Decisions in Vast Spaces","summary":"Combine learned priors with search to avoid exhaustively enumerating every action.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-world-prediction":{"id":"cap-world-prediction","label":"预测世界与行动后果","englishLabel":"World & Consequence Prediction","summary":"Form an internal world model that supports prediction, counterfactual comparison and planning.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-trial-and-error":{"id":"problem-trial-and-error","label":"真实试错慢、贵且危险","englishLabel":"Costly Trial and Error","summary":"An agent needs to simulate possible consequences before acting.","why":"An agent needs to simulate possible consequences before acting.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-action-conditioned-world":{"id":"tech-action-conditioned-world","label":"Action Conditioning / 动作条件动力学","englishLabel":"Action Conditioning for World Models","summary":"Explicitly models how the state or observation will change after taking action a.","why":"Passive temporal prediction cannot distinguish changes caused by the environment from changes caused by the agent's actions.","mechanism":"The current state and action are jointly fed into a transition model that predicts the next state, observation, reward or abstract representation.","changed":"World models gained a counterfactual action interface, becoming a shared enabler of planning, control and interactive simulation.","limits":"Action data is expensive and not standardized across embodiments; conditional prediction does not by itself identify the true causal mechanism.","plainLanguage":"Predicting the next frame is not enough. An agent needs to know, 'If I take this action, how will the world change?' Action-conditioned models explicitly include the action in the prediction, creating a common interface between world modeling and control.","evidence":[{"title":"Integrated Modeling and Control Based on Reinforcement Learning and Dynamic Programming","note":"Dyna already placed real-world trial and error, a learned action-conditioned model and internal planning in one loop, making it a direct source of modern model-based RL."},{"title":"Action-Conditional Video Prediction using Deep Networks in Atari Games","note":"It showed that high-dimensional video prediction can be conditioned explicitly on control actions; action-conditioned modeling predates the JEPA route."},{"title":"Learning Latent Dynamics for Planning from Pixels","note":"PlaNet learned action-conditioned latent dynamics from interaction and planned online directly in latent space."}],"actors":[{"name":"Junhyuk Oh 等","role":"Key advance","note":"They made actions explicit conditions of video prediction, allowing the model to learn how the scene changes after a particular action rather than merely extrapolating passive video."},{"name":"1X","role":"Company approach","note":"1X World Model conditions on the current image and an input action to predict future robot observations and task-level state value; it directly learns what the robot will see after taking that action."},{"name":"Odyssey","role":"Company approach","note":"Odyssey-1 takes the current state, action and prior state-action history as input and predicts the next state frame by frame. The company explicitly defines its world model as action-conditioned dynamics rather than one-shot video generation."}]},"problem-world-prediction-choice":{"id":"problem-world-prediction-choice","label":"关键分叉：模型究竟需要预测什么？","englishLabel":"What Must a World Model Predict?","summary":"Control, search, understanding and environment generation each require different information about the future.","why":"Different tasks need different future representations, so this is not a single historical line in which one architecture simply replaces another.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-latent-world-models":{"id":"tech-latent-world-models","label":"Latent Dynamics / 潜空间动力学","englishLabel":"Action-Conditioned Latent Dynamics","summary":"Compresses high-dimensional observations into a latent state and learns how that state changes under actions.","why":"Planning directly from pixels is expensive over multiple steps and can waste capacity on textures that do not matter for decisions.","mechanism":"An encoder forms a compact state, while an action-conditioned transition model predicts the next latent state, reward or termination signal.","changed":"Agents could plan or generate imagined experience in a compact state space.","limits":"There is no guarantee that the latent state preserves task-critical variables, and long-horizon rollouts still drift.","plainLanguage":"Predicting the future pixel by pixel is expensive and spends effort on irrelevant detail. A latent world model first compresses the environment into an internal state, then predicts and plans in that smaller space.","evidence":[{"title":"World Models","note":"It learned environmental dynamics in a compressed latent space and trained a controller within that model."},{"title":"Learning Latent Dynamics for Planning from Pixels","note":"PlaNet learned action-conditioned latent dynamics from interaction and planned online directly in latent space."}],"actors":[{"name":"David Ha & Jürgen Schmidhuber","role":"Landmark formulation","note":"World Models separated visual compression, latent dynamics and the controller, showing that an agent can learn behavior inside a low-dimensional world generated by its own model."}]},"tech-value-equivalent-model":{"id":"tech-value-equivalent-model","label":"MuZero / 决策等价模型","englishLabel":"Value-Equivalent World Models","summary":"Learns only the rewards, values and policy information needed for planning, without reconstructing the full observation.","why":"Accurately predicting every pixel is not necessary for decision-making and can make modeling harder.","mechanism":"A representation function, dynamics function and prediction heads are trained together so the hidden state is value-equivalent for search.","changed":"World models could be designed around decision sufficiency rather than visual fidelity.","limits":"The hidden state is difficult to interpret and still relies on simulatable search and a clear reward signal.","plainLanguage":"Making a decision does not require rebuilding the entire world; it only requires preserving information that affects rewards, values and policies. Models such as MuZero learn an internal world that is sufficient for planning rather than one that looks realistic.","evidence":[{"title":"Mastering Atari, Go, chess and shogi by planning with a learned model","note":"It learned only the rewards, values and policies needed for planning rather than reconstructing the full environment."}],"actors":[{"name":"Google DeepMind","role":"Originator","note":"MuZero does not reconstruct the full environment; it learns internal dynamics sufficient to support planning over rewards, values and policies."}]},"tech-jepa":{"id":"tech-jepa","label":"JEPA / 表征空间预测","englishLabel":"Joint-Embedding Predictive Architecture","summary":"Predicts masked or future parts in an abstract representation space rather than generating every pixel.","why":"Pixel-level reconstruction can overemphasize texture noise without learning object and semantic structure.","mechanism":"A context encoder predicts the latent representation produced by a target encoder, avoiding pixel-by-pixel decoding.","changed":"It created a non-generative predictive route focused on understanding; I-JEPA and V-JEPA first address representation learning rather than control.","limits":"Without actions, the model can learn only observational co-occurrence; which representations are sufficient for planning still needs validation.","plainLanguage":"Some future details are inherently unpredictable, and forcing the model to generate every pixel can distract it. JEPA instead predicts the important information that the future should contain in an abstract representation.","evidence":[{"title":"A Path Towards Autonomous Machine Intelligence","note":"It proposed the JEPA idea of predicting in an abstract representation space rather than reconstructing every pixel."},{"title":"Self-Supervised Learning from Images with a Joint-Embedding Predictive Architecture","note":"I-JEPA showed that non-generative representation prediction can learn semantic visual representations; it is first a self-supervised representation-learning route."},{"title":"Revisiting Feature Prediction for Learning Visual Representations from Video","note":"V-JEPA extended feature prediction to video, but it still primarily supports understanding and prediction and does not take agent actions as input."}],"actors":[{"name":"Meta FAIR","role":"Originator and developer","note":"Along the JEPA route, it predicts important but unseen states in video within a representation space."}]},"tech-interactive-world-model":{"id":"tech-interactive-world-model","label":"Generative Interactive Worlds / 生成式交互世界","englishLabel":"Generative Interactive World Models","summary":"Generates coherent, explorable dynamic environments in real time under user or agent control.","why":"Ordinary video generation only continues an observation and cannot serve as an actionable environment that supports counterfactual queries.","mechanism":"It combines video generation, action conditioning or latent actions, and state memory to recurrently generate the next world state after an action.","changed":"World models became interactive simulators for environment creation and for agent training and evaluation.","limits":"Visual realism is not physical realism; object permanence, long-term consistency, real-time generation and verifiability remain hard bottlenecks.","plainLanguage":"An ordinary video plays a fixed sequence. A generative interactive world keeps creating the scene as the user acts, making it more like a controllable simulator. Long-term consistency and realistic physics are still frontier problems.","evidence":[{"title":"Genie: Generative Interactive Environments","note":"It learned latent actions from internet video without action labels and generated interactive environments controllable frame by frame."},{"title":"Genie 2: A large-scale foundation world model","note":"It expanded generative interactive worlds to diverse, controllable 3D environments while exposing limits in long-term consistency."},{"title":"Genie 3: A new frontier for world models","note":"It advanced toward real-time interaction and minute-scale consistency, but it still does not amount to a reliable physics simulator."},{"title":"A generative model of the world from video","note":"It learned an interactive, generative spatiotemporal environment model from video."}],"actors":[{"name":"Google DeepMind / Genie","role":"Developer","note":"Genie learns controllable environments from video and uses generated worlds as spaces for agent training and evaluation."},{"name":"World Labs","role":"Company approach","note":"Marble generates 3D worlds from text, images and video that users can continue exploring, editing and exporting."},{"name":"Decart","role":"Company approach","note":"Oasis turns low-latency video generation into an interactive world model driven by user actions in real time."},{"name":"Runway","role":"Company approach","note":"Runway's GWM-1 is explicitly designed as a real-time, explorable and controllable general world model, with separate directions for interactive worlds, virtual characters and robotics."},{"name":"Odyssey","role":"Company approach","note":"Odyssey-1 generates the next frame every 40 ms in response to live user actions and can continue for several minutes; interaction immediately changes the subsequently generated world."}]},"tech-world-action-model":{"id":"tech-world-action-model","label":"World–Action Joint Models / WAM","englishLabel":"World–Action Joint Models","summary":"A frontier direction that jointly learns world dynamics and action distributions in one model.","why":"World prediction and policy are often trained separately, making it difficult for predictions to become executable actions naturally.","mechanism":"A shared sequence or latent model jointly represents observations, actions, rewards and futures, and is optimized across generative and control objectives.","changed":"It may unify world simulation, planning and policy behind a single generative interface.","limits":"WAM is not yet a single architecture with stable boundaries; reliability, real-time control and evaluation remain early-stage.","plainLanguage":"Traditional systems separate world prediction from action policy. WAM attempts to learn 'what the world will do next' and 'what the agent should do next' together in one generative model.","evidence":[{"title":"JOWA: Jointly Optimized World-Action Model","note":"A representative recent work on joint world–action modeling; the term has not yet fully converged."}],"actors":[{"name":"Jie Cheng 等 / JOWA","role":"Originators","note":"They used a shared Transformer to optimize world prediction and action values jointly, learning transferable representations and decisions from offline data across multiple games."}]},"tech-latent-imagination":{"id":"tech-latent-imagination","label":"Dreamer / 潜空间想象","englishLabel":"Latent Imagination","summary":"Generates imagined trajectories inside a learned latent world model and trains a policy from them.","why":"Learning to predict the world is not enough; the model must turn its predictions into better actions.","mechanism":"It rolls out multiple imagined steps from the current latent state and optimizes an actor and critic using predicted returns.","changed":"Internal simulation could reuse real experience repeatedly, substantially improving the sample efficiency of control.","limits":"A policy can exploit model errors; the quality of long-horizon imagination and calibration to reality remain central bottlenecks.","plainLanguage":"Dreamer avoids testing every candidate action in the real world. Instead, the agent runs many trials in its learned internal world and trains primarily from those imagined trajectories, reducing the amount of real interaction it needs.","evidence":[{"title":"Dream to Control: Learning Behaviors by Latent Imagination","note":"Dreamer rolls out imagined trajectories in a learned latent world model and uses them to optimize an actor and critic."}],"actors":[{"name":"Google DeepMind","role":"Originator and developer","note":"Dreamer imagines many future trajectories within learned latent dynamics and trains its policy from them, reducing interaction with the real environment."}]},"problem-passive-world-model":{"id":"problem-passive-world-model","label":"只看视频，学不到行动造成的变化","englishLabel":"Passive World Modeling","summary":"Temporal co-occurrence alone cannot identify the causal effects of an action intervention.","why":"Temporal co-occurrence alone cannot identify the causal effects of an action intervention.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-action-conditioned-jepa":{"id":"tech-action-conditioned-jepa","label":"Action-Conditioned JEPA / 动作条件表征预测","englishLabel":"Action-Conditioned Predictive Representations","summary":"Builds on representations learned from large-scale action-free video, then learns action-conditioned latent transitions for planning.","why":"Observational representation prediction can understand motion but cannot directly compare the consequences of an agent's candidate actions.","mechanism":"It first learns abstract states from action-free video, then uses limited interaction trajectories to make the predictor accept actions and perform model-predictive control.","changed":"The representation-prediction route converged with classic action-conditioned world models in robot planning.","limits":"Current results still focus on short-horizon visual goals; data efficiency, long-horizon planning and stability across embodiments are not yet established.","plainLanguage":"Standard JEPA predicts how the world changes. Action-conditioned JEPA also includes what the agent did, focusing on which abstract states change after an action rather than generating every pixel.","evidence":[{"title":"V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning","note":"V-JEPA 2-AC first pretrains on action-free video, then uses limited robot interaction data for action-conditioned post-training, bringing representation prediction and control planning together."}],"actors":[{"name":"Meta FAIR","role":"Originator and developer","note":"V-JEPA 2-AC adds a small amount of robot interaction data after action-free video pretraining, allowing its predictions to support planning."}]},"cap-planning-in-imagination":{"id":"cap-planning-in-imagination","label":"行动前可在内部模型中预演","englishLabel":"Plan by Internal Simulation","summary":"An agent can compare imagined trajectories instead of trying every candidate action in the real world.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-counterfactual-world":{"id":"cap-counterfactual-world","label":"可比较不同动作会带来什么后果","englishLabel":"Action-Sensitive Counterfactual Prediction","summary":"World prediction advances from passive frame continuation to sensitivity to action interventions.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-world-consistency":{"id":"problem-world-consistency","label":"共同瓶颈：长时一致性、物理真实性与可验证性不足","englishLabel":"Long-Horizon World Consistency","summary":"Imagined or generated worlds drift over time, and visual credibility does not ensure that their dynamics support decisions.","why":"Imagined or generated worlds drift over time, and visual credibility does not ensure that their dynamics support decisions.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-spatial-world":{"id":"cap-spatial-world","label":"持续的三维空间与对象表征","englishLabel":"Persistent Spatial World Representation","summary":"Continuously represents scene geometry, object relations and navigable space as viewpoints and time change.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-2d-observation":{"id":"problem-2d-observation","label":"二维观测缺乏显式三维一致性","englishLabel":"2D Observation Limitation","summary":"Pixels from a single frame cannot adequately support novel viewpoints, geometric reasoning or persistent spatial memory.","why":"Pixels from a single frame cannot adequately support novel viewpoints, geometric reasoning or persistent spatial memory.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-neural-3d":{"id":"tech-neural-3d","label":"Neural 3D / NeRF & 3DGS","englishLabel":"Neural 3D Representations","summary":"Learns a 3D scene representation from multiview images that can be queried continuously or rendered in real time.","why":"Two-dimensional photographs do not explicitly preserve geometric consistency as the camera moves.","mechanism":"NeRF maps positions and directions to density and color with a neural field, while 3DGS approximates the radiance field with explicit Gaussian primitives.","changed":"Models could synthesize geometrically consistent novel views, creating a foundation for editable spatial assets.","limits":"These methods usually depend on multiview coverage; the representation itself does not solve dynamic objects, semantics or long-term interaction.","plainLanguage":"Traditional 3D reconstruction requires a complex geometry pipeline. NeRF and 3DGS learn a renderable scene directly from multiview photos. They solve consistent novel views, not the broader problems of time, action or physics.","evidence":[{"title":"NeRF: Representing Scenes as Neural Radiance Fields","note":"It used a continuous neural field to synthesize geometrically consistent novel views from multiple camera angles."},{"title":"3D Gaussian Splatting for Real-Time Radiance Field Rendering","note":"It achieved high-quality real-time rendering with explicit 3D Gaussians."}],"actors":[{"name":"World Labs","role":"Company approach","note":"It uses multimodal world models to generate exportable Gaussian splats, meshes and video directly."}]},"cap-novel-view-geometry":{"id":"cap-novel-view-geometry","label":"从已有视角生成一致的新视角","englishLabel":"Novel-View Consistent Geometry","summary":"A scene representation maintains geometric consistency as the camera moves.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-static-scenes":{"id":"problem-static-scenes","label":"静态场景表征缺乏时间、对象和交互","englishLabel":"Static Scene Limitation","summary":"Reconstructing geometry is not the same as understanding how a dynamic world changes through action.","why":"Reconstructing geometry is not the same as understanding how a dynamic world changes through action.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-spatiotemporal-world":{"id":"tech-spatiotemporal-world","label":"Spatiotemporal World Models / 时空世界模型","englishLabel":"Spatiotemporal Generative World Models","summary":"Jointly preserves a scene's 3D structure, temporal changes and object continuity.","why":"Static 3D reconstruction cannot explain how objects move, disappear, reappear or respond to interaction.","mechanism":"It combines spatial representation, video generation and persistent state, recurrently advancing the world latent over time.","changed":"An environment could be generated and queried as one continuously changing whole rather than a collection of independent frames.","limits":"Long-term memory, object permanence through occlusion, scaling and realistic physics remain unreliable.","plainLanguage":"A static 3D scene does not move or know whether an occluded object still exists. A spatiotemporal world model tries to maintain spatial structure, change over time and continuity of objects together.","evidence":[{"title":"D-NeRF: Neural Radiance Fields for Dynamic Scenes","note":"D-NeRF extended static neural radiance fields to scenes that deform over time, directly supporting the dynamic spatiotemporal representation branch."},{"title":"A generative model of the world from video","note":"It learned an interactive, generative spatiotemporal environment model from video."}],"actors":[{"name":"World Labs","role":"Company approach","note":"It is developing persistent, navigable, controllable and spatially consistent generative 3D worlds."},{"name":"NVIDIA Cosmos","role":"Company approach","note":"Cosmos World Foundation Models generate physically continuous future video and world states for robotics and autonomous driving, and support further training on real physical tasks."}]},"cap-persistent-generative-world":{"id":"cap-persistent-generative-world","label":"世界可被持续生成，并保持空间状态","englishLabel":"Persistent Generative Worlds","summary":"Models maintain scenes and objects over time instead of generating disconnected frames.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-wam-reliability":{"id":"problem-wam-reliability","label":"动态世界仍缺少稳定的对象恒常与真实物理","englishLabel":"Persistent Spatial Reliability","summary":"Spatiotemporal generation can break object identity, geometry, or physical laws after occlusion, long horizons, and interaction.","why":"Spatiotemporal generation can break object identity, geometry, or physical laws after occlusion, long horizons, and interaction.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-embodied-generalization":{"id":"cap-embodied-generalization","label":"机器人技能向新任务与新环境迁移","englishLabel":"Generalist Embodied Intelligence","summary":"Robots understand natural-language instructions and transfer learned skills to new objects, scenes, and tasks.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-robot-programming":{"id":"problem-robot-programming","label":"手写控制与单任务策略难扩展","englishLabel":"Task-Specific Robot Programming","summary":"Programming each task separately cannot cover the combinatorial variation of an open world.","why":"Programming each task separately cannot cover the combinatorial variation of an open world.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-imitation-learning":{"id":"tech-imitation-learning","label":"Imitation Learning / 模仿学习","englishLabel":"Imitation Learning and Behavior Cloning","summary":"Learn a direct mapping from observations to actions using expert demonstrations.","why":"Handwritten robot rules cannot cover complex perception and contact behavior, while online trial and error is expensive and dangerous.","mechanism":"Behavior Cloning treats demonstrations as supervised data; methods such as DAgger then collect states visited by the learned policy and obtain corrections.","changed":"Robot skills can be acquired in bulk from human teleoperation or historical trajectories.","limits":"Errors compound once the policy leaves the demonstration distribution, and the model may copy suboptimal expert behavior.","plainLanguage":"The most direct way for a robot to learn is to watch a person or expert and imitate them. This makes broad use of demonstrations, but errors can quickly compound when the robot reaches states those demonstrations never covered.","evidence":[{"title":"A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning","note":"DAgger directly characterizes distribution shift and compounding error in behavior cloning and introduces an interactive correction loop."}],"actors":[{"name":"Stéphane Ross, Geoffrey Gordon & Drew Bagnell / Carnegie Mellon","role":"Key contributor","note":"DAgger has the learned policy continually collect the states it actually visits and request expert labels, directly addressing distribution shift in behavior cloning."}]},"tech-offline-rl":{"id":"tech-offline-rl","label":"Offline RL / 离线强化学习","englishLabel":"Offline Reinforcement Learning","summary":"Optimize a policy using only fixed historical data, with no further environment exploration during training.","why":"Online trial and error with real robots is costly, while organizations often already have large logs and failure trajectories.","mechanism":"While learning values or policies, constrain the model from relying too heavily on actions not covered by the dataset.","changed":"Rewards and failures in historical data can be used beyond pure imitation.","limits":"The value of out-of-distribution actions may be overestimated, and offline evaluation cannot fully replace validation in real deployments.","plainLanguage":"Organizations often have extensive operating logs but cannot let robots explore recklessly online. Offline RL learns only from these fixed logs and tries not to trust actions the data never contains.","evidence":[{"title":"Off-Policy Deep Reinforcement Learning without Exploration","note":"BCQ directly exposes extrapolation error in fixed datasets and uses a batch constraint to limit actions outside the data distribution."}],"actors":[{"name":"Scott Fujimoto, David Meger & Doina Precup","role":"Key contributor","note":"BCQ reduces erroneous overestimation of out-of-distribution Q-values by restricting the policy to actions supported by the offline dataset."}]},"cap-learned-robot-policy":{"id":"cap-learned-robot-policy","label":"机器人动作可以从数据中学习","englishLabel":"Learn Robot Policies from Data","summary":"Control no longer depends entirely on handcrafted state machines and task-by-task programming.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-robot-data":{"id":"problem-robot-data","label":"真实机器人数据稀缺且机体割裂","englishLabel":"Robot Data Bottleneck","summary":"Data collection is slow and expensive, and data from different robots and tasks is difficult to share.","why":"Data collection is slow and expensive, and data from different robots and tasks is difficult to share.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-simulation-sim2real":{"id":"tech-simulation-sim2real","label":"Simulation & Sim-to-Real / 仿真迁移","englishLabel":"Simulation, Domain Randomization and Sim-to-Real","summary":"Train in simulators that support trial and error at scale, then transfer the policy to real robots.","why":"Real-world data collection is slow, expensive, and dangerous, and it struggles to cover long-tail failures.","mechanism":"Generate experience in parallel in simulation, then narrow the reality gap through domain randomization, system identification, or adaptation.","changed":"The scale of training data and exploration is no longer fully constrained by real-hardware throughput.","limits":"Missing contact dynamics, sensor effects, and environmental details in simulators create a reality gap.","plainLanguage":"Trial and error with real robots is slow, costly, and dangerous, so robots first practice at scale in simulation and then transfer to reality. The central challenge is the persistent gap between simulation and real contact, sensors, and environments.","evidence":[{"title":"Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World","note":"Randomizing the appearance of simulated environments helps narrow the sim-to-real gap."}],"actors":[{"name":"Skild AI","role":"Company path","note":"Trains control policies across one hundred thousand robot embodiments in large-scale simulation, then evaluates zero-shot embodiment adaptation."},{"name":"NVIDIA Cosmos","role":"Company path","note":"Cosmos connects controllable world generation, video data processing, and Omniverse simulation to train and evaluate robotics and autonomous-driving models on large volumes of synthetic scenarios before transferring capabilities to real systems."}]},"tech-robot-foundation":{"id":"tech-robot-foundation","label":"Robot Foundation Models / 机器人基础模型","englishLabel":"Cross-Embodiment Robot Foundation Models","summary":"Pretrain transferable policies across multiple tasks, environments, and even robot embodiments.","why":"A single robot and task produce too little data, and policies tied to one embodiment cannot be reused.","mechanism":"Unify observation and action representations across datasets, then use large models to absorb cross-task patterns.","changed":"Robot learning gains a path similar to language models: a pretrained base followed by downstream adaptation.","limits":"Action spaces and sensors remain fragmented, while data quality and physical differences constrain the benefits of cross-embodiment transfer.","plainLanguage":"One robot and one task provide too little data, and the skills learned are hard to reuse. Robot foundation models combine data from many tasks, environments, and embodiments into a shared pretrained base.","evidence":[{"title":"Open X-Embodiment: Robotic Learning Datasets and RT-X Models","note":"Cross-institution, cross-embodiment data and models advance the transfer of robot policies."}],"actors":[{"name":"Physical Intelligence","role":"Company path","note":"π0.5 combines cross-robot data, VLM semantics, and a continuous-action expert into a general-purpose robot policy."},{"name":"Skild AI","role":"Company path","note":"Trains a unified robot foundation model across tasks and embodiments using simulation, internet video, and real-robot data."},{"name":"Figure","role":"Company path","note":"Helix uses one set of weights for multiple manipulation tasks and two-robot collaboration without task-specific fine-tuning, connecting general semantic knowledge to reusable robot control as a pretrained base."},{"name":"Generalist","role":"Company path","note":"GEN-0 is pretrained directly on large-scale real physical interaction and reports transfer across 6DoF, 7DoF, and semi-humanoid robots. Its central claim is that robot capabilities scale predictably with data, compute, and model size."},{"name":"Covariant","role":"Company path","note":"Covariant describes RFM-1 as its first commercial robot foundation model, grounded in years of warehouse robot deployments. Its public pages do not disclose enough architecture or training detail, so it is included as evidence of the path rather than treating its performance claims as independently verified."}]},"problem-semantic-action-gap":{"id":"problem-semantic-action-gap","label":"互联网语义知识与连续动作脱节","englishLabel":"Semantic–Action Gap","summary":"VLMs understand objects and language but lack robot action interfaces and control experience.","why":"VLMs understand objects and language but lack robot action interfaces and control experience.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-vla":{"id":"tech-vla","label":"VLA / Vision–Language–Action","englishLabel":"Vision–Language–Action Models","summary":"Place images, language instructions, and robot actions in a single sequence model.","why":"Internet pretraining provides rich semantic knowledge but cannot directly output continuous, embodied actions.","mechanism":"Discretize actions as tokens or use a dedicated action head, then predict them jointly with vision and language tokens.","changed":"Natural language can specify robot tasks, and semantic concepts can transfer to manipulation policies.","limits":"Discrete tokens struggle with high-frequency precision control, and a large gap remains between internet knowledge and real-world dynamics.","plainLanguage":"Vision-language models know what they see and what an instruction means, but they cannot directly control a robot. VLA models place images, language, and actions in one model so natural-language instructions can drive real operations.","evidence":[{"title":"RT-2: Vision-Language-Action Models","note":"Represents robot actions as tokens so vision-language pretraining can transfer to control."}],"actors":[{"name":"Google DeepMind","role":"Originator","note":"RT-2 represents actions as tokens so vision-language knowledge can transfer to robot control."},{"name":"Physical Intelligence","role":"Company path","note":"π0 adds a continuous-action expert to a pretrained VLM for generalization across robots and tasks."},{"name":"Figure","role":"Company path","note":"Helix uses a slower vision-language model to produce semantic goals, then a 200Hz visuomotor policy converts those goals into continuous upper-body actions. This is a clear VLA path from language to robot control."}]},"cap-semantic-robot-policy":{"id":"cap-semantic-robot-policy","label":"机器人能按语言迁移到更多任务","englishLabel":"Semantically Generalist Robot Policies","summary":"Vision-language knowledge becomes a shared interface for understanding tasks and transferring skills.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-multimodal-actions":{"id":"problem-multimodal-actions","label":"动作分布多峰、连续且长时依赖","englishLabel":"Multimodal Continuous Actions","summary":"One goal may have several valid trajectories, while stepwise regression tends to average them or produce jitter.","why":"One goal may have several valid trajectories, while stepwise regression tends to average them or produce jitter.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-generative-policy":{"id":"tech-generative-policy","label":"Generative Action Policies / 生成式动作策略","englishLabel":"Generative Action Policies","summary":"Use generative models such as Diffusion or Flow to represent multimodal, continuous action sequences.","why":"A single observation often supports several reasonable actions, while regressing to their average can produce an unusable compromise.","mechanism":"A conditional generative model produces an action chunk or trajectory at once, then samples and replans during inference.","changed":"Policies can express multiple modes of behavior and generate smooth, coordinated continuous control.","limits":"Multi-step sampling adds latency, while long-horizon tasks still require higher-level planning and closed-loop correction.","plainLanguage":"The same scene often allows several reasonable actions, and simply averaging them may produce something no one would do. Generative policies learn multiple complete action sequences, then sample and replan among them.","evidence":[{"title":"Diffusion Policy","note":"Uses conditional diffusion to represent multimodal, high-dimensional continuous action distributions."}],"actors":[{"name":"Physical Intelligence","role":"Company path","note":"Uses flow matching to generate continuous action chunks while preserving the multimodal action distributions needed for dexterous manipulation."}]},"problem-demonstration-ceiling":{"id":"problem-demonstration-ceiling","label":"示范分布外失败，策略难自我纠正","englishLabel":"Demonstration Ceiling","summary":"Imitating only successful examples cannot sustain improvement from failures, exploration, and real-world feedback.","why":"Imitating only successful examples cannot sustain improvement from failures, exploration, and real-world feedback.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-real-world-rl":{"id":"tech-real-world-rl","label":"Real-World RL / 真实世界策略后训练","englishLabel":"Real-World RL and Policy Post-Training","summary":"Let robots keep improving in deployment environments using feedback from outcomes.","why":"Demonstrations and offline data cannot cover every state and failure encountered in real operation.","mechanism":"Run online reinforcement learning or post-training under safety constraints, reset mechanisms, and human supervision.","changed":"Policies can correct errors outside the demonstration distribution and adapt to specific hardware and environments.","limits":"Physical trial and error is irreversible, rewards are hard to specify, and data throughput and safety review remain hard constraints.","plainLanguage":"Demonstrations and offline data can never cover every failure in real deployment. Real-world RL lets robots keep correcting their policies from actual outcomes under safety constraints and supervision.","evidence":[{"title":"QT-Opt: Scalable Deep Reinforcement Learning for Vision-Based Robotic Manipulation","note":"A representative work on large-scale real-robot interaction and closed-loop reinforcement learning that predates the current VLA post-training narrative."}],"actors":[{"name":"Google Robotics","role":"Large-scale deployment","note":"QT-Opt accumulated large-scale grasping experience across a fleet of real robots, showing that deep reinforcement learning can train real manipulation policies in parallel across machines."}]},"problem-embodied-safety":{"id":"problem-embodied-safety","label":"物理试错不可逆，长期泛化仍不可靠","englishLabel":"Embodied Safety Boundary","summary":"Real deployments require low latency, recoverability, safety validation, and robustness across environments.","why":"Real deployments require low latency, recoverability, safety validation, and robustness across environments.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-trustworthy-intelligence":{"id":"cap-trustworthy-intelligence","label":"可评价、可校正的模型行为","englishLabel":"Evaluable & Correctable Intelligence","summary":"Identify when a model may fail, explain why it failed, and let external supervision correct it.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-benchmark-gap":{"id":"problem-benchmark-gap","label":"离线指标不能代表开放环境可靠性","englishLabel":"Benchmark–Reality Gap","summary":"Average scores hide out-of-distribution, adversarial, and long-horizon failures.","why":"Average scores hide out-of-distribution, adversarial, and long-horizon failures.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-black-box":{"id":"problem-black-box","label":"内部表征和失效因果难理解","englishLabel":"Black-Box Failure","summary":"Input–output behavior alone cannot reveal why a model develops dangerous behavior.","why":"Input–output behavior alone cannot reveal why a model develops dangerous behavior.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-supervision-scale":{"id":"problem-supervision-scale","label":"模型能力超过人工逐步监督","englishLabel":"Scalable Supervision","summary":"People cannot verify every element of complex outputs and long-running actions.","why":"People cannot verify every element of complex outputs and long-running actions.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-uncertainty-calibration":{"id":"tech-uncertainty-calibration","label":"Uncertainty & Calibration / 不确定性校准","englishLabel":"Uncertainty Estimation and Calibration","summary":"Make model confidence reflect the true probability of being correct and identify unfamiliar inputs.","why":"A high score does not guarantee reliability, and models can be highly confident while wrong on out-of-distribution inputs.","mechanism":"Estimate epistemic and data uncertainty through probability calibration, ensembles, Bayesian approximations or selective prediction.","changed":"Systems could use confidence to abstain, seek help or escalate to human review.","limits":"Neural networks often become miscalibrated under distribution shift, and one probability cannot summarize every failure mode.","plainLanguage":"A confident model is not necessarily more likely to be right. Uncertainty calibration tries to align confidence with actual risk so the system can decide when to answer, request review or hand the case to a person.","evidence":[{"title":"On Calibration of Modern Neural Networks","note":"The paper systematically characterizes the gap between confidence and true accuracy in modern deep networks."}],"actors":[{"name":"Chuan Guo, Geoff Pleiss, Yu Sun & Kilian Weinberger","role":"Key advance","note":"They showed systematically that modern deep networks are often overconfident and that simple temperature scaling can substantially improve probability calibration."}]},"tech-adversarial-robustness":{"id":"tech-adversarial-robustness","label":"Adversarial Robustness / 对抗鲁棒性","englishLabel":"Adversarial Robustness","summary":"Train and evaluate models to withstand deliberately constructed small perturbations and attacks.","why":"Input changes that are almost invisible to people can make a deep network produce a completely different prediction.","mechanism":"Generate worst-case perturbations for adversarial training and constrain sensitivity with certification or detection methods.","changed":"Safety evaluation expanded from average accuracy to worst-case behavior in the presence of an adversary.","limits":"Defenses often cover only specific threat models and may reduce clean-data performance or be bypassed by new attacks.","plainLanguage":"Changes that people can barely see may reverse a model's judgment. Adversarial robustness studies how to attack and train models under worst-case conditions instead of looking only at average accuracy.","evidence":[{"title":"Explaining and Harnessing Adversarial Examples","note":"The paper exposes neural networks' vulnerability to small, targeted perturbations."}],"actors":[{"name":"Ian Goodfellow, Jonathon Shlens & Christian Szegedy","role":"Landmark proponents","note":"Using a linear explanation and the fast gradient method, they showed that tiny input perturbations can systematically fool deep networks, establishing adversarial robustness as a core problem."}]},"tech-interpretability":{"id":"tech-interpretability","label":"Mechanistic Interpretability / 机制可解释性","englishLabel":"Interpretability and Mechanistic Analysis","summary":"Analyze which internal representations and computations cause a model's output or failure.","why":"Input–output behavior alone cannot locate the cause of an error or show whether the model relies on the wrong cues.","mechanism":"Inspect internal computation through attribution, probes, feature decomposition, causal interventions or circuit analysis.","changed":"Researchers could formulate more specific mechanistic hypotheses and locally audit some model behaviors.","limits":"Explanations may be unfaithful, and scaling them to the global behavior of large models remains extremely difficult.","plainLanguage":"Inputs and outputs alone reveal little about why a model succeeds or fails. Mechanistic interpretability opens the internal computation to identify which representations, features or circuits actually influence the result.","evidence":[{"title":"A Mathematical Framework for Transformer Circuits","note":"This is a representative work on analyzing Transformer mechanisms as composable circuits."}],"actors":[{"name":"Anthropic","role":"Frontier advance","note":"Anthropic uses dictionary learning to decompose superposed neural activations into more interpretable features as part of its long-term safety research."},{"name":"Goodfire","role":"Company approach","note":"Goodfire builds model-understanding and intervention tools around central unsolved problems in mechanistic interpretability."},{"name":"Transluce","role":"Research advance","note":"Transluce's ADAG toolchain traces attribution through MLP neurons, clusters activation patterns and generates natural-language explanations, turning circuit analysis into repeatable public infrastructure."}]},"tech-scalable-oversight":{"id":"tech-scalable-oversight","label":"Scalable Oversight / 可扩展监督","englishLabel":"Scalable Oversight and AI Feedback","summary":"Use decomposition, AI-assisted evaluation or weak supervision to oversee models whose capabilities exceed an individual's direct judgment.","why":"As models grow more capable, people cannot inspect every reasoning step and action.","mechanism":"Break tasks into smaller parts, have models review one another, or use constitutional rules and weaker-model feedback to amplify supervision.","changed":"Human supervision could shift from personally performing a task to designing and auditing the evaluation process.","limits":"The supervision chain may share the same errors, while strong models may learn to appease or manipulate evaluators.","plainLanguage":"When a model performs a task better than any one person, a human cannot grade each step directly. Scalable oversight expands human supervision through task decomposition, AI-assisted review and rule-based evaluation.","evidence":[{"title":"Weak-to-Strong Generalization","note":"The work studies how a less capable supervisor might oversee a stronger model."}],"actors":[{"name":"OpenAI","role":"Frontier advance","note":"Weak-to-Strong studies whether a weaker supervisor can train a stronger model, directly addressing the bottleneck that people cannot judge every output of a superhuman system."},{"name":"Transluce","role":"Research advance","note":"Transluce organizes internal model understanding, behavioral monitoring and anomaly detection into a public oversight stack intended to help people inspect increasingly capable models at scale."}]},"cap-aware-of-failure":{"id":"cap-aware-of-failure","label":"模型知道何时可能出错并选择求助","englishLabel":"Failure-Aware Behavior","summary":"A system can turn uncertainty into abstention, review or fallback policies.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-governed-autonomy":{"id":"cap-governed-autonomy","label":"自主行为可以被约束、审计和纠正","englishLabel":"Governed and Correctable Autonomy","summary":"Oversight governs permissions, process and stopping conditions, not only the final score.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-evaluator-capture":{"id":"problem-evaluator-capture","label":"评价器可能被投机或与真实目标错位","englishLabel":"Evaluator Capture","summary":"The better a system becomes at optimization, the more likely it is to exploit loopholes in proxy metrics.","why":"The better a system becomes at optimization, the more likely it is to exploit loopholes in proxy metrics.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-self-improvement":{"id":"cap-self-improvement","label":"可验证的持续自我改进","englishLabel":"Verifiable Continual Self-Improvement","summary":"A system proposes, implements and validates improvements to models, algorithms or workflows.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-human-improvement-loop":{"id":"problem-human-improvement-loop","label":"研究、实验和改进由人类串行驱动","englishLabel":"Human-Limited Improvement Loop","summary":"AI R&D still depends on people to propose hypotheses, write code, run experiments and interpret results.","why":"AI R&D still depends on people to propose hypotheses, write code, run experiments and interpret results.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-automl-nas":{"id":"tech-automl-nas","label":"AutoML & NAS / 自动机器学习","englishLabel":"AutoML and Neural Architecture Search","summary":"Automatically search model architectures, hyperparameters or data-processing pipelines.","why":"The design space is too large for slow, sequential researcher experiments and is vulnerable to human heuristics.","mechanism":"Controllers, Bayesian optimization, evolutionary algorithms or differentiable search propose candidates and select them using proxy metrics.","changed":"Machines could propose and validate designs within a defined search space.","limits":"Search is computationally expe
