  <script>window.MAP_LOCALE="en";window.MAP_DATA={"meta":{"generatedAt":"2026-11-10T20:00:41.887Z","nodes":222,"edges":307,"paths":16,"sourceVersion":"2026-08-15.v6"},"overviewView":{"x":-420,"y":1370,"width":3400,"height":1904},"overviewIds":["cap-adaptive-intelligence","cap-grounding","cap-model-memory","cap-learning-generalization","cap-reasoning-decision","cap-action-interaction","cap-evaluation-regulation"],"nodes":[{"id":"cap-adaptive-intelligence","label":"开放环境中的通用适应性智能","en":"General Adaptive Intelligence","entityKind":"capability_root","status":"horizon","x":360,"y":2400,"w":300,"h":94,"summary":"在开放、变化且不完全可知的环境中，持续感知、建模、学习、决策、行动，并根据反馈校正自身。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-grounding","label":"感知与扎根","en":"Perception & Grounding","entityKind":"foundation_capability","status":"established","x":1080,"y":1650,"w":174,"h":74,"summary":"让像素、声音和语言指向真实世界中的对象、关系与状态。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-model-memory","label":"建模与记忆","en":"Modeling & Memory","entityKind":"foundation_capability","status":"established","x":1080,"y":1950,"w":174,"h":74,"summary":"保存相关历史，表示当前状态，并预测接下来可能发生什么。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-learning-generalization","label":"学习与泛化","en":"Learning & Generalization","entityKind":"foundation_capability","status":"established","x":1080,"y":2250,"w":174,"h":74,"summary":"把训练经验迁移到未见样本、任务和环境。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-reasoning-decision","label":"推理、规划与决策","en":"Reasoning, Planning & Decision","entityKind":"foundation_capability","status":"established","x":1080,"y":2550,"w":211,"h":74,"summary":"在不确定性与资源约束下比较方案、规划步骤并做出决策。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-action-interaction","label":"行动与交互","en":"Action & Interaction","entityKind":"foundation_capability","status":"established","x":1080,"y":2850,"w":174,"h":74,"summary":"通过数字工具或物理动作改变环境，再把结果纳入下一轮。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-evaluation-regulation","label":"评价与自我调节","en":"Evaluation & Self-Regulation","entityKind":"foundation_capability","status":"established","x":1080,"y":3150,"w":190,"h":74,"summary":"知道何时应继续、纠错、求助、拒答或停止。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-explicit-intelligence","label":"机器可学习的知识与问题求解","en":"Machine Learning & Problem Solving","entityKind":"composite_capability","status":"established","x":1550,"y":5480,"w":298,"h":76,"summary":"让机器既能显式操作知识，也能从数据中归纳规律和内部表征。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-encode-intelligence","label":"知识与求解过程难以形式化","en":"How to Encode Intelligence","entityKind":"problem","status":"established","x":1960,"y":5480,"w":298,"h":66,"summary":"早期 AI 首先要回答：知识如何表示，解题过程如何被机器执行。","why":"早期 AI 首先要回答：知识如何表示，解题过程如何被机器执行。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-symbolic-ai","label":"Symbolic AI / 符号主义","en":"Symbolic AI","entityKind":"technical_route","status":"historical","x":2380,"y":5400,"w":262,"h":74,"summary":"以符号、逻辑、规则与搜索显式表示知识和求解步骤。","why":"早期 AI 需要让机器能够操作知识，而不只是执行固定算术程序。","mechanism":"把对象与关系编码成符号，再用逻辑推演、状态空间搜索或规划寻找解。","changed":"机器第一次可以沿着可检查的步骤完成推理与规划。","limits":"开放世界的例外难以穷举；符号如何来自感知也没有自然答案。","plainLanguage":"早期 AI 很像把人的解题套路写成一本机器能执行的规则手册。好处是每一步都能检查；问题是现实里的例外太多，规则很快就写不完。","evidence":[{"kind":"paper","year":1976,"title":"Computer Science as Empirical Inquiry: Symbols and Search","url":"https://dl.acm.org/doi/10.1145/360018.360022","note":"Newell 与 Simon 以物理符号系统和启发式搜索直接界定了经典符号主义的核心主张。"}],"actors":[{"name":"Allen Newell & Herbert A. Simon","role":"提出者","kind":"人物","url":"https://dl.acm.org/doi/10.1145/360018.360022","note":"以物理符号系统和启发式搜索明确界定经典符号主义主张。","sourceTitle":"Computer Science as Empirical Inquiry","year":1976}]},{"id":"cap-explicit-reasoning","label":"可追踪的推理与规划","en":"Traceable Reasoning & Planning","entityKind":"capability_outcome","status":"established","x":2790,"y":5400,"w":233,"h":74,"summary":"推理步骤可以检查、组合和复用。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-symbolic-brittleness","label":"规则脆弱，知识获取成本高","en":"Brittleness & Knowledge Acquisition","entityKind":"problem","status":"established","x":3200,"y":5480,"w":298,"h":66,"summary":"开放世界中的例外和不确定性使手写规则迅速膨胀。","why":"开放世界中的例外和不确定性使手写规则迅速膨胀。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-expert-systems","label":"Expert Systems / 专家系统","en":"Expert Systems","entityKind":"technical_route","status":"historical","x":3610,"y":5350,"w":291,"h":68,"summary":"把领域专家的判断规则写入知识库，并由推理机调用。","why":"通用符号求解器缺少具体行业知识，必须把专家经验工程化。","mechanism":"以规则库、事实库和推理机分离知识与执行。","changed":"证明了知识密集型 AI 可以在医疗、配置等窄领域形成产品。","limits":"知识获取、维护与例外处理成本极高，系统也难从新数据自行学习。","plainLanguage":"专家系统把医生、工程师等人的经验整理成“如果发生 A，就做 B”的规则库。它证明 AI 能在窄领域真正工作，但知识要靠人不断录入和维护。","evidence":[{"kind":"paper","year":1980,"title":"R1: An Expert in the Computer Systems Domain","url":"https://s.aaai.org/Library/AAAI/1980/aaai80-076.php","note":"R1 展示规则式专家系统把领域知识工程化并投入真实生产；它是符号主义的应用分支。"}],"actors":[{"name":"John McDermott / Carnegie Mellon University","role":"代表性提出","kind":"人物与 Lab","url":"https://s.aaai.org/Library/AAAI/1980/aaai80-076.php","note":"R1（后来称 XCON）把专家知识写成可执行规则，用于配置计算机系统，是专家系统从实验走向真实业务的代表案例。","sourceTitle":"R1: An Expert in the Computer Systems Domain","year":1980}]},{"id":"tech-probabilistic-models","label":"Probabilistic Graphical Models / 概率图模型","en":"Probabilistic Graphical Models","entityKind":"technical_route","status":"historical","x":3610,"y":5520,"w":277,"h":76,"summary":"用图结构表达变量依赖，并在不完整信息下进行概率推断。","why":"现实信息带有噪声和缺失，确定性规则无法表达不确定程度。","mechanism":"以有向或无向图分解联合概率分布，再执行条件推断与学习。","changed":"把“可能性多大”纳入了结构化推理，并连接统计学习与领域知识。","limits":"相关依赖不自动等于因果；复杂图上的精确推断也可能不可计算。","plainLanguage":"现实信息往往不完整，机器不能只回答“是或不是”。概率图模型让它同时考虑多种可能，并随着新证据更新判断。","evidence":[{"kind":"paper","year":1985,"title":"Bayesian Networks: A Model of Self-Activated Memory for Evidential Reasoning","url":"https://bayes.cs.ucla.edu/csl_papers.html","note":"Pearl 的原始技术报告把概率依赖组织成可传播证据的有向网络，是概率图模型主干的直接来源。"}],"actors":[{"name":"Judea Pearl","role":"提出者","kind":"人物","url":"https://bayes.cs.ucla.edu/csl_papers.html","note":"把概率依赖组织为可传播证据的有向网络，是贝叶斯网络主干来源。","sourceTitle":"Bayesian Networks","year":1985}]},{"id":"tech-causal-models","label":"Causal Models / 因果模型","en":"Causal Models & Counterfactual Reasoning","entityKind":"technical_route","status":"established","x":4020,"y":5610,"w":281,"h":68,"summary":"用结构因果模型区分观察、干预与反事实。","why":"只拟合相关性无法回答“如果主动改变某因素，会发生什么”。","mechanism":"把变量间生成机制写成结构方程，并用 do-operator 表达干预。","changed":"让政策评估、实验设计与机制推理可以超越相关预测。","limits":"因果结构仍依赖假设、实验或领域知识；高维开放环境中的发现很困难。","plainLanguage":"普通预测只能说两件事经常一起发生，因果模型还想回答“我主动改变其中一个，另一个会怎样”。这让 AI 能讨论干预和反事实，而不只是复述相关性。","evidence":[{"kind":"paper","year":1995,"title":"Causal Diagrams for Empirical Research","url":"https://doi.org/10.1093/biomet/82.4.669","note":"以因果图表达假设，并判断观测数据能否识别干预效应，是结构因果路线的直接理论来源。"}],"actors":[{"name":"Judea Pearl","role":"提出者","kind":"人物","url":"https://doi.org/10.1093/biomet/82.4.669","note":"用因果图与干预语义区分相关、干预和反事实。","sourceTitle":"Causal Diagrams for Empirical Research","year":1995}]},{"id":"tech-statistical-learning","label":"Statistical Machine Learning / 统计学习","en":"Statistical Machine Learning","entityKind":"technical_route","status":"historical","x":4020,"y":5350,"w":235,"h":76,"summary":"从样本中估计能在未见数据上工作的预测规则。","why":"手写规则无法覆盖数据中的复杂变化，需要让模型从经验中归纳。","mechanism":"用损失函数、正则化与泛化理论在假设空间中选择模型。","changed":"AI 的核心从“写出规则”转向“用数据学习规则”。","limits":"性能高度依赖人工特征、数据分布与任务专用建模。","plainLanguage":"与其让人把所有规则写出来，不如给机器一批例子，让它自己找出能用于新数据的规律。统计学习把 AI 的重心从“写规则”转向了“从样本学规则”。","evidence":[{"kind":"book","year":1995,"title":"The Nature of Statistical Learning Theory","url":"https://link.springer.com/book/10.1007/978-1-4757-2440-0","note":"Vapnik 系统给出经验风险、泛化能力与容量控制，直接支撑统计学习范式。"}],"actors":[{"name":"Vladimir Vapnik","role":"理论奠基","kind":"人物","url":"https://link.springer.com/book/10.1007/978-1-4757-2440-0","note":"以统计学习理论系统解释经验风险、模型容量与泛化之间的关系，为之后的核方法和 SVM 提供理论底座。","sourceTitle":"The Nature of Statistical Learning Theory","year":1995}]},{"id":"tech-kernel-methods","label":"Kernel Methods & SVM / 核方法","en":"Kernel Methods & Support Vector Machines","entityKind":"technical_route","status":"historical","x":4430,"y":5260,"w":300,"h":76,"summary":"以最大间隔和核技巧学习高维非线性决策边界。","why":"线性模型不足以分开复杂数据，但直接显式构造高维特征昂贵。","mechanism":"通过核函数计算隐式特征空间内积，并以最大间隔提升泛化。","changed":"在中小数据时代建立了强大、理论清晰的非线性学习方法。","limits":"计算随样本增长较快，表示仍受预先选择的核函数限制。","plainLanguage":"有些数据在原来的坐标里分不开，核方法相当于换一个更合适的观察空间再画边界。它在深度学习之前，是处理中小规模复杂分类问题的重要办法。","evidence":[{"kind":"paper","year":1995,"title":"Support-Vector Networks","url":"https://link.springer.com/article/10.1007/BF00994018","note":"SVM 以核映射与最大间隔形成统计学习时代的代表性非线性路线。"}],"actors":[{"name":"Corinna Cortes & Vladimir Vapnik / AT&T Bell Labs","role":"提出者","kind":"人物与 Lab","url":"https://link.springer.com/article/10.1007/BF00994018","note":"用最大间隔和核函数把非线性分类转写成高维空间中的凸优化问题，确立了 SVM 主干。","sourceTitle":"Support-Vector Networks","year":1995}]},{"id":"tech-tree-ensembles","label":"Decision Trees & Ensembles / 树与集成学习","en":"Decision Trees & Ensemble Learning","entityKind":"technical_route","status":"historical","x":4430,"y":5430,"w":300,"h":76,"summary":"组合决策树或弱学习器，形成稳健的结构化数据预测器。","why":"单一浅层模型偏差大，单棵深树又容易过拟合。","mechanism":"通过 Bagging、Boosting 或随机特征选择聚合多个互补模型。","changed":"让表格数据上的非线性预测兼具性能、可部署性与一定可解释性。","limits":"不能自然处理原始图像、语音和长文本，也不直接学习通用表征。","plainLanguage":"一棵决策树容易看偏，集成学习就让许多棵树或弱模型共同投票。它至今仍是表格数据中很实用的强基线。","evidence":[{"kind":"paper","year":2001,"title":"Random Forests","url":"https://link.springer.com/article/10.1023/A:1010933404324","note":"随机森林代表树模型与集成学习的经典主干。"}],"actors":[{"name":"Leo Breiman","role":"提出者","kind":"人物","url":"https://link.springer.com/article/10.1023/A:1010933404324","note":"把大量有随机差异的决策树进行投票，在不牺牲可训练性的前提下显著降低单棵树的方差。","sourceTitle":"Random Forests","year":2001}]},{"id":"problem-feature-engineering","label":"性能依赖人工特征与任务专用管线","en":"Feature Engineering Bottleneck","entityKind":"problem","status":"established","x":4840,"y":5350,"w":298,"h":76,"summary":"传统方法往往无法从原始感知数据端到端学出表示。","why":"传统方法往往无法从原始感知数据端到端学出表示。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-neural-networks","label":"Neural Networks / MLP","en":"Artificial Neural Networks & Multilayer Perceptrons","entityKind":"technical_route","status":"historical","x":5250,"y":5260,"w":253,"h":74,"summary":"由多层可微单元组成、能联合学习表示与预测的函数族。","why":"人工特征限制了模型从原始数据中发现复杂层级结构。","mechanism":"线性变换与非线性激活层层组合，以参数化函数逼近输入到输出的映射。","changed":"为端到端表征学习提供了统一、可扩展的模型形式。","limits":"浅层网络表达与样本效率有限；深层网络当时仍难稳定训练。","plainLanguage":"神经网络让机器自己组合许多层简单计算，逐步学出从输入到答案的映射。关键变化是：特征不必全由人设计，模型可以和任务一起学习。","evidence":[{"kind":"paper","year":1958,"title":"The Perceptron: A Probabilistic Model for Information Storage and Organization in the Brain","url":"https://pubmed.ncbi.nlm.nih.gov/13602029/","note":"Perceptron 是可从样本调整连接权重的早期连接主义原始工作，直接支撑人工神经网络传统。"},{"kind":"paper","year":1986,"title":"Learning representations by back-propagating errors","url":"https://doi.org/10.1038/323533a0","note":"反向传播训练多层神经网络并让隐藏单元形成任务相关表征的经典论文。"}],"actors":[{"name":"Frank Rosenblatt","role":"早期奠基","kind":"人物","url":"https://pubmed.ncbi.nlm.nih.gov/13602029/","note":"感知机首次把可学习权重、神经元式计算和分类任务连接成完整模型，是现代神经网络的重要源头。","sourceTitle":"The Perceptron","year":1958}]},{"id":"tech-backprop","label":"Backpropagation / 反向传播","en":"Backpropagation","entityKind":"enabler","status":"historical","x":5250,"y":5430,"w":300,"h":74,"summary":"高效计算多层可微模型中每个参数对误差的贡献。","why":"多层网络参数相互耦合，无法逐个手工调整。","mechanism":"利用链式法则把输出误差从后向前传播，与梯度优化配合更新参数。","changed":"使深层网络能够端到端训练，是现代深度学习的关键使能技术。","limits":"不能自行消除梯度消失、优化不稳或目标函数错误等问题。","plainLanguage":"多层网络里参数很多，没法靠人逐个试。反向传播会从最终错误倒着计算每一层该改多少，让整个网络可以一起训练。","evidence":[{"kind":"paper","year":1986,"title":"Learning representations by back-propagating errors","url":"https://doi.org/10.1038/323533a0","note":"反向传播训练多层神经网络并让隐藏单元形成任务相关表征的经典论文。"}],"actors":[{"name":"David Rumelhart, Geoffrey Hinton & Ronald Williams","role":"标志性提出","kind":"人物","url":"https://doi.org/10.1038/323533a0","note":"把输出误差沿计算图反向传回各层，使多层网络可以端到端学习内部表征。","sourceTitle":"Learning representations by back-propagating errors","year":1986}]},{"id":"cap-representation-learning","label":"可直接从原始数据学习表征","en":"Learn Representations Directly from Raw Data","entityKind":"capability_outcome","status":"established","x":5660,"y":5350,"w":298,"h":74,"summary":"模型不再只依赖人工特征，而能为任务形成自己的内部表示。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-shallow-scale","label":"浅层网络难以吸收数据与算力","en":"Shallow Learning Ceiling","entityKind":"problem","status":"established","x":6070,"y":5350,"w":298,"h":76,"summary":"优化、数据和计算条件尚不足以稳定训练深层网络。","why":"优化、数据和计算条件尚不足以稳定训练深层网络。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-deep-learning","label":"Deep Learning / 深度学习","en":"Deep Learning","entityKind":"technical_route","status":"established","x":6480,"y":5350,"w":281,"h":74,"summary":"以多层神经网络从原始数据中逐级学习表征。","why":"浅层模型与人工特征无法充分吸收不断增长的数据和算力。","mechanism":"结合深层网络、反向传播、大规模数据、加速计算与适当的优化正则技术。","changed":"视觉、语音与语言开始共享“数据 + 可微模型 + 规模化训练”的通用范式。","limits":"需要大量数据与算力，内部机制不透明，对分布变化仍脆弱。","plainLanguage":"浅层模型吃不下越来越多的数据和算力，深度学习就把网络堆成多层，让它逐级形成更复杂的表示。视觉、语音和语言因此开始共享同一套规模化训练思路。","evidence":[{"kind":"ACM","year":2019,"title":"Bengio, Hinton & LeCun — ACM A.M. Turing Award","url":"https://awards.acm.org/binaries/content/assets/press-releases/2019/march/turing-award-2018.pdf","note":"深度神经网络成为现代计算核心方法的权威概述。"},{"kind":"paper","year":2012,"title":"ImageNet Classification with Deep Convolutional Neural Networks","url":"https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html","note":"CNN、GPU 与大规模监督数据结合的标志性结果。"}],"actors":[{"name":"Yoshua Bengio, Geoffrey Hinton & Yann LeCun","role":"长期奠基","kind":"人物","url":"https://awards.acm.org/binaries/content/assets/press-releases/2019/march/turing-award-2018.pdf","note":"三条长期研究路线共同推动多层神经网络、表征学习和可训练深层架构成为现代 AI 主干。","sourceTitle":"2018 ACM A.M. Turing Award","year":2019}]},{"id":"cap-visual-understanding","label":"开放世界视觉理解","en":"Open-World Visual Understanding","entityKind":"composite_capability","status":"established","x":1550,"y":520,"w":211,"h":74,"summary":"从像素中识别对象、结构、关系和变化。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-visual-variance","label":"像素变化巨大，人工特征难覆盖","en":"Visual Variation","entityKind":"problem","status":"established","x":1960,"y":520,"w":298,"h":76,"summary":"视角、尺度、光照和形变使固定模板难以泛化。","why":"视角、尺度、光照和形变使固定模板难以泛化。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-cnn","label":"CNN / 卷积神经网络","en":"Convolutional Neural Networks","entityKind":"technical_route","status":"established","x":2380,"y":520,"w":227,"h":74,"summary":"用局部卷积与共享权重学习图像的空间层级特征。","why":"图像像素维度高、位置相关，普通全连接网络参数过多且缺少平移先验。","mechanism":"卷积核在整幅图上共享，并逐层扩大感受野，从边缘组合到对象结构。","changed":"视觉系统可以端到端学习稳定的层级表征，取代大部分手工视觉特征。","limits":"局部归纳偏置使全局关系需要很多层才能传递；类别通常仍依赖固定标签。","plainLanguage":"CNN 像拿同一个小窗口扫过整张图，先找边缘，再逐层组合成纹理和物体。它让视觉特征从人工设计变成了从像素中自动学习。","evidence":[{"kind":"paper","year":2012,"title":"ImageNet Classification with Deep Convolutional Neural Networks","url":"https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html","note":"CNN、GPU 与大规模监督数据结合的标志性结果。"}],"actors":[{"name":"Alex Krizhevsky, Ilya Sutskever & Geoffrey Hinton","role":"标志性推进","kind":"人物","url":"https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html","note":"AlexNet 把深层 CNN、GPU 和大规模监督数据组合成决定性的视觉结果。","sourceTitle":"ImageNet Classification with Deep Convolutional Neural Networks","year":2012}]},{"id":"cap-hierarchical-vision","label":"从像素自动学习视觉层级","en":"Learn Visual Hierarchies from Pixels","entityKind":"capability_outcome","status":"established","x":2790,"y":520,"w":276,"h":74,"summary":"模型从边缘、纹理逐层组合到对象级特征。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-depth-degradation","label":"网络越深，反而越难训练","en":"Depth Degradation","entityKind":"problem","status":"established","x":3200,"y":520,"w":276,"h":66,"summary":"简单堆叠层数会出现优化退化，训练误差也可能上升。","why":"简单堆叠层数会出现优化退化，训练误差也可能上升。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-resnet","label":"ResNet / 残差网络","en":"Residual Networks","entityKind":"technical_route","status":"established","x":3610,"y":520,"w":213,"h":74,"summary":"用残差连接让非常深的视觉网络更容易优化。","why":"普通网络继续加深时，训练误差反而上升，深度无法转化为能力。","mechanism":"每个模块学习相对输入的残差，并用跳连提供恒等信息与更短梯度路径。","changed":"百层级网络得以可靠训练，并催生可跨分类、检测、分割复用的视觉 backbone。","limits":"更深并不自动带来全局理解；卷积的局部结构与监督标签限制仍在。","plainLanguage":"网络不是越深越容易训练，层数太多反而会退化。ResNet 给信息加了“直通车”，让上百层网络也能稳定学起来，并成为大量视觉任务的通用底座。","evidence":[{"kind":"paper","year":2015,"title":"Deep Residual Learning for Image Recognition","url":"https://arxiv.org/abs/1512.03385","note":"残差连接缓解深层网络优化退化，并形成可迁移视觉骨干。"}],"actors":[{"name":"Microsoft Research Asia","role":"提出者","kind":"Frontier Lab","url":"https://arxiv.org/abs/1512.03385","note":"以残差连接解决网络加深后的优化退化，形成长期复用的视觉骨干。","sourceTitle":"Deep Residual Learning for Image Recognition","year":2015}]},{"id":"cap-very-deep-vision","label":"视觉 Backbone 可跨任务复用","en":"Reusable Visual Backbones","entityKind":"capability_outcome","status":"established","x":4020,"y":520,"w":300,"h":74,"summary":"深层视觉编码器成为分类、检测和分割等任务的共同底座。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-cnn-locality","label":"CNN 擅长局部，但全局关系建模较绕","en":"CNN Locality Ceiling","entityKind":"problem","status":"established","x":4430,"y":520,"w":297,"h":76,"summary":"卷积需要层层传递才能关联远距离区域，也难与其他模态共享同一骨干。","why":"卷积需要层层传递才能关联远距离区域，也难与其他模态共享同一骨干。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-vit","label":"Vision Transformer / ViT","en":"Vision Transformer","entityKind":"technical_route","status":"established","x":4840,"y":520,"w":282,"h":74,"summary":"把图像切成 patch token，直接用 Transformer 建模它们的关系。","why":"CNN 的局部先验便于小数据学习，却不利于统一架构和全局关系建模。","mechanism":"对图像 patch 做线性嵌入，再以全局自注意力完成视觉编码。","changed":"视觉能够复用语言模型的 Transformer 与规模化预训练路径。","limits":"高分辨率注意力成本高，通常需要大规模预训练或更强数据增广。","plainLanguage":"ViT 把图片切成一块块，像处理词语一样让各块直接互相查看。它让视觉也能沿用 Transformer 和大规模预训练的路线，但并不是 ResNet 的简单下一代。","evidence":[{"kind":"paper","year":2020,"title":"An Image is Worth 16x16 Words","url":"https://arxiv.org/abs/2010.11929","note":"将图像切成 patch 后直接用 Transformer 编码。"}],"actors":[{"name":"Google Research","role":"提出者","kind":"Frontier Lab","url":"https://arxiv.org/abs/2010.11929","note":"证明纯 Transformer 在足够数据规模下可以直接承担图像编码。","sourceTitle":"An Image is Worth 16x16 Words","year":2020}]},{"id":"cap-scalable-vision","label":"视觉可沿 Transformer 统一扩展","en":"Transformer-Scale Vision","entityKind":"capability_outcome","status":"established","x":5250,"y":520,"w":296,"h":76,"summary":"视觉建模可以共享 token、注意力与大规模预训练基础设施。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-fixed-visual-labels","label":"固定类别监督限制开放概念迁移","en":"Fixed Label Bottleneck","entityKind":"problem","status":"established","x":5660,"y":520,"w":298,"h":76,"summary":"封闭标签集无法覆盖真实世界中持续出现的新概念。","why":"封闭标签集无法覆盖真实世界中持续出现的新概念。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-language","label":"长上下文语言理解与生成","en":"Long-context Language Understanding & Generation","entityKind":"composite_capability","status":"established","x":1550,"y":1320,"w":276,"h":74,"summary":"在不断变长的上下文中保留、理解并生成有顺序的信息。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-sequence-state","label":"变长序列需要保留历史状态","en":"Variable-Length Sequence State","entityKind":"problem","status":"established","x":1960,"y":1320,"w":298,"h":66,"summary":"固定窗口无法表达任意长度输入和时序依赖。","why":"固定窗口无法表达任意长度输入和时序依赖。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-hidden-markov","label":"HMM / 隐马尔可夫模型","en":"Hidden Markov Models","entityKind":"technical_route","status":"historical","x":2170,"y":1450,"w":248,"h":74,"summary":"用隐藏状态与概率转移描述序列如何随时间演化。","why":"语音与文本的真实状态不可直接观察，但会产生可观测符号。","mechanism":"假设当前隐藏状态主要依赖前一状态，再用发射概率连接状态与观测。","changed":"建立了可训练、可解码的概率序列建模框架。","limits":"有限状态与局部依赖假设难表达长期、连续且语义丰富的历史。","plainLanguage":"我们看得到语音或文字，却看不到背后的真实状态。HMM 用一串看不见但会转移的状态来解释观测，是早期语音和序列建模的经典方法。","evidence":[{"kind":"paper","year":1989,"title":"A Tutorial on Hidden Markov Models and Selected Applications in Speech Recognition","url":"https://doi.org/10.1109/5.18626","note":"HMM 的概率潜状态传统及其在语音识别中的经典定位。"}],"actors":[{"name":"Lawrence Rabiner / Bell Labs","role":"系统化推进","kind":"人物与 Lab","url":"https://doi.org/10.1109/5.18626","note":"把 HMM 的前向后向算法、参数估计和语音识别用法系统化，成为概率序列建模的工程入口。","sourceTitle":"A Tutorial on Hidden Markov Models","year":1989}]},{"id":"problem-handcrafted-sequence-state","label":"有限状态与局部假设难表达复杂历史","en":"Handcrafted Sequence State","entityKind":"problem","status":"established","x":2580,"y":1450,"w":298,"h":76,"summary":"人工设定的有限状态和局部马尔可夫假设难以承载复杂连续上下文。","why":"人工设定的有限状态和局部马尔可夫假设难以承载复杂连续上下文。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-rnn","label":"RNN / 循环神经网络","en":"Recurrent Neural Networks","entityKind":"technical_route","status":"historical","x":2380,"y":1320,"w":227,"h":74,"summary":"用反复更新的隐藏状态处理任意长度序列。","why":"序列需要一种由数据学习的动态记忆，而非固定窗口。","mechanism":"同一神经单元逐步读取 token，并把历史压缩进连续隐藏状态。","changed":"形成了与概率状态模型并行的神经序列传统。","limits":"梯度难跨越很长时间，计算必须按时间步串行执行。","plainLanguage":"RNN 一边读当前内容，一边带着前面留下的“记忆”继续往后算。它能处理任意长度的序列，但必须一步接一步，长了也容易忘。","evidence":[{"kind":"paper","year":1990,"title":"Finding Structure in Time","url":"https://doi.org/10.1207/s15516709cog1402_1","note":"循环连接让神经网络以连续动态状态形成可学习记忆，是与 HMM 并行的序列传统。"}],"actors":[{"name":"Jeffrey Elman","role":"关键推进","kind":"人物","url":"https://doi.org/10.1207/s15516709cog1402_1","note":"用上下文单元保存上一时刻的隐藏状态，清楚展示循环网络怎样从序列中形成时间表征。","sourceTitle":"Finding Structure in Time","year":1990}]},{"id":"problem-long-lag","label":"梯度难跨越长期依赖","en":"Long Time-Lag Problem","entityKind":"problem","status":"established","x":2790,"y":1320,"w":233,"h":66,"summary":"普通循环网络在长序列上容易遗忘并产生梯度消失。","why":"普通循环网络在长序列上容易遗忘并产生梯度消失。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-lstm","label":"LSTM / 长短期记忆网络","en":"Long Short-Term Memory","entityKind":"technical_route","status":"historical","x":3200,"y":1320,"w":261,"h":74,"summary":"以门控记忆单元选择保留、写入或遗忘序列信息。","why":"普通 RNN 在长序列上容易梯度消失，早期信息难以保留。","mechanism":"独立的 cell state 与输入、遗忘、输出门控制信息流。","changed":"显著改善长期依赖学习，长期成为语音、翻译与时间序列主干。","limits":"仍然串行；所有历史最终挤进固定宽度状态，超长依赖依然困难。","plainLanguage":"普通 RNN 很快忘掉很早的信息，LSTM 给记忆加上了写入、保留和删除的门。它让机器更能处理长句和长期变化，但仍然需要按顺序计算。","evidence":[{"kind":"paper","year":1997,"title":"Long Short-Term Memory","url":"https://direct.mit.edu/neco/article/9/8/1735/6109/Long-Short-Term-Memory","note":"LSTM 针对循环网络长期梯度问题引入门控记忆。"}],"actors":[{"name":"Sepp Hochreiter & Jürgen Schmidhuber","role":"提出者","kind":"人物","url":"https://direct.mit.edu/neco/article/9/8/1735/6109/Long-Short-Term-Memory","note":"通过记忆单元和门控路径缓解长期依赖中的梯度消失，让循环网络能选择保留或遗忘信息。","sourceTitle":"Long Short-Term Memory","year":1997}]},{"id":"problem-variable-transduction","label":"输入输出长度不同且需整体映射","en":"Sequence Transduction","entityKind":"problem","status":"established","x":3610,"y":1320,"w":298,"h":76,"summary":"机器翻译等任务需要把一个变长序列映射为另一个序列。","why":"机器翻译等任务需要把一个变长序列映射为另一个序列。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-seq2seq","label":"Seq2Seq / Encoder–Decoder","en":"Sequence-to-Sequence Encoder–Decoder","entityKind":"technical_route","status":"historical","x":4020,"y":1320,"w":235,"h":76,"summary":"用编码器读取输入序列，再由解码器生成可变长度输出。","why":"翻译等任务的输入与输出长度不同，逐位置分类无法表达整体映射。","mechanism":"编码器形成输入表示，条件解码器逐步产生目标序列。","changed":"把翻译、摘要、问答统一为条件序列生成。","limits":"把整个输入压成单一向量时，长句信息会形成明显瓶颈。","plainLanguage":"翻译不是逐词替换，输入和输出长度也常不同。Seq2Seq 先读完整个输入，再一步步生成另一段序列，把翻译、摘要和问答统一成同一种任务形式。","evidence":[{"kind":"paper","year":2014,"title":"Sequence to Sequence Learning with Neural Networks","url":"https://arxiv.org/abs/1409.3215","note":"用编码器与解码器端到端映射可变长度序列。"}],"actors":[{"name":"Google Brain / Ilya Sutskever, Oriol Vinyals & Quoc Le","role":"提出者","kind":"Frontier Lab","url":"https://arxiv.org/abs/1409.3215","note":"用编码器把输入序列压成状态，再由解码器逐步生成输出，建立通用的序列到序列学习范式。","sourceTitle":"Sequence to Sequence Learning with Neural Networks","year":2014}]},{"id":"problem-fixed-context","label":"单一上下文向量成为信息瓶颈","en":"Fixed-Context Bottleneck","entityKind":"problem","status":"established","x":4430,"y":1320,"w":298,"h":76,"summary":"长输入被压缩到单一向量后信息损失严重。","why":"长输入被压缩到单一向量后信息损失严重。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-attention","label":"Attention / 注意力机制","en":"Attention","entityKind":"technical_route","status":"established","x":4840,"y":1320,"w":264,"h":74,"summary":"让模型在每一步按内容直接读取最相关的上下文位置。","why":"固定长度上下文向量无法无损承载长输入。","mechanism":"以 query 与 key 的匹配得到权重，再加权汇总 value。","changed":"上下文从“固定压缩包”变为可按需访问的外部记忆。","limits":"与 RNN 结合时仍有串行瓶颈；全局注意力的计算随序列平方增长。","plainLanguage":"以前模型要把整段输入挤进一个固定大小的记忆里。Attention 让它在生成每一步时回头查找最相关的位置，像随用随查的上下文索引。","evidence":[{"kind":"paper","year":2014,"title":"Neural Machine Translation by Jointly Learning to Align and Translate","url":"https://arxiv.org/abs/1409.0473","note":"指出固定长度编码向量是瓶颈，并让解码器按需检索输入位置。"}],"actors":[{"name":"Dzmitry Bahdanau, Kyunghyun Cho & Yoshua Bengio","role":"提出者","kind":"人物","url":"https://arxiv.org/abs/1409.0473","note":"让解码器按内容动态读取输入位置，突破固定上下文向量瓶颈。","sourceTitle":"Neural Machine Translation by Jointly Learning to Align and Translate","year":2014}]},{"id":"cap-flexible-context","label":"生成时可按内容查找上下文","en":"Content-Addressable Context","entityKind":"capability_outcome","status":"established","x":5250,"y":1320,"w":298,"h":74,"summary":"模型无需把全部输入压进单一向量，而能直接读取相关位置。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-serial-recurrence","label":"循环计算难并行，长距离路径过长","en":"Serial Recurrence Bottleneck","entityKind":"problem","status":"established","x":5660,"y":1320,"w":298,"h":76,"summary":"逐 token 循环限制训练吞吐并拉长依赖传播路径。","why":"逐 token 循环限制训练吞吐并拉长依赖传播路径。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-transformer","label":"Transformer","en":"Transformer","entityKind":"technical_route","status":"established","x":6070,"y":1320,"w":174,"h":74,"summary":"完全依靠自注意力与前馈层进行通用序列建模。","why":"循环网络难以并行，远距离信息要经过很长计算路径。","mechanism":"多头自注意力直接连接任意 token，位置编码保留顺序，所有位置可并行训练。","changed":"形成语言、多模态与生成模型共享的可规模化骨干。","limits":"标准注意力对长上下文成本高，结构本身也不保证真实、推理或持续记忆。","plainLanguage":"以前的序列模型要一个位置接一个位置往后算，训练慢，远处的信息也难相连。Transformer 让不同位置直接互相查看并同时训练，因此成了语言、多模态和生成模型的共同骨架。","evidence":[{"kind":"paper","year":2017,"title":"Attention Is All You Need","url":"https://arxiv.org/abs/1706.03762","note":"以注意力取代循环与卷积，实现并行序列建模。"}],"actors":[{"name":"Google Brain / Google Research","role":"提出者","kind":"Frontier Lab","url":"https://arxiv.org/abs/1706.03762","note":"以自注意力替代循环和卷积，建立可并行扩展的通用序列骨架。","sourceTitle":"Attention Is All You Need","year":2017}]},{"id":"cap-parallel-sequence","label":"序列可并行训练并建模远距离关系","en":"Parallel Long-Range Sequence Modeling","entityKind":"capability_outcome","status":"established","x":6480,"y":1320,"w":298,"h":76,"summary":"任意 token 能建立短路径联系，训练不再被时间步串行锁住。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-transferable-representation","label":"跨任务可迁移的表征","en":"Transferable Representations","entityKind":"composite_capability","status":"established","x":1550,"y":920,"w":233,"h":74,"summary":"从大规模数据获得不依赖单一标签体系的通用表示。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-relational-data","label":"关系数据不是规则网格或单一序列","en":"Relational & Graph-Structured Data","entityKind":"problem","status":"established","x":1960,"y":1110,"w":298,"h":76,"summary":"分子、知识图谱和社会网络需要显式表达可变实体与关系。","why":"分子、知识图谱和社会网络需要显式表达可变实体与关系。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-gnn","label":"GNN / 图神经网络","en":"Graph Neural Networks","entityKind":"technical_route","status":"established","x":2380,"y":1110,"w":205,"h":74,"summary":"让节点沿图的边交换信息，从关系结构中学习表示。","why":"社交、分子和知识图谱不是规则网格，也不是单一序列。","mechanism":"反复聚合邻居消息并更新节点、边或整图表示。","changed":"深度学习从欧氏网格扩展到关系型数据。","limits":"深层消息传递可能过平滑；长距离关系、动态图与因果解释仍困难。","plainLanguage":"分子、社交网络和知识图谱的重点是“谁和谁相连”。GNN 让相邻节点交换信息，从关系结构本身学习，而不是硬把它们塞进表格或一条序列。","evidence":[{"kind":"paper","year":2017,"title":"Semi-Supervised Classification with Graph Convolutional Networks","url":"https://arxiv.org/abs/1609.02907","note":"将局部消息聚合扩展到图结构数据。"}],"actors":[{"name":"Thomas Kipf & Max Welling","role":"标志性推进","kind":"人物","url":"https://arxiv.org/abs/1609.02907","note":"把局部邻居聚合写成可端到端训练的图卷积层，使关系结构可以直接进入神经网络。","sourceTitle":"Semi-Supervised Classification with Graph Convolutional Networks","year":2016}]},{"id":"cap-relational-representation","label":"从图结构中学习实体关系","en":"Learn from Graph-Structured Relations","entityKind":"capability_outcome","status":"established","x":2790,"y":1110,"w":276,"h":74,"summary":"模型能够利用谁与谁相连，而不必把关系压成表格或序列。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-sparse-symbols","label":"离散符号缺乏连续相似结构","en":"Sparse Symbol Representation","entityKind":"problem","status":"established","x":1960,"y":920,"w":298,"h":66,"summary":"one-hot 表示无法自然表达语义相似性与组合规律。","why":"one-hot 表示无法自然表达语义相似性与组合规律。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-embeddings","label":"Embedding / 分布式表征","en":"Distributed Representations & Embeddings","entityKind":"technical_route","status":"historical","x":2380,"y":920,"w":264,"h":74,"summary":"把离散符号映射为可学习的连续向量。","why":"one-hot 符号彼此正交，无法表达“猫”与“狗”比“猫”与“利率”更相近。","mechanism":"根据共现或任务信号调整向量，使相似概念在几何空间中靠近。","changed":"语义相似、类比与迁移可以通过向量运算被下游模型复用。","limits":"单一静态向量难处理一词多义、组合结构与真实世界指称。","plainLanguage":"机器原本只把每个词当成互不相关的编号。Embedding 把它们放进一个可学习的空间，让“猫”和“狗”自然比“猫”和“利率”更接近。","evidence":[{"kind":"paper","year":2013,"title":"Efficient Estimation of Word Representations in Vector Space","url":"https://arxiv.org/abs/1301.3781","note":"展示大规模数据中可高效学习连续词向量与语义结构。"}],"actors":[{"name":"Google / Tomas Mikolov 团队","role":"标志性推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/1301.3781","note":"用预测上下文的轻量目标在海量文本上学习词向量，让语义关系首次以可计算几何结构大规模出现。","sourceTitle":"Efficient Estimation of Word Representations in Vector Space","year":2013}]},{"id":"problem-label-dependence","label":"监督标签昂贵且任务割裂","en":"Label Dependence","entityKind":"problem","status":"established","x":2790,"y":920,"w":276,"h":66,"summary":"每个任务单独标注和训练，知识难以共享。","why":"每个任务单独标注和训练，知识难以共享。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-self-supervised","label":"Self-Supervised Learning / 自监督学习","en":"Self-Supervised Learning","entityKind":"technical_route","status":"established","x":3200,"y":920,"w":300,"h":76,"summary":"从数据自身构造训练信号，先学通用表征再适配任务。","why":"高质量人工标签昂贵，且每套标签只服务少数任务。","mechanism":"遮盖、预测未来、重建或对比不同视图，迫使模型提取稳定结构。","changed":"海量无标签文本、图像与音频成为可用训练资源。","limits":"预训练目标只是代理任务，学到的相关性不一定支持行动、因果或可靠推理。","plainLanguage":"人工标签贵，而且一套标签通常只服务一个任务。自监督学习从数据本身出题，例如遮住一部分再让模型猜回来，从而先学通用能力、以后再适配任务。","evidence":[{"kind":"paper","year":2018,"title":"Representation Learning with Contrastive Predictive Coding","url":"https://arxiv.org/abs/1807.03748","note":"CPC 通过预测未来潜表示并使用对比目标，从无标签序列学习可迁移表征。"},{"kind":"paper","year":2018,"title":"BERT: Pre-training of Deep Bidirectional Transformers","url":"https://arxiv.org/abs/1810.04805","note":"掩码目标学习双向上下文表征。"},{"kind":"paper","year":2020,"title":"A Simple Framework for Contrastive Learning of Visual Representations","url":"https://proceedings.mlr.press/v119/chen20j.html","note":"SimCLR 直接支撑对比自监督学习的核心机制与视觉表征价值。"}],"actors":[{"name":"DeepMind","role":"关键推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/1807.03748","note":"CPC 用预测未来潜表示构造自监督信号，说明模型可以从原始序列本身获得跨模态表征。","sourceTitle":"Representation Learning with Contrastive Predictive Coding","year":2018},{"name":"Google Research","role":"规模化实践","kind":"Frontier Lab","url":"https://proceedings.mlr.press/v119/chen20j.html","note":"SimCLR 系统展示数据增强、对比目标与大批量训练如何让无标签视觉表征逼近监督学习。","sourceTitle":"A Simple Framework for Contrastive Learning of Visual Representations","year":2020}]},{"id":"tech-masked-modeling","label":"BERT 路线 / Masked Modeling","en":"Masked Modeling","entityKind":"technical_route","status":"established","x":3610,"y":830,"w":223,"h":76,"summary":"遮住输入的一部分，并利用双向上下文恢复它。","why":"单向语言建模难以同时利用目标词左右两侧的信息。","mechanism":"随机 mask token 或图像 patch，再预测被遮盖内容或其表征。","changed":"形成适合分类、抽取与理解任务的双向预训练表示。","limits":"预训练时看见 mask 而下游没有；它也不天然适合开放式逐步生成。","plainLanguage":"BERT 路线像做完形填空：遮住一句话或一张图的一部分，再结合前后内容把它补回来。这样学到的表示很适合理解、分类和抽取任务。","evidence":[{"kind":"paper","year":2018,"title":"BERT: Pre-training of Deep Bidirectional Transformers","url":"https://arxiv.org/abs/1810.04805","note":"掩码目标学习双向上下文表征。"}],"actors":[{"name":"Google Research","role":"提出与规模化","kind":"Frontier Lab","url":"https://arxiv.org/abs/1810.04805","note":"BERT 通过遮住部分 token 并恢复它们，让双向 Transformer 在未标注文本上预训练通用语言表征。","sourceTitle":"BERT","year":2018}]},{"id":"tech-autoregressive-pretraining","label":"GPT 路线 / Autoregressive Pretraining","en":"Autoregressive Pretraining","entityKind":"technical_route","status":"established","x":3610,"y":1010,"w":294,"h":76,"summary":"通过不断预测下一个 token 学习语言分布与生成能力。","why":"需要一个能在无标签文本上规模化、且与生成任务一致的统一目标。","mechanism":"按因果顺序分解序列概率，利用前缀预测下一 token。","changed":"同一模型可通过提示完成续写、问答和多任务迁移。","limits":"逐 token 生成串行且可能累积错误；预测流畅文本不等于事实正确。","plainLanguage":"GPT 路线用一个极简单但可无限扩展的任务训练：根据前文预测下一个信息片段。做得足够大后，同一个模型可以续写、问答，并通过提示适配很多任务。","evidence":[{"kind":"paper","year":2018,"title":"Improving Language Understanding by Generative Pre-Training","url":"https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf","note":"GPT-1 直接确立 Transformer 自回归语言模型预训练、再迁移到多任务的路线。"}],"actors":[{"name":"OpenAI","role":"标志性推进","kind":"Frontier Lab","url":"https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf","note":"GPT 把大规模下一词预测与下游任务微调连接起来，确立自回归预训练可以成为通用能力底座。","sourceTitle":"Improving Language Understanding by Generative Pre-Training","year":2018}]},{"id":"cap-foundation-representation","label":"一次预训练，可迁移到多种任务","en":"Pretrain Once, Adapt Broadly","entityKind":"capability_outcome","status":"established","x":4020,"y":920,"w":298,"h":76,"summary":"同一底座表征可以通过提示、微调或轻量适配服务不同任务。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-modality-silos","label":"语言、视觉与声音表征彼此割裂","en":"Modality Silos","entityKind":"problem","status":"established","x":4430,"y":920,"w":298,"h":76,"summary":"单模态模型难以借助语言开放词汇和跨模态知识。","why":"单模态模型难以借助语言开放词汇和跨模态知识。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-contrastive-learning","label":"Contrastive Learning / 对比学习","en":"Contrastive Learning","entityKind":"technical_route","status":"established","x":4840,"y":830,"w":289,"h":76,"summary":"通过拉近正样本、推远负样本学习不依赖标签的表征。","why":"重建每个像素或词可能把容量花在无关细节，人工类别又太窄。","mechanism":"构造同一对象的不同视图或匹配跨模态样本，以相对相似度训练编码器。","changed":"表征能够对数据增强保持不变，并支持少样本迁移与跨模态检索。","limits":"效果高度依赖正负样本定义；相似性空间可能忽略细粒度结构和因果差异。","plainLanguage":"对比学习不要求模型还原所有细节，而是教它判断“哪些其实是同一个东西，哪些不是”。这样得到的表示更容易迁移，也能连接图像和语言。","evidence":[{"kind":"paper","year":2020,"title":"A Simple Framework for Contrastive Learning of Visual Representations","url":"https://proceedings.mlr.press/v119/chen20j.html","note":"SimCLR 直接支撑对比自监督学习的核心机制与视觉表征价值。"}],"actors":[{"name":"Google Research","role":"标志性推进","kind":"Frontier Lab","url":"https://proceedings.mlr.press/v119/chen20j.html","note":"SimCLR 把同一图像的不同增强视作正样本、其他图像视作负样本，形成清晰可复用的视觉对比学习配方。","sourceTitle":"A Simple Framework for Contrastive Learning of Visual Representations","year":2020}]},{"id":"tech-clip","label":"CLIP / 视觉—语言对比预训练","en":"Contrastive Language–Image Pretraining","entityKind":"technical_route","status":"established","x":4840,"y":1010,"w":300,"h":76,"summary":"用海量图文对学习共享语义空间，而非只学习固定视觉类别。","why":"人工标注类别封闭且昂贵，无法覆盖开放世界不断出现的概念。","mechanism":"拉近匹配图文的向量、推远不匹配样本，并以文本提示充当动态分类器。","changed":"视觉模型获得零样本分类、开放词汇识别与跨模态检索能力。","limits":"图文共现不等于细粒度视觉理解；数据偏见与空间关系缺失仍明显。","plainLanguage":"CLIP 用大量图片和文字说明学习“这张图和这句话是否匹配”。于是新的视觉类别可以直接用语言描述，不必每次重新收集固定标签。","evidence":[{"kind":"paper","year":2021,"title":"Learning Transferable Visual Models From Natural Language Supervision","url":"https://arxiv.org/abs/2103.00020","note":"用图文对比预训练获得开放词汇视觉迁移。"}],"actors":[{"name":"OpenAI","role":"提出者","kind":"Frontier Lab","url":"https://arxiv.org/abs/2103.00020","note":"用海量图文对学习开放词汇视觉表征，让语言成为视觉接口。","sourceTitle":"Learning Transferable Visual Models From Natural Language Supervision","year":2021}]},{"id":"cap-open-vocabulary","label":"识别训练标签之外的开放概念","en":"Open-Vocabulary Recognition","entityKind":"capability_outcome","status":"established","x":5250,"y":920,"w":298,"h":76,"summary":"借助语言语义，视觉系统能处理未被固定类别表覆盖的概念。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-multimodal-foundation","label":"VLM / 多模态基础模型","en":"Vision-Language & Multimodal Foundation Models","entityKind":"technical_route","status":"established","x":5660,"y":920,"w":248,"h":74,"summary":"在统一模型中连接语言、图像、音频等多种模态。","why":"各模态独立训练会形成语义孤岛，知识与能力不能自然共享。","mechanism":"用共享 token 空间、跨注意力、对齐损失或联合生成目标融合多模态表示。","changed":"模型可以围绕同一概念进行看、听、读、生成与问答。","limits":"对齐常停留在共现层面，空间关系、物理因果与行动反馈仍不足。","plainLanguage":"过去看图、听声音和读文字往往由不同模型完成。多模态基础模型把它们接进同一个语义和生成接口，让模型能围绕同一件事看、听、读和回答。","evidence":[{"kind":"report","year":2021,"title":"On the Opportunities and Risks of Foundation Models","url":"https://arxiv.org/abs/2108.07258","note":"定义大规模预训练、跨任务适配的基础模型范式及其系统性风险。"},{"kind":"paper","year":2022,"title":"Flamingo: a Visual Language Model for Few-Shot Learning","url":"https://deepmind.google/research/publications/flamingo-a-visual-language-model-for-few-shot-learning/","note":"Flamingo 直接展示预训练视觉编码器与大型语言模型融合为多任务 VLM 的范式。"}],"actors":[{"name":"Google DeepMind","role":"规模化推进","kind":"Frontier Lab","url":"https://deepmind.google/research/publications/flamingo-a-visual-language-model-for-few-shot-learning/","note":"Flamingo 用视觉编码器和跨注意力把预训练语言模型接到图像与视频上，展示少样本多模态学习能力。","sourceTitle":"Flamingo","year":2022}]},{"id":"problem-passive-multimodal","label":"多模态理解仍以被动观察为主","en":"Passive Multimodal Understanding","entityKind":"problem","status":"established","x":6070,"y":920,"w":298,"h":76,"summary":"识别和描述世界不等于理解行动会怎样改变世界。","why":"识别和描述世界不等于理解行动会怎样改变世界。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-generative-modeling","label":"复杂数据分布的学习与生成","en":"Generative Modeling","entityKind":"composite_capability","status":"established","x":1550,"y":1720,"w":298,"h":74,"summary":"学习复杂数据的整体规律，并生成图像、声音、文本、视频和结构化对象的新样本。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-density-modeling","label":"高维分布难以显式建模和采样","en":"High-Dimensional Density Modeling","entityKind":"problem","status":"established","x":1960,"y":1720,"w":298,"h":76,"summary":"真实数据具有多峰、强相关和高维结构。","why":"真实数据具有多峰、强相关和高维结构。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-autoregressive-generation","label":"Autoregressive Generation / 自回归生成","en":"Autoregressive Generation","entityKind":"technical_route","status":"established","x":2380,"y":1530,"w":298,"h":76,"summary":"把复杂分布拆成按顺序预测下一个元素的条件概率。","why":"直接描述高维联合分布很困难，而条件概率可以用神经网络学习。","mechanism":"按既定顺序逐 token 或逐像素采样，每一步以此前输出为条件。","changed":"提供稳定似然训练，并成为现代语言生成的主干。","limits":"采样无法完全并行，顺序偏置与早期错误会影响后续输出。","plainLanguage":"复杂内容很难一次整体生成，自回归方法就把任务拆成“接下来是什么”，逐步往后写。它训练稳定、适用面广，但生成过程不能完全并行，早期错误也会一路影响后面。","evidence":[{"kind":"paper","year":2016,"title":"Pixel Recurrent Neural Networks","url":"https://proceedings.mlr.press/v48/oord16.html","note":"PixelRNN 明确按条件概率逐像素分解图像分布，是神经自回归生成跨模态主干的直接证据。"},{"kind":"paper","year":2018,"title":"Improving Language Understanding by Generative Pre-Training","url":"https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf","note":"GPT-1 直接确立 Transformer 自回归语言模型预训练、再迁移到多任务的路线。"}],"actors":[{"name":"DeepMind","role":"视觉生成推进","kind":"Frontier Lab","url":"https://proceedings.mlr.press/v48/oord16.html","note":"PixelRNN 把图像像素按条件概率逐个生成，验证自回归分解不仅适用于语言，也能精确建模图像。","sourceTitle":"Pixel Recurrent Neural Networks","year":2016}]},{"id":"tech-vae","label":"VAE / 变分自编码器","en":"Variational Autoencoder","entityKind":"technical_route","status":"established","x":2380,"y":1660,"w":227,"h":74,"summary":"在连续潜空间中学习可采样的数据生成模型。","why":"复杂潜变量模型的后验通常不可直接计算。","mechanism":"编码器近似后验，解码器生成数据，并用重参数化同时优化重建与先验约束。","changed":"让潜空间插值、压缩表示与有原则的生成训练成为可能。","limits":"简单似然假设常导致样本模糊，潜变量也可能被强解码器忽略。","plainLanguage":"VAE 先把复杂数据压缩到一个连续的内部空间，再从那里采样并还原。它让插值和可控生成更有原则，但早期结果常比 GAN 更模糊。","evidence":[{"kind":"paper","year":2013,"title":"Auto-Encoding Variational Bayes","url":"https://arxiv.org/abs/1312.6114","note":"以变分推断学习连续潜变量生成模型。"}],"actors":[{"name":"Diederik Kingma & Max Welling","role":"提出者","kind":"人物","url":"https://arxiv.org/abs/1312.6114","note":"把潜变量模型的推断网络与生成网络联合训练，并用重参数化技巧让随机潜变量可以反向传播。","sourceTitle":"Auto-Encoding Variational Bayes","year":2013}]},{"id":"tech-gan","label":"GAN / 生成对抗网络","en":"Generative Adversarial Network","entityKind":"technical_route","status":"established","x":2380,"y":1790,"w":227,"h":74,"summary":"让生成器与判别器对抗，从而直接学习逼真样本。","why":"显式似然往往难写或导致保守、模糊的生成结果。","mechanism":"判别器学习区分真伪，生成器学习欺骗判别器，二者交替优化。","changed":"显著提升图像生成锐度，并推动无显式似然的隐式生成。","limits":"训练可能不稳定、模式坍塌，覆盖度与评估也难保证。","plainLanguage":"GAN 让一个模型负责造假，另一个负责辨真假，双方在对抗中一起进步。它曾显著提高图像锐度，但训练容易失衡，也可能只会生成少数几类样本。","evidence":[{"kind":"paper","year":2014,"title":"Generative Adversarial Nets","url":"https://proceedings.neurips.cc/paper_files/paper/2014/hash/f033ed80deb0234979a61f95710dbe25-Abstract.html","note":"生成器与判别器通过对抗训练学习数据分布。"}],"actors":[{"name":"Ian Goodfellow 等","role":"提出者","kind":"人物","url":"https://proceedings.neurips.cc/paper_files/paper/2014/hash/f033ed80deb0234979a61f95710dbe25-Abstract.html","note":"以生成器和判别器的对抗训练学习数据分布。","sourceTitle":"Generative Adversarial Nets","year":2014}]},{"id":"tech-normalizing-flows","label":"Normalizing Flows / 归一化流","en":"Normalizing Flows","entityKind":"technical_route","status":"established","x":2380,"y":1920,"w":300,"h":76,"summary":"用一串可逆变换把简单分布映射为复杂分布。","why":"生成模型希望兼得精确似然、可逆推断与高质量采样。","mechanism":"通过变量替换公式跟踪概率密度，正反方向都可精确计算。","changed":"在密度估计与可逆表示上提供了严格、统一的框架。","limits":"可逆结构限制网络设计，雅可比计算与高维扩展成本较高。","plainLanguage":"归一化流用一连串可逆步骤，把简单随机数逐步变成复杂数据。正着能生成、倒着能计算概率，代价是可逆结构对模型设计限制较多。","evidence":[{"kind":"paper","year":2015,"title":"Variational Inference with Normalizing Flows","url":"https://proceedings.mlr.press/v37/rezende15.html","note":"以一系列可逆变换把简单分布变为复杂分布，是现代 Normalizing Flow 的经典来源。"}],"actors":[{"name":"Danilo Rezende & Shakir Mohamed / DeepMind","role":"关键推进","kind":"人物与 Lab","url":"https://proceedings.mlr.press/v37/rezende15.html","note":"用一串可逆变换把简单分布逐步变成复杂分布，同时保留精确密度计算。","sourceTitle":"Variational Inference with Normalizing Flows","year":2015}]},{"id":"cap-neural-generation","label":"可从数据学习如何生成","en":"Learn to Generate from Data","entityKind":"capability_outcome","status":"established","x":2790,"y":1720,"w":254,"h":74,"summary":"模型不再依赖手写生成规则，而能学习复杂数据分布。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-generative-tradeoff","label":"质量、覆盖、稳定性与可控性难兼得","en":"Generative Modeling Trade-offs","entityKind":"problem","status":"established","x":3200,"y":1720,"w":298,"h":76,"summary":"GAN 易不稳定和模式坍塌，VAE 偏模糊，自回归生成串行。","why":"GAN 易不稳定和模式坍塌，VAE 偏模糊，自回归生成串行。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-diffusion","label":"Diffusion Models / 扩散模型","en":"Diffusion & Score-Based Models","entityKind":"technical_route","status":"established","x":3610,"y":1720,"w":290,"h":76,"summary":"学习把逐步加入噪声的过程反转，从噪声恢复数据。","why":"GAN 难训练且容易漏掉分布模式，需要更稳定、覆盖更好的生成目标。","mechanism":"训练去噪器或 score function，并通过多步反向随机过程采样。","changed":"把稳定训练、高保真与灵活条件控制结合起来，成为图像生成主干。","limits":"像素空间训练昂贵，采样通常需要多步，生成也不自动具备世界理解。","plainLanguage":"扩散模型先把数据逐步加噪，再学习怎样一步步把噪声还原成内容。它比 GAN 更容易稳定训练、也更好控制，但通常要反复去噪，生成较慢。","evidence":[{"kind":"paper","year":2020,"title":"Denoising Diffusion Probabilistic Models","url":"https://proceedings.neurips.cc/paper/2020/hash/4c5bcfec8584af0d967f1ab10179ca4b-Abstract.html","note":"以逐步去噪实现高质量生成。"}],"actors":[{"name":"Jonathan Ho, Ajay Jain & Pieter Abbeel","role":"标志性推进","kind":"人物","url":"https://proceedings.neurips.cc/paper/2020/hash/4c5bcfec8584af0d967f1ab10179ca4b-Abstract.html","note":"DDPM 让逐步去噪成为稳定、高质量的现代生成主干。","sourceTitle":"Denoising Diffusion Probabilistic Models","year":2020}]},{"id":"cap-high-fidelity-generation","label":"可生成高质量且受条件控制的内容","en":"High-Fidelity Controllable Generation","entityKind":"capability_outcome","status":"established","x":4020,"y":1720,"w":298,"h":76,"summary":"文本、类别或参考输入可以稳定引导高保真生成。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-pixel-diffusion-cost","label":"像素空间训练与多步采样昂贵","en":"Pixel-Space Diffusion Cost","entityKind":"problem","status":"established","x":4430,"y":1720,"w":298,"h":76,"summary":"高分辨率生成需要大量计算并造成高延迟。","why":"高分辨率生成需要大量计算并造成高延迟。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-latent-diffusion","label":"Latent Diffusion / 潜空间扩散","en":"Latent Diffusion","entityKind":"technical_route","status":"established","x":4840,"y":1600,"w":290,"h":76,"summary":"先压缩图像，再在低维 latent 中执行扩散。","why":"直接在高分辨率像素上去噪把大量算力花在感知上不重要的细节。","mechanism":"用自编码器获得感知压缩空间，扩散模型只建模 latent，最后再解码。","changed":"大幅降低高分辨率文生图的训练与推理成本。","limits":"压缩器会丢失细节并引入伪影，多步采样成本仍然存在。","plainLanguage":"直接在高清像素上反复去噪太贵，潜空间扩散就先把图像压缩，再在较小的内部空间里生成。它让高质量文生图的成本大幅下降。","evidence":[{"kind":"paper","year":2022,"title":"High-Resolution Image Synthesis with Latent Diffusion Models","url":"https://arxiv.org/abs/2112.10752","note":"把扩散移到压缩潜空间，显著降低高分辨率生成成本。"}],"actors":[{"name":"CompVis / LMU Munich","role":"提出者","kind":"Lab","url":"https://arxiv.org/abs/2112.10752","note":"把扩散过程移到压缩潜空间，显著降低高分辨率生成成本。","sourceTitle":"High-Resolution Image Synthesis with Latent Diffusion Models","year":2022}]},{"id":"tech-dit","label":"DiT / Diffusion Transformer","en":"Diffusion Transformer","entityKind":"technical_route","status":"established","x":4840,"y":1740,"w":191,"h":76,"summary":"用 Transformer 作为 latent diffusion 的去噪骨干。","why":"U-Net 的卷积结构与语言大模型的规模化基础设施并不统一。","mechanism":"把 latent 切成 patch token，按时间步和条件信息用 Transformer 预测去噪方向。","changed":"扩散生成获得清晰的深度、宽度与计算规模化路径。","limits":"注意力成本高，模型扩大仍依赖海量高质量数据和采样加速。","plainLanguage":"DiT 把扩散模型里的图像处理骨干换成 Transformer。这样生成模型也能更直接复用大模型的扩展方式和训练基础设施。","evidence":[{"kind":"paper","year":2023,"title":"Scalable Diffusion Models with Transformers","url":"https://arxiv.org/abs/2212.09748","note":"以 Transformer 取代 U-Net，并展示扩散模型的规模化规律。"}],"actors":[{"name":"William Peebles & Saining Xie","role":"提出者","kind":"人物","url":"https://arxiv.org/abs/2212.09748","note":"用 Transformer 替换扩散模型常用的 U-Net 主干，并证明增加模型计算规模能稳定改善生成质量。","sourceTitle":"Scalable Diffusion Models with Transformers","year":2022}]},{"id":"tech-flow-matching","label":"Flow Matching / 流匹配","en":"Flow Matching","entityKind":"technical_route","status":"frontier","x":4840,"y":1880,"w":259,"h":74,"summary":"学习一条把噪声连续运输到数据的确定性速度场。","why":"扩散过程的随机路径与多步数值求解可能增加训练或采样负担。","mechanism":"预先选择概率路径，直接回归路径上每一点的条件速度向量场。","changed":"统一多类连续生成路径，并可用常微分方程高效采样。","limits":"性能依赖路径与求解器设计；少步、高维和离散数据仍有权衡。","plainLanguage":"扩散像沿一条曲折路线多次去噪，流匹配则直接学习数据从噪声移动到成品时应该往哪个方向走。它提供了更统一、可能更少步的连续生成路线。","evidence":[{"kind":"paper","year":2023,"title":"Flow Matching for Generative Modeling","url":"https://arxiv.org/abs/2210.02747","note":"直接回归概率路径的速度场，统一连续归一化流训练。"}],"actors":[{"name":"Meta AI & Weizmann Institute","role":"提出者","kind":"Frontier Lab","url":"https://arxiv.org/abs/2210.02747","note":"以速度场直接连接简单分布与数据分布，形成更统一的连续生成训练方法。","sourceTitle":"Flow Matching for Generative Modeling","year":2023},{"name":"Physical Intelligence","role":"机器人实践","kind":"Neo Lab","url":"https://www.physicalintelligence.company/download/pi0.pdf","note":"π0 用 flow matching 生成连续动作块，说明该机制也能落到灵巧机器人控制。","sourceTitle":"π0: A Vision-Language-Action Flow Model","year":2024},{"name":"Black Forest Labs","role":"公司路线","kind":"Frontier Lab","url":"https://bfl.ai/blog/flux-2","note":"FLUX.2 明确采用 latent flow matching：在压缩潜空间里学习连续流，并用 rectified-flow Transformer 同时承担图像生成与编辑。","sourceTitle":"FLUX.2: Frontier Visual Intelligence","year":2025}]},{"id":"cap-scalable-generative","label":"同一生成骨干可扩展到多种模态","en":"Scalable Generative Backbone","entityKind":"capability_outcome","status":"established","x":5250,"y":1720,"w":298,"h":76,"summary":"Transformer 与连续生成目标可以复用于图像、视频、音频等模态。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-video-generation","label":"Video Generation / 视频生成模型","en":"Video Generative Models","entityKind":"technical_route","status":"frontier","x":5660,"y":1620,"w":290,"h":76,"summary":"联合生成随时间变化、视觉上连续的视频序列。","why":"单帧图像生成不需要维持对象身份、运动和长期事件一致性。","mechanism":"在空间生成骨干上加入时间注意力、时空 latent 或分层运动建模。","changed":"模型开始学习动态视觉规律，并成为部分交互世界模型的生成基础。","limits":"长时一致性、可控相机、物理因果与真实行动响应仍不可靠。","plainLanguage":"生成单张图只要画面好看，生成视频还得让人物、物体和运动在时间上保持一致。视频生成模型开始学习动态视觉规律，但长时间一致性和真实物理仍不可靠。","evidence":[{"kind":"paper","year":2022,"title":"Video Diffusion Models","url":"https://arxiv.org/abs/2204.03458","note":"把图像扩散自然扩展到时空数据并实现条件视频生成。"}],"actors":[{"name":"Google Research","role":"标志性推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/2204.03458","note":"把图像扩散扩展到时间维度，并用时空分解网络生成连续视频，奠定现代视频扩散路线。","sourceTitle":"Video Diffusion Models","year":2022}]},{"id":"tech-diffusion-language","label":"Diffusion Language Models / 扩散语言模型","en":"Diffusion Language Models","entityKind":"technical_route","status":"emerging","x":5660,"y":1820,"w":295,"h":76,"summary":"通过迭代去噪或修订并行生成文本，而非严格从左到右。","why":"自回归语言模型推理串行，且早期 token 一旦生成很难全局回改。","mechanism":"从被遮盖或带噪的离散序列出发，多轮并行预测与修正 token。","changed":"提供可并行生成、全局编辑和可控推理的新路径。","limits":"离散扩散的训练、长度控制与生成质量尚未稳定超过主流自回归路线。","plainLanguage":"普通语言模型从左到右写，前面写错后很难回改。扩散语言模型尝试先给出一版不完整文本，再多轮并行修订，为更快生成和全局编辑提供另一条路线。","evidence":[{"kind":"paper","year":2021,"title":"Structured Denoising Diffusion Models in Discrete State-Spaces","url":"https://proceedings.neurips.cc/paper/2021/hash/958c530554f78bcd8e97125b70e6973d-Abstract.html","note":"D3PM 直接把去噪扩散推广到离散状态并在文本上验证。"}],"actors":[{"name":"Google Research","role":"关键推进","kind":"Frontier Lab","url":"https://proceedings.neurips.cc/paper/2021/hash/958c530554f78bcd8e97125b70e6973d-Abstract.html","note":"D3PM 把连续高斯去噪改写为离散状态转移，使扩散训练可以覆盖文本、图结构等离散数据。","sourceTitle":"Structured Denoising Diffusion Models in Discrete State-Spaces","year":2021}]},{"id":"problem-generative-grounding","label":"生成逼真不等于理解可行动世界","en":"Generation–Understanding Gap","entityKind":"problem","status":"established","x":6070,"y":1720,"w":298,"h":76,"summary":"像素逼真可能缺少持久对象、因果动力学和行动敏感性。","why":"像素逼真可能缺少持久对象、因果动力学和行动敏感性。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-general-foundation-model","label":"广泛知识与上下文适应","en":"General Foundation Model Capability","entityKind":"composite_capability","status":"established","x":1550,"y":2120,"w":254,"h":74,"summary":"一个模型在大量任务上通过提示、上下文或少量适配工作。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-task-specific-models","label":"每个任务单独建模，能力无法复用","en":"Task-Specific Model Fragmentation","entityKind":"problem","status":"established","x":1960,"y":2120,"w":298,"h":76,"summary":"专用模型把数据、知识和工程重复隔离在任务内部。","why":"专用模型把数据、知识和工程重复隔离在任务内部。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-foundation-models","label":"Foundation Models / 基础模型","en":"Foundation Models","entityKind":"technical_route","status":"established","x":2380,"y":2120,"w":300,"h":76,"summary":"在广泛数据上大规模预训练，再适配许多下游任务的共同模型底座。","why":"每个任务从头训练导致数据、知识与工程能力无法复用。","mechanism":"以统一自监督目标预训练大模型，再用提示、微调或检索适配具体场景。","changed":"模型从单任务组件变成可承载生态的通用能力平台。","limits":"能力与风险同时集中；训练数据、评测、部署和治理都出现系统性外部性。","plainLanguage":"以前每个任务都单独训练一个模型，数据和知识很难复用。基础模型先在广泛数据上训练一个共同底座，再通过提示、微调或检索服务许多任务。","evidence":[{"kind":"report","year":2021,"title":"On the Opportunities and Risks of Foundation Models","url":"https://arxiv.org/abs/2108.07258","note":"定义大规模预训练、跨任务适配的基础模型范式及其系统性风险。"}],"actors":[{"name":"Stanford CRFM","role":"概念提出与系统化","kind":"Lab","url":"https://arxiv.org/abs/2108.07258","note":"提出 Foundation Model 这一统一概念，强调同一大规模预训练模型会成为大量下游系统的共同基础与风险源。","sourceTitle":"On the Opportunities and Risks of Foundation Models","year":2021}]},{"id":"tech-scaling-laws","label":"Scaling Laws / 规模定律","en":"Scaling Laws & Compute-Optimal Training","entityKind":"thesis","status":"established","x":2380,"y":1980,"w":270,"h":74,"summary":"描述模型、数据、算力与损失之间可预测的幂律关系。","why":"大模型训练昂贵，必须知道新增资源投入在哪里最有效。","mechanism":"在不同模型规模、数据量和计算预算上拟合经验规律，并据此配比训练资源。","changed":"训练前可以估算收益，研究路线从试错工程转向规模化资源规划。","limits":"规律依赖数据、架构与目标分布；损失下降不等同于可靠能力按同样方式增长。","plainLanguage":"训练大模型很贵，不能全靠试。规模定律用经验规律估算增加模型、数据和算力后，损失大概会怎样变化，帮助团队提前配置训练资源。","evidence":[{"kind":"paper","year":2020,"title":"Scaling Laws for Neural Language Models","url":"https://arxiv.org/abs/2001.08361","note":"系统刻画模型规模、数据规模与计算量同损失之间的幂律关系。"},{"kind":"paper","year":2022,"title":"Training Compute-Optimal Large Language Models","url":"https://arxiv.org/abs/2203.15556","note":"指出模型规模与训练 token 应随算力共同扩展。"}],"actors":[{"name":"OpenAI","role":"提出者","kind":"Frontier Lab","url":"https://arxiv.org/abs/2001.08361","note":"系统刻画语言模型损失随模型、数据和计算规模变化的经验幂律。","sourceTitle":"Scaling Laws for Neural Language Models","year":2020},{"name":"Google DeepMind","role":"关键修正","kind":"Frontier Lab","url":"https://arxiv.org/abs/2203.15556","note":"Chinchilla 进一步指出固定算力下模型参数与训练 token 应共同扩展。","sourceTitle":"Training Compute-Optimal Large Language Models","year":2022}]},{"id":"cap-predictable-scaling","label":"资源投入与模型收益可以预估","en":"Predictable Scaling","entityKind":"capability_outcome","status":"established","x":2790,"y":1940,"w":298,"h":76,"summary":"模型、数据和计算预算之间形成可用于训练规划的经验关系。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-dense-compute","label":"稠密模型每次计算激活全部参数","en":"Dense Compute Bottleneck","entityKind":"problem","status":"established","x":3200,"y":2020,"w":298,"h":76,"summary":"总容量增长会同步推高每个 token 的训练和推理成本。","why":"总容量增长会同步推高每个 token 的训练和推理成本。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-moe","label":"MoE / Mixture of Experts","en":"Mixture of Experts","entityKind":"technical_route","status":"established","x":3610,"y":2020,"w":277,"h":74,"summary":"每个 token 只激活少量专家网络，以稀疏计算扩大模型容量。","why":"稠密模型每次都计算全部参数，容量与单次推理成本被绑在一起。","mechanism":"路由器按 token 选择 top-k 专家，其余专家不参与本次前向计算。","changed":"参数规模可以远大于每 token 实际计算量。","limits":"路由与负载均衡复杂，通信成本高，专家是否形成稳定专长也不确定。","plainLanguage":"普通大模型每次都动用全部参数，容量越大计算越贵。MoE 像给不同输入分派少数几位专家，让总参数继续增长，而每次只算其中一小部分。","evidence":[{"kind":"paper","year":2017,"title":"Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer","url":"https://arxiv.org/abs/1701.06538","note":"现代稀疏 MoE 在 Transformer 基础模型时代之前已经实现条件计算与超大容量。"},{"kind":"paper","year":2021,"title":"Switch Transformers","url":"https://arxiv.org/abs/2101.03961","note":"以稀疏路由扩大参数容量而控制单次计算量。"}],"actors":[{"name":"Google Brain","role":"标志性推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/2101.03961","note":"Switch Transformer 证明稀疏路由可以扩大参数容量而控制单次计算。","sourceTitle":"Switch Transformers","year":2021},{"name":"Mistral AI","role":"公司路线","kind":"Frontier Lab","url":"https://mistral.ai/news/mixtral-of-experts/","note":"Mixtral 在每层为每个 token 从 8 组前馈专家中路由到 2 组，让 46.7B 总参数只激活约 12.9B 参数的计算量。","sourceTitle":"Mixtral of Experts","year":2023},{"name":"DeepSeek","role":"公司路线","kind":"Frontier Lab","url":"https://arxiv.org/abs/2405.04434","note":"DeepSeek-V2 通过更细粒度的路由专家与共享专家提高专家专门化，在扩大总容量的同时控制每个 token 的激活计算。","sourceTitle":"DeepSeek-V2","year":2024}]},{"id":"problem-context-complexity","label":"注意力成本随上下文快速增长","en":"Long-Context Cost","entityKind":"problem","status":"established","x":3200,"y":2200,"w":298,"h":76,"summary":"标准全注意力在长序列上带来显存和计算瓶颈。","why":"标准全注意力在长序列上带来显存和计算瓶颈。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-ssm","label":"SSM / 状态空间模型","en":"State Space Models","entityKind":"technical_route","status":"emerging","x":3610,"y":2200,"w":227,"h":74,"summary":"用可递推状态压缩序列历史，并以接近线性的成本处理长序列。","why":"标准全局注意力的计算和内存会随上下文长度平方增长。","mechanism":"通过结构化状态更新传递历史；选择性 SSM 让更新参数依赖当前输入。","changed":"长序列建模获得高吞吐、低缓存的非注意力主干路线。","limits":"压缩状态可能损失精确回看能力，生态与跨任务验证仍弱于 Transformer。","plainLanguage":"Attention 会随着上下文变长越来越贵，SSM 则把过去压缩进一个持续更新的状态。它处理长序列更省计算，但可能不如 Attention 那样精确回看某个旧位置。","evidence":[{"kind":"paper","year":2023,"title":"Mamba: Linear-Time Sequence Modeling with Selective State Spaces","url":"https://arxiv.org/abs/2312.00752","note":"选择性状态空间模型以线性序列复杂度处理内容相关信息。"}],"actors":[{"name":"Albert Gu & Tri Dao","role":"提出者","kind":"人物","url":"https://arxiv.org/abs/2312.00752","note":"Mamba 让状态空间参数随输入变化，并配合硬件感知扫描，实现按内容选择记忆且随序列长度线性扩展。","sourceTitle":"Mamba","year":2023}]},{"id":"tech-hybrid-architectures","label":"Attention–SSM Hybrids / 混合架构","en":"Hybrid Attention–SSM Architectures","entityKind":"technical_route","status":"emerging","x":4020,"y":2200,"w":289,"h":76,"summary":"把注意力的精确内容检索与 SSM 的线性长程记忆放进同一模型。","why":"纯注意力昂贵，纯状态压缩又可能弱于需要精确 token 交互的任务。","mechanism":"在不同层或模块交替使用 Attention、SSM，常再叠加 MoE。","changed":"可按任务在质量、上下文长度、吞吐和显存之间取得新平衡。","limits":"设计空间尚未收敛，端到端收益依赖硬件、训练配方与具体负载。","plainLanguage":"Attention 擅长精确查找，SSM 擅长低成本保留长历史。混合架构把两者放在同一模型里，试图在质量、速度和上下文长度之间取得更好平衡。","evidence":[{"kind":"paper","year":2024,"title":"Jamba: A Hybrid Transformer-Mamba Language Model","url":"https://arxiv.org/abs/2403.19887","note":"展示 Attention、SSM 与 MoE 的混合架构。"}],"actors":[{"name":"AI21 Labs","role":"公司路线","kind":"Frontier Lab","url":"https://www.ai21.com/research/jamba-a-hybrid-transformer-mamba-language-model/","note":"Jamba 把 Transformer、Mamba 和 MoE 交错组合，在保留全局检索质量的同时降低长上下文内存与推理成本。","sourceTitle":"Jamba: A Hybrid Transformer-Mamba Language Model","year":2024}]},{"id":"problem-objective-intent-gap","label":"下一个 token 目标不等于用户意图","en":"Objective–Intent Gap","entityKind":"problem","status":"established","x":3200,"y":2540,"w":296,"h":76,"summary":"预训练模型会续写，却未必理解指令、偏好和行为边界。","why":"预训练模型会续写，却未必理解指令、偏好和行为边界。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-instruction-tuning","label":"Instruction Tuning / 指令微调","en":"Instruction Tuning","entityKind":"technical_route","status":"established","x":3610,"y":2380,"w":290,"h":76,"summary":"用“指令—回答”数据把基础模型训练成能理解任务意图的助手。","why":"下一个 token 预训练学到广泛知识，却不保证按用户要求组织和执行任务。","mechanism":"在多任务自然语言指令数据上监督微调，使任务描述成为统一接口。","changed":"用户无需为每个任务训练新模型，模型可用自然语言迁移到未见指令。","limits":"行为受示范数据覆盖限制，可能学到格式而非真正遵循目标。","plainLanguage":"只会预测下一个词的模型，不一定知道用户要它做什么。指令微调用大量“要求—回答”示范，教模型把自然语言要求当成任务接口。","evidence":[{"kind":"paper","year":2022,"title":"Training Language Models to Follow Instructions with Human Feedback","url":"https://arxiv.org/abs/2203.02155","note":"指令微调与人类反馈把语言模型转化为更可用的助手。"}],"actors":[{"name":"OpenAI","role":"标志性推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/2203.02155","note":"InstructGPT 用示范和人类偏好把续写模型变成更可用的指令助手。","sourceTitle":"Training Language Models to Follow Instructions with Human Feedback","year":2022}]},{"id":"tech-rlhf","label":"RLHF / 人类反馈强化学习","en":"Reinforcement Learning from Human Feedback","entityKind":"technical_route","status":"established","x":3610,"y":2540,"w":282,"h":74,"summary":"用人类偏好训练奖励模型，再优化语言模型行为。","why":"监督示范难穷举所有好答案，也不能直接表达多维主观偏好。","mechanism":"收集回答比较，拟合奖励模型，再以强化学习让策略提高该奖励。","changed":"模型在帮助性、安全性和交互可用性上更贴近人类偏好。","limits":"反馈昂贵且有偏，奖励模型可被投机，优化过程也较复杂。","plainLanguage":"有些好坏很难写成标准答案，但人能比较两个回答哪个更好。RLHF 把这些偏好学成奖励，再训练模型更贴近人的期待。","evidence":[{"kind":"paper","year":2022,"title":"Training Language Models to Follow Instructions with Human Feedback","url":"https://arxiv.org/abs/2203.02155","note":"指令微调与人类反馈把语言模型转化为更可用的助手。"}],"actors":[{"name":"OpenAI","role":"标志性推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/2203.02155","note":"把人类偏好训练成奖励信号，再用强化学习调整模型行为。","sourceTitle":"Training Language Models to Follow Instructions with Human Feedback","year":2022}]},{"id":"tech-dpo","label":"DPO / Direct Preference Optimization","en":"Direct Preference Optimization","entityKind":"technical_route","status":"established","x":3610,"y":2700,"w":273,"h":76,"summary":"直接用偏好对优化语言模型，无需单独训练奖励模型并在线跑 RL。","why":"经典 RLHF 管线包含多个模型和不稳定的强化学习阶段。","mechanism":"把偏好概率与参考策略约束改写为一个分类式损失。","changed":"偏好对齐的工程门槛降低，训练更简单稳定。","limits":"仍受偏好数据与离线覆盖限制，也没有消除目标错位和过度优化。","plainLanguage":"经典 RLHF 要训练奖励模型、再跑强化学习，流程复杂。DPO 直接用“更喜欢哪个回答”的成对数据调整模型，让偏好训练更简单稳定。","evidence":[{"kind":"paper","year":2023,"title":"Direct Preference Optimization","url":"https://arxiv.org/abs/2305.18290","note":"将偏好优化化为稳定的分类式目标，无需显式奖励模型与在线 RL。"}],"actors":[{"name":"Stanford University","role":"提出者","kind":"Lab","url":"https://arxiv.org/abs/2305.18290","note":"把偏好优化改写成直接的分类目标，省去显式奖励模型和在线 RL。","sourceTitle":"Direct Preference Optimization","year":2023}]},{"id":"cap-instruction-following","label":"模型能按自然语言意图完成任务","en":"Instruction Following","entityKind":"capability_outcome","status":"established","x":4020,"y":2540,"w":298,"h":76,"summary":"自然语言指令成为跨任务调用基础模型的统一接口。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-alignment-generalization","label":"偏好代理会被投机，开放情境难覆盖","en":"Alignment Generalization","entityKind":"problem","status":"established","x":4430,"y":2540,"w":298,"h":76,"summary":"静态偏好数据无法穷尽新任务、长程行为和分布外风险。","why":"静态偏好数据无法穷尽新任务、长程行为和分布外风险。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-reliable-reasoning","label":"可靠的复杂推理","en":"Reliable Complex Reasoning","entityKind":"composite_capability","status":"established","x":1550,"y":2520,"w":190,"h":74,"summary":"在数学、代码和开放问题上形成可检查、可搜索的多步推理。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-single-pass-reasoning","label":"一次生成难以完成复杂推演","en":"Single-Pass Reasoning","entityKind":"problem","status":"established","x":1960,"y":2520,"w":298,"h":66,"summary":"单次前向生成缺少显式工作区、搜索和回退机制。","why":"单次前向生成缺少显式工作区、搜索和回退机制。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-cot","label":"Chain-of-Thought / CoT","en":"Chain-of-Thought","entityKind":"technical_route","status":"established","x":2380,"y":2520,"w":266,"h":74,"summary":"在最终答案前生成可分解的中间推理步骤。","why":"单次直接输出答案没有显式工作区，复杂问题中的中间变量容易丢失。","mechanism":"用示范或提示诱导模型把问题拆成连续的语言推理轨迹。","changed":"大模型可以在不改参数的情况下用更多 token 完成算术、常识和符号推演。","limits":"轨迹可能只是看似合理的事后解释，错误步骤也会一路传递。","plainLanguage":"复杂问题如果直接给答案，模型很容易漏掉中间条件。CoT 让它先写出若干推理步骤，相当于增加一块临时草稿纸，但草稿看起来合理不代表一定真实。","evidence":[{"kind":"paper","year":2022,"title":"Chain-of-Thought Prompting Elicits Reasoning","url":"https://arxiv.org/abs/2201.11903","note":"中间推理文本可显著改善大模型的多步任务表现。"}],"actors":[{"name":"Google Research","role":"标志性提出","kind":"Frontier Lab","url":"https://arxiv.org/abs/2201.11903","note":"证明给大模型少量带中间推理步骤的示例，可以显著提升算术、常识和符号推理表现。","sourceTitle":"Chain-of-Thought Prompting Elicits Reasoning","year":2022}]},{"id":"cap-deliberate-reasoning","label":"问题可以拆成多步再作答","en":"Decomposed Multi-Step Reasoning","entityKind":"capability_outcome","status":"established","x":2790,"y":2520,"w":276,"h":74,"summary":"中间变量和推理步骤可以被展开、复查与继续计算。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-greedy-reasoning","label":"单一路径会早期承诺并累积错误","en":"Greedy Reasoning Path","entityKind":"problem","status":"established","x":3200,"y":2520,"w":298,"h":76,"summary":"生成一次思路无法比较候选、回溯或纠错。","why":"生成一次思路无法比较候选、回溯或纠错。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-test-time-search","label":"Test-Time Compute & Search / 测试时计算","en":"Test-Time Compute & Search","entityKind":"technical_route","status":"frontier","x":3610,"y":2430,"w":300,"h":76,"summary":"在回答时生成、比较或搜索多条候选推理路径。","why":"贪心生成一旦早期选错方向，后续 token 很难恢复。","mechanism":"增加采样、树搜索、反思或迭代修订，并用评分器挑选结果。","changed":"模型能力不再只由训练规模决定，也可用每个问题的额外计算换取质量。","limits":"收益取决于候选多样性和评分可靠性，成本与延迟会显著上升。","plainLanguage":"第一次生成不一定是最好答案，测试时搜索会让模型多想几条路线，再比较、回退或继续展开。它用更多推理时间换更高成功率。","evidence":[{"kind":"paper","year":2024,"title":"Scaling LLM Test-Time Compute Optimally","url":"https://arxiv.org/abs/2408.03314","note":"系统研究如何在推理时分配额外计算、采样与搜索。"}],"actors":[{"name":"Google DeepMind","role":"系统研究","kind":"Frontier Lab","url":"https://arxiv.org/abs/2408.03314","note":"量化何时应把额外推理算力用于更强 verifier，何时用于更多候选搜索。","sourceTitle":"Scaling LLM Test-Time Compute Optimally","year":2024}]},{"id":"tech-verifiers","label":"Verifiers & Process Supervision / 验证器","en":"Verifiers & Process Supervision","entityKind":"technical_route","status":"frontier","x":3610,"y":2610,"w":241,"h":76,"summary":"用结果或过程验证器评价推理轨迹，而非只相信模型自评。","why":"仅靠生成更多候选没有用，系统还需要判断哪条路径更可信。","mechanism":"训练判定最终答案或逐步过程的模型，并用于筛选、搜索或提供密集反馈。","changed":"推理可以被外部检查，错误定位也从最终答案推进到中间步骤。","limits":"开放任务往往没有客观判定，验证器本身也会被分布外样本或策略投机欺骗。","plainLanguage":"模型自己生成很多候选后，还需要有人判卷。验证器负责检查最终答案或中间步骤，把“多想几次”变成“能筛出更可信的一次”。","evidence":[{"kind":"paper","year":2023,"title":"Let's Verify Step by Step","url":"https://arxiv.org/abs/2305.20050","note":"过程监督比只看最终答案提供更密集的推理纠错信号。"}],"actors":[{"name":"OpenAI","role":"规模化推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/2305.20050","note":"把人类反馈从只看最终答案推进到逐步评价推理过程，用过程奖励模型区分表面正确与真正可靠的解法。","sourceTitle":"Let's Verify Step by Step","year":2023}]},{"id":"cap-verified-reasoning","label":"可搜索多条路径，并用验证器筛选","en":"Searchable and Verifiable Reasoning","entityKind":"capability_outcome","status":"established","x":4020,"y":2520,"w":298,"h":76,"summary":"系统不必把第一次生成当作最终答案。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-imitation-ceiling","label":"模仿现有解题轨迹限制策略发现","en":"Reasoning Imitation Ceiling","entityKind":"problem","status":"established","x":4430,"y":2520,"w":298,"h":76,"summary":"监督微调只能复现数据中的思路，难以主动发现更优策略。","why":"监督微调只能复现数据中的思路，难以主动发现更优策略。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-rlvr","label":"RLVR / 可验证奖励强化学习","en":"Reinforcement Learning with Verifiable Rewards","entityKind":"technical_route","status":"frontier","x":4840,"y":2520,"w":300,"h":74,"summary":"用可自动判定对错的奖励，让模型通过探索学习推理策略。","why":"模仿已有解题轨迹会把模型限制在人类示范分布内。","mechanism":"在数学、代码等可验证任务上采样推理，依据最终正确性做策略优化。","changed":"模型能发现未被示范明确写出的解题策略，并把测试时思考内化为策略。","limits":"适用范围受可验证任务限制；奖励投机、训练稳定与跨域迁移仍未解决。","plainLanguage":"当答案能自动判对错时，可以直接把正确结果当奖励训练模型。RLVR 让模型自己探索更有效的解题策略，但主要适用于数学、代码等可验证任务。","evidence":[{"kind":"report","year":2025,"title":"DeepSeek-R1: Incentivizing Reasoning Capability via Reinforcement Learning","url":"https://arxiv.org/abs/2501.12948","note":"展示可验证奖励强化学习可诱导推理行为，同时也说明开放任务仍缺可靠奖励。"}],"actors":[{"name":"DeepSeek","role":"规模化推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/2501.12948","note":"DeepSeek-R1 展示只依赖可验证结果奖励的强化学习，也能在大规模训练中诱发长链推理策略。","sourceTitle":"DeepSeek-R1","year":2025}]},{"id":"cap-learned-reasoning-policy","label":"模型可通过结果反馈发现推理策略","en":"Learned Reasoning Policies","entityKind":"capability_outcome","status":"established","x":5250,"y":2520,"w":298,"h":76,"summary":"可验证奖励让模型探索并强化有效的解题行为。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-open-verification","label":"开放任务缺少可靠判定器","en":"Open-Ended Verification","entityKind":"problem","status":"established","x":5660,"y":2520,"w":276,"h":66,"summary":"现实问题通常没有自动、无歧义且不可被投机的奖励。","why":"现实问题通常没有自动、无歧义且不可被投机的奖励。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-long-horizon-agency","label":"长程自主完成任务","en":"Long-Horizon Agency","entityKind":"composite_capability","status":"established","x":1550,"y":2920,"w":211,"h":74,"summary":"围绕目标持续获取信息、使用工具、执行行动并根据反馈重规划。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-parametric-knowledge","label":"参数知识过时且难追溯","en":"Static Parametric Knowledge","entityKind":"problem","status":"established","x":1960,"y":2920,"w":254,"h":66,"summary":"模型内部知识难更新，也无法给出可靠来源。","why":"模型内部知识难更新，也无法给出可靠来源。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-rag","label":"RAG / 检索增强生成","en":"Retrieval-Augmented Generation","entityKind":"technical_route","status":"established","x":2380,"y":2840,"w":227,"h":74,"summary":"生成前从外部知识库检索相关材料，并让答案以材料为条件。","why":"参数知识会过时，来源难追溯，重新训练又昂贵。","mechanism":"把 query 映射到文档索引，取回片段后与提示一同交给生成模型。","changed":"知识可以独立更新、引用和做权限控制，答案也更容易追溯。","limits":"检索错误会直接污染生成；文档相关不等于答案正确，长上下文整合仍困难。","plainLanguage":"模型参数里的知识会过时，也很难说明来源。RAG 在回答前先去外部资料中检索，把找到的内容连同问题一起交给模型。","evidence":[{"kind":"paper","year":2020,"title":"Retrieval-Augmented Generation for Knowledge-Intensive NLP","url":"https://arxiv.org/abs/2005.11401","note":"把可更新的非参数记忆接入生成模型。"}],"actors":[{"name":"Facebook AI Research","role":"提出者","kind":"Frontier Lab","url":"https://arxiv.org/abs/2005.11401","note":"把可检索的外部文档作为非参数记忆，与生成模型联合起来，使回答能够动态引用训练参数之外的知识。","sourceTitle":"Retrieval-Augmented Generation for Knowledge-Intensive NLP","year":2020}]},{"id":"tech-external-memory","label":"External Memory / 外部记忆","en":"External and Differentiable Memory","entityKind":"technical_route","status":"established","x":2380,"y":3000,"w":300,"h":68,"summary":"把可读写状态放到模型参数之外，供跨步骤或跨会话调用。","why":"固定上下文窗口无法保存长期经历，参数更新又不适合实时写入事件。","mechanism":"以向量库、键值存储、可微内存或结构化状态保存和检索历史。","changed":"模型获得可更新的工作记忆、情节记忆和长期用户状态。","limits":"何时写、写什么、何时忘仍不稳定，错误记忆还会长期放大。","plainLanguage":"上下文窗口有限，模型也不会天然记住长期经历。外部记忆把重要状态和经验存到模型之外，需要时再取回。","evidence":[{"kind":"paper","year":2014,"title":"Neural Turing Machines","url":"https://arxiv.org/abs/1410.5401","note":"以可微读写把神经网络连接到外部记忆。"},{"kind":"paper","year":2023,"title":"Reflexion: Language Agents with Verbal Reinforcement Learning","url":"https://arxiv.org/abs/2303.11366","note":"把任务反馈写入语言记忆以改进后续尝试。"}],"actors":[{"name":"DeepMind","role":"提出与推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/1410.5401","note":"Neural Turing Machine 给神经网络增加可微读写的外部存储，让模型可以学习复制、排序和联想回忆等算法。","sourceTitle":"Neural Turing Machines","year":2014}]},{"id":"cap-grounded-knowledge","label":"知识可实时更新，并能追溯来源","en":"Updatable and Attributable Knowledge","entityKind":"capability_outcome","status":"established","x":2790,"y":2920,"w":298,"h":76,"summary":"事实可以留在外部知识源中独立更新，模型回答能指向依据。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-no-environment-action","label":"模型只能输出文本，无法改变环境","en":"No Environment Action","entityKind":"problem","status":"established","x":3200,"y":2920,"w":298,"h":76,"summary":"知识与计划若不能调用工具或 API，就无法完成真实任务。","why":"知识与计划若不能调用工具或 API，就无法完成真实任务。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-tool-use","label":"Tool Use & Function Calling / 工具调用","en":"Tool Use and Function Calling","entityKind":"technical_route","status":"established","x":3610,"y":2920,"w":300,"h":76,"summary":"让模型调用搜索、代码、数据库或业务 API，而非只输出文本。","why":"语言模型的参数不能执行精确计算、访问实时数据或改变外部系统。","mechanism":"模型生成结构化函数名与参数，执行器返回结果并继续上下文。","changed":"模型从内容生成器变成可以组合数字能力的控制接口。","limits":"参数错误、权限、安全与工具失败处理会把软件系统风险带进 Agent。","plainLanguage":"语言模型本身只能生成文本，工具调用让它能搜索、计算、读数据库或操作软件。输出因此不再只是回答，也可以成为真实动作。","evidence":[{"kind":"paper","year":2023,"title":"Toolformer","url":"https://arxiv.org/abs/2302.04761","note":"让语言模型学习何时以及如何调用外部工具。"}],"actors":[{"name":"Meta AI","role":"标志性推进","kind":"Frontier Lab","url":"https://arxiv.org/abs/2302.04761","note":"Toolformer 让模型通过自监督筛选 API 调用示例，学习在需要时调用计算器、搜索与其他工具。","sourceTitle":"Toolformer","year":2023}]},{"id":"problem-reason-action-separation","label":"推理、行动与观察彼此割裂","en":"Reasoning–Action Separation","entityKind":"problem","status":"established","x":4020,"y":2920,"w":298,"h":66,"summary":"先写完计划再执行，无法利用中途反馈修正认知。","why":"先写完计划再执行，无法利用中途反馈修正认知。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-react","label":"ReAct / Reasoning + Acting","en":"ReAct: Reasoning and Acting","entityKind":"technical_route","status":"established","x":4430,"y":2920,"w":298,"h":74,"summary":"让模型在推理、行动和环境观察之间交替循环。","why":"先完整推理再执行会基于过时假设，行动结果也无法及时修正计划。","mechanism":"每一步产生 thought 与 action，执行后把 observation 纳入下一步。","changed":"Agent 形成感知—推理—行动闭环，能够边做边更新计划。","limits":"语言轨迹脆弱且成本高，循环可能卡住、漂移或重复错误。","plainLanguage":"只规划不看结果，后面很容易越走越偏。ReAct 让模型在“想一步—做一步—看反馈”之间循环，再根据现实结果修正下一步。","evidence":[{"kind":"paper","year":2023,"title":"ReAct: Synergizing Reasoning and Acting","url":"https://arxiv.org/abs/2210.03629","note":"交替生成推理与行动，并把环境观察纳入后续推理。"}],"actors":[{"name":"Princeton University & Google Research","role":"提出者","kind":"Lab","url":"https://arxiv.org/abs/2210.03629","note":"ReAct 把语言推理轨迹与环境动作交替生成，让模型能边想、边查、边根据观察修正下一步。","sourceTitle":"ReAct: Synergizing Reasoning and Acting","year":2022}]},{"id":"cap-agent-loop","label":"模型能观察结果并继续采取行动","en":"Observe–Reason–Act Loop","entityKind":"capability_outcome","status":"established","x":4840,"y":2920,"w":298,"h":76,"summary":"输出不再是终点，而成为改变环境、获取反馈和修正计划的一步。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-long-horizon-errors","label":"长程状态漂移与错误复利","en":"Long-Horizon Error Compounding","entityKind":"problem","status":"established","x":5250,"y":2920,"w":276,"h":66,"summary":"任务越长，记忆冲突、工具失败和计划偏移越容易累积。","why":"任务越长，记忆冲突、工具失败和计划偏移越容易累积。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-stateful-agents","label":"Stateful Agents / 有状态 Agent","en":"Stateful Agents and Persistent Memory","entityKind":"technical_route","status":"emerging","x":5660,"y":2840,"w":280,"h":76,"summary":"显式维护任务状态、计划、记忆与环境变化的长期 Agent。","why":"一次对话式调用无法承载跨小时、跨会话的复杂任务。","mechanism":"把工作记忆、事件日志、计划图和检查点持久化，并在每轮选择性读取。","changed":"Agent 可以中断后恢复、追踪承诺，并根据历史反馈调整行为。","limits":"状态模式与记忆治理尚未标准化，旧信息和错误摘要会导致状态漂移。","plainLanguage":"长任务不能每一步都从零开始。有状态 Agent 会保存当前目标、已做动作、环境变化和待办事项，让任务可以跨多轮持续推进。","evidence":[{"kind":"paper","year":2023,"title":"Reflexion: Language Agents with Verbal Reinforcement Learning","url":"https://arxiv.org/abs/2303.11366","note":"把任务反馈写入语言记忆以改进后续尝试。"}],"actors":[{"name":"Noah Shinn 等 / Reflexion","role":"关键推进","kind":"人物","url":"https://arxiv.org/abs/2303.11366","note":"让 Agent 把失败后的语言反思写入情景记忆，在不更新模型参数的情况下改进后续尝试。","sourceTitle":"Reflexion","year":2023}]},{"id":"tech-agentic-workflows","label":"Agentic Workflows / Agent 工作流","en":"Agentic Workflows","entityKind":"technical_route","status":"emerging","x":5660,"y":3000,"w":290,"h":76,"summary":"用角色分工、工具节点与控制流组合多个模型调用。","why":"单个 Agent 很难同时做好规划、执行、校验和权限隔离。","mechanism":"以图、状态机或编排器串联专门角色，并加入重试、人工审核和确定性代码。","changed":"复杂任务可以被拆成可观察、可替换和可治理的执行系统。","limits":"多 Agent 不自动优于单 Agent；通信开销、级联错误和评估仍很突出。","plainLanguage":"单个 Agent 很难可靠完成复杂工作流。Agent 工作流把任务拆成明确步骤，接上工具、检查点和必要的人工审批，让执行过程可追踪、可重试。","evidence":[{"kind":"paper","year":2023,"title":"ReAct: Synergizing Reasoning and Acting","url":"https://arxiv.org/abs/2210.03629","note":"交替生成推理与行动，并把环境观察纳入后续推理。"}],"actors":[{"name":"Reflection AI","role":"公司路线","kind":"Neo Lab","url":"https://www.reflection.ai/","note":"公开把自主编程视为根问题，并以强化学习提升语言模型在计算机上的自主性。","sourceTitle":"Reflection AI research thesis","year":2024}]},{"id":"problem-agent-reliability","label":"开放环境中缺乏可证明的自主可靠性","en":"Agent Reliability Boundary","entityKind":"problem","status":"established","x":6070,"y":2920,"w":298,"h":76,"summary":"现有 Agent 很难在长时程、不可逆行动和分布外事件中稳定工作。","why":"现有 Agent 很难在长时程、不可逆行动和分布外事件中稳定工作。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"cap-adaptive-control","label":"通过交互学习决策与控制","en":"Learning to Decide by Interaction","entityKind":"composite_capability","status":"established","x":1550,"y":3320,"w":276,"h":74,"summary":"从行动后果和延迟奖励中学习策略。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-no-action-labels","label":"最佳行动没有现成监督标签","en":"No Supervised Action Labels","entityKind":"problem","status":"established","x":1960,"y":3320,"w":298,"h":66,"summary":"序列决策只能从试错和长期回报判断行为好坏。","why":"序列决策只能从试错和长期回报判断行为好坏。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-reinforcement-learning","label":"Reinforcement Learning / RL","en":"Reinforcement Learning","entityKind":"technical_route","status":"established","x":2380,"y":3320,"w":283,"h":76,"summary":"通过行动后的累计奖励学习策略，而不需要每一步的正确标签。","why":"决策任务只在未来结果上给反馈，最佳行动通常没有现成示范。","mechanism":"以价值函数、时序差分或策略梯度连接状态、行动与长期回报。","changed":"机器可以通过试错学习控制与序列决策。","limits":"奖励设计困难，探索成本高，错误代理目标会产生意外行为。","plainLanguage":"很多任务没有每一步的标准动作，只有最后结果好不好。强化学习让系统通过奖励把一串行动和长期结果联系起来。","evidence":[{"kind":"paper","year":1988,"title":"Learning to Predict by the Methods of Temporal Differences","url":"https://link.springer.com/article/10.1023/A:1022633531479","note":"TD 学习用相邻时间预测差分进行信用分配，是现代强化学习价值学习的直接原始来源。"},{"kind":"paper","year":1992,"title":"Simple Statistical Gradient-Following Algorithms for Connectionist Reinforcement Learning","url":"https://link.springer.com/article/10.1007/BF00992696","note":"REINFORCE 直接建立基于回报优化参数化策略的策略梯度主干。"}],"actors":[{"name":"Reflection AI","role":"前沿实践","kind":"Neo Lab","url":"https://www.reflection.ai/","note":"把 RL 与语言模型结合，目标是获得类似 AlphaGo 但作用于计算机任务的自主能力。","sourceTitle":"Reflection AI research thesis","year":2024}]},{"id":"cap-reward-driven-policy","label":"没有动作标签，也能从结果学习策略","en":"Learn Policies from Outcomes","entityKind":"capability_outcome","status":"established","x":2790,"y":3320,"w":298,"h":76,"summary":"延迟奖励可以把行动与长期结果联系起来。","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-high-dimensional-state","label":"高维感知状态需要人工压缩","en":"High-Dimensional State","entityKind":"problem","status":"established","x":3200,"y":3320,"w":298,"h":66,"summary":"传统 RL 难以直接处理图像等复杂观测。","why":"传统 RL 难以直接处理图像等复杂观测。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"tech-deep-rl","label":"Deep Reinforcement Learning / Deep RL","en":"Deep Reinforcement Learning","entityKind":"technical_route","status":"established","x":3610,"y":3320,"w":225,"h":76,"summary":"用深度网络从高维感知输入直接学习价值或策略。","why":"经典 RL 依赖手工状态，无法直接处理像素、声音等复杂观测。","mechanism":"把神经表征与价值学习、策略优化和经验回放等 RL 算法结合。","changed":"感知与控制可以端到端训练，并扩展到大状态空间。","limits":"训练不稳定、样本效率低，对超参数和奖励极其敏感。","plainLanguage":"传统强化学习遇到图像或巨大状态空间就很难表示。Deep RL 用深度网络从原始输入中学习状态、价值或策略，把两条技术路线接了起来。","evidence":[{"kind":"paper","year":2015,"title":"Human-level control through deep reinforcement learning","url":"https://www.nature.com/articles/nature14236","note":"深度网络从像素学习价值函数，打通感知与控制。"}],"actors":[{"name":"Google DeepMind","role":"标志性推进","kind":"Frontier Lab","url":"https://www.nature.com/articles/nature14236","note":"DQN 把深度视觉表征、Q-learning 与经验回放结合，使同一套算法能直接从像素学习多款 Atari 游戏。","sourceTitle":"Human-level control through deep reinforcement learning","year":2015}]},{"id":"problem-large-search-space","label":"巨大决策树无法穷举","en":"Combinatorial Search Space","entityKind":"problem","status":"established","x":4020,"y":3220,"w":233,"h":66,"summary":"长程规划的分支数远超传统搜索能力。","why":"长程规划的分支数远超传统搜索能力。","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},{"id":"problem-sample-efficiency","label":"真实交互昂贵，Model-Free 样本效率低"
