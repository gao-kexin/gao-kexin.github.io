rks that propagate evidence, establishing the main line of Bayesian networks."}]},"tech-causal-models":{"id":"tech-causal-models","label":"Causal Models / 因果模型","englishLabel":"Causal Models & Counterfactual Reasoning","summary":"Use structural causal models to distinguish observation, intervention and counterfactual reasoning.","why":"Fitting correlations alone cannot answer what would happen if we actively changed one factor.","mechanism":"Represent the generative mechanisms among variables as structural equations and express interventions with the do-operator.","changed":"Allowed policy evaluation, experimental design and mechanistic reasoning to go beyond correlational prediction.","limits":"Causal structure still depends on assumptions, experiments or domain knowledge, and discovery remains difficult in high-dimensional open environments.","plainLanguage":"Ordinary prediction can say that two things often occur together. Causal models also ask, ‘If I actively change one of them, what happens to the other?’ This lets AI reason about interventions and counterfactuals rather than merely restating correlations.","evidence":[{"title":"Causal Diagrams for Empirical Research","note":"The work uses causal diagrams to state assumptions and determine whether observational data can identify intervention effects, making it a direct theoretical source for structural causal modeling."}],"actors":[{"name":"Judea Pearl","role":"Proponent","note":"He used causal graphs and intervention semantics to distinguish correlation, intervention and counterfactual reasoning."}]},"tech-statistical-learning":{"id":"tech-statistical-learning","label":"Statistical Machine Learning / 统计学习","englishLabel":"Statistical Machine Learning","summary":"Estimate predictive rules from samples that continue to work on unseen data.","why":"Hand-written rules could not cover complex variation in data, so models had to infer regularities from experience.","mechanism":"Use loss functions, regularization and generalization theory to select a model from a hypothesis space.","changed":"Shifted the core of AI from writing rules to learning rules from data.","limits":"Performance depends heavily on hand-engineered features, the data distribution and task-specific modeling.","plainLanguage":"Instead of asking people to write every rule, give the machine examples and let it discover patterns that work on new data. Statistical learning shifted AI from writing rules to learning them from samples.","evidence":[{"title":"The Nature of Statistical Learning Theory","note":"Vapnik systematically developed empirical risk, generalization and capacity control, directly supporting the statistical learning paradigm."}],"actors":[{"name":"Vladimir Vapnik","role":"Theoretical founder","note":"Statistical learning theory systematically explained the relationship among empirical risk, model capacity and generalization, providing the theoretical foundation for later kernel methods and SVMs."}]},"tech-kernel-methods":{"id":"tech-kernel-methods","label":"Kernel Methods & SVM / 核方法","englishLabel":"Kernel Methods & Support Vector Machines","summary":"Learn high-dimensional nonlinear decision boundaries with maximum margins and the kernel trick.","why":"Linear models could not separate complex data, while explicitly constructing high-dimensional features was expensive.","mechanism":"Use a kernel function to compute inner products in an implicit feature space, then improve generalization by maximizing the margin.","changed":"Established a powerful and theoretically clear nonlinear learning method for the era of small and medium-sized datasets.","limits":"Computation grows quickly with the number of samples, and the representation remains constrained by the chosen kernel function.","plainLanguage":"Some data cannot be separated in its original coordinates. Kernel methods effectively move it into a better viewing space and draw the boundary there. Before deep learning, this was a major way to solve complex classification problems on modest datasets.","evidence":[{"title":"Support-Vector Networks","note":"By combining kernel mappings with maximum-margin learning, SVMs became a representative nonlinear approach of the statistical learning era."}],"actors":[{"name":"Corinna Cortes & Vladimir Vapnik / AT&T Bell Labs","role":"Proponents","note":"They used maximum margins and kernel functions to turn nonlinear classification into a convex optimization problem in a high-dimensional space, establishing the SVM line."}]},"tech-tree-ensembles":{"id":"tech-tree-ensembles","label":"Decision Trees & Ensembles / 树与集成学习","englishLabel":"Decision Trees & Ensemble Learning","summary":"Combine decision trees or weak learners into robust predictors for structured data.","why":"A single shallow model has high bias, while one deep tree easily overfits.","mechanism":"Aggregate complementary models through Bagging, Boosting or random feature selection.","changed":"Made nonlinear prediction on tabular data performant, deployable and partly interpretable.","limits":"These methods do not naturally handle raw images, speech or long text, and they do not directly learn general-purpose representations.","plainLanguage":"One decision tree can form a biased view, so ensemble learning asks many trees or weak models to vote together. It remains a strong practical baseline for tabular data.","evidence":[{"title":"Random Forests","note":"Random forests are a classic main line of tree models and ensemble learning."}],"actors":[{"name":"Leo Breiman","role":"Proponent","note":"He combined the votes of many deliberately varied decision trees, substantially reducing the variance of a single tree without sacrificing trainability."}]},"problem-feature-engineering":{"id":"problem-feature-engineering","label":"性能依赖人工特征与任务专用管线","englishLabel":"Feature Engineering Bottleneck","summary":"Traditional methods often cannot learn representations end to end from raw perceptual data.","why":"Traditional methods often cannot learn representations end to end from raw perceptual data.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-neural-networks":{"id":"tech-neural-networks","label":"Neural Networks / MLP","englishLabel":"Artificial Neural Networks & Multilayer Perceptrons","summary":"A family of functions built from layers of differentiable units that jointly learn representations and predictions.","why":"Hand-engineered features limited the model's ability to discover complex hierarchical structure in raw data.","mechanism":"Compose linear transformations with nonlinear activations layer by layer to approximate a parameterized mapping from input to output.","changed":"Provided a unified, scalable model form for end-to-end representation learning.","limits":"Shallow networks had limited expressive power and sample efficiency, while deep networks were still difficult to train reliably at the time.","plainLanguage":"A neural network lets a machine combine many layers of simple computation and gradually learn a mapping from input to answer. The key change is that features no longer need to be designed entirely by hand; the model can learn them together with the task.","evidence":[{"title":"The Perceptron: A Probabilistic Model for Information Storage and Organization in the Brain","note":"The Perceptron was an early connectionist system whose weights could adapt from examples, directly supporting the artificial neural network tradition."},{"title":"Learning representations by back-propagating errors","note":"This classic paper trained multilayer neural networks with backpropagation and showed hidden units learning task-relevant representations."}],"actors":[{"name":"Frank Rosenblatt","role":"Early pioneer","note":"The perceptron first combined learnable weights, neuron-like computation and classification into a complete model, making it an important origin of modern neural networks."}]},"tech-backprop":{"id":"tech-backprop","label":"Backpropagation / 反向传播","englishLabel":"Backpropagation","summary":"Efficiently calculates how much each parameter in a multilayer differentiable model contributes to the error.","why":"Parameters across layers are coupled, so they cannot be adjusted effectively by hand one at a time.","mechanism":"It applies the chain rule to propagate output error backward through the network, then works with gradient optimization to update the parameters.","changed":"It made end-to-end training of deep networks practical and became a key enabler of modern deep learning.","limits":"It does not by itself solve vanishing gradients, unstable optimization or a poorly specified objective.","plainLanguage":"A multilayer network has too many parameters to tune by trial and error. Backpropagation starts from the final error and works backward to calculate how much each layer should change, allowing the whole network to train together.","evidence":[{"title":"Learning representations by back-propagating errors","note":"The classic paper showing that backpropagation can train multilayer neural networks and make hidden units learn task-relevant representations."}],"actors":[{"name":"David Rumelhart, Geoffrey Hinton & Ronald Williams","role":"Landmark formulation","note":"They propagated output error backward through the computation graph, enabling multilayer networks to learn internal representations end to end."}]},"cap-representation-learning":{"id":"cap-representation-learning","label":"可直接从原始数据学习表征","englishLabel":"Learn Representations Directly from Raw Data","summary":"Models no longer depend only on hand-crafted features; they can form internal representations suited to the task.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-shallow-scale":{"id":"problem-shallow-scale","label":"浅层网络难以吸收数据与算力","englishLabel":"Shallow Learning Ceiling","summary":"Optimization, data and computing conditions were not yet sufficient to train deep networks reliably.","why":"Optimization, data and computing conditions were not yet sufficient to train deep networks reliably.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-deep-learning":{"id":"tech-deep-learning","label":"Deep Learning / 深度学习","englishLabel":"Deep Learning","summary":"Uses multilayer neural networks to learn representations from raw data in successive stages.","why":"Shallow models and hand-crafted features could not fully absorb the growing volume of data and compute.","mechanism":"It combines deep networks, backpropagation, large datasets, accelerated computing, and suitable optimization and regularization techniques.","changed":"Vision, speech and language began to share a common paradigm: data, differentiable models and training at scale.","limits":"It requires substantial data and compute, its internal mechanisms are opaque, and it remains fragile under distribution shift.","plainLanguage":"Shallow models could not make full use of growing datasets and compute. Deep learning stacks many layers so the model can build increasingly complex representations, giving vision, speech and language a shared approach to training at scale.","evidence":[{"title":"Bengio, Hinton & LeCun — ACM A.M. Turing Award","note":"An authoritative overview of how deep neural networks became a central method in modern computing."},{"title":"ImageNet Classification with Deep Convolutional Neural Networks","note":"A landmark result combining CNNs, GPUs and large-scale supervised data."}],"actors":[{"name":"Yoshua Bengio, Geoffrey Hinton & Yann LeCun","role":"Foundational long-term work","note":"Their sustained research programs jointly established multilayer neural networks, representation learning and trainable deep architectures as a core of modern AI."}]},"cap-visual-understanding":{"id":"cap-visual-understanding","label":"开放世界视觉理解","englishLabel":"Open-World Visual Understanding","summary":"Recognizes objects, structures, relations and changes directly from pixels.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-visual-variance":{"id":"problem-visual-variance","label":"像素变化巨大，人工特征难覆盖","englishLabel":"Visual Variation","summary":"Changes in viewpoint, scale, lighting and deformation make fixed templates difficult to generalize.","why":"Changes in viewpoint, scale, lighting and deformation make fixed templates difficult to generalize.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-cnn":{"id":"tech-cnn","label":"CNN / 卷积神经网络","englishLabel":"Convolutional Neural Networks","summary":"Uses local convolutions and shared weights to learn spatial hierarchies in images.","why":"Images are high-dimensional and spatially structured; ordinary fully connected networks use too many parameters and lack a translation prior.","mechanism":"Convolutional filters are shared across the image, and successive layers expand the receptive field, combining edges into textures and object structures.","changed":"Vision systems could learn stable hierarchical representations end to end, replacing most hand-crafted visual features.","limits":"Its local inductive bias means global relations may take many layers to propagate, while recognition still usually depends on fixed labels.","plainLanguage":"A CNN slides the same small window across an image, first finding edges and then combining them into textures and objects. It shifted visual features from manual design to learning directly from pixels.","evidence":[{"title":"ImageNet Classification with Deep Convolutional Neural Networks","note":"A landmark result combining CNNs, GPUs and large-scale supervised data."}],"actors":[{"name":"Alex Krizhevsky, Ilya Sutskever & Geoffrey Hinton","role":"Landmark advance","note":"AlexNet combined deep CNNs, GPUs and large-scale supervised data into a decisive result for computer vision."}]},"cap-hierarchical-vision":{"id":"cap-hierarchical-vision","label":"从像素自动学习视觉层级","englishLabel":"Learn Visual Hierarchies from Pixels","summary":"The model progressively combines edges and textures into object-level features.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-depth-degradation":{"id":"problem-depth-degradation","label":"网络越深，反而越难训练","englishLabel":"Depth Degradation","summary":"Simply stacking more layers can degrade optimization and even increase training error.","why":"Simply stacking more layers can degrade optimization and even increase training error.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-resnet":{"id":"tech-resnet","label":"ResNet / 残差网络","englishLabel":"Residual Networks","summary":"Uses residual connections to make very deep visual networks easier to optimize.","why":"As ordinary networks grew deeper, training error could rise rather than fall, so additional depth did not translate into capability.","mechanism":"Each block learns a residual relative to its input, while skip connections preserve identity information and provide shorter gradient paths.","changed":"Networks with hundreds of layers became trainable, creating reusable visual backbones for classification, detection and segmentation.","limits":"Greater depth does not automatically produce global understanding; convolution remains local and fixed-label supervision remains limiting.","plainLanguage":"Deeper networks were not automatically easier to train; too many layers could make them degrade. ResNet added a direct route for information, allowing networks with hundreds of layers to train reliably and serve as a common backbone for many visual tasks.","evidence":[{"title":"Deep Residual Learning for Image Recognition","note":"Residual connections eased optimization degradation in deep networks and produced transferable visual backbones."}],"actors":[{"name":"Microsoft Research Asia","role":"Originator","note":"It introduced residual connections to address optimization degradation as networks grew deeper, producing a visual backbone that remained widely reusable."}]},"cap-very-deep-vision":{"id":"cap-very-deep-vision","label":"视觉 Backbone 可跨任务复用","englishLabel":"Reusable Visual Backbones","summary":"Deep visual encoders become a shared foundation for classification, detection, segmentation and other tasks.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-cnn-locality":{"id":"problem-cnn-locality","label":"CNN 擅长局部，但全局关系建模较绕","englishLabel":"CNN Locality Ceiling","summary":"Convolutions need layer-by-layer propagation to connect distant regions and do not readily share a common backbone with other modalities.","why":"Convolutions need layer-by-layer propagation to connect distant regions and do not readily share a common backbone with other modalities.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-vit":{"id":"tech-vit","label":"Vision Transformer / ViT","englishLabel":"Vision Transformer","summary":"Splits an image into patch tokens and uses a Transformer to model their relationships directly.","why":"The local bias of CNNs helps with smaller datasets but makes a unified architecture and direct global relation modeling harder.","mechanism":"Image patches are linearly embedded, then encoded with global self-attention.","changed":"Vision could reuse the Transformer architecture and large-scale pretraining path developed for language models.","limits":"Attention is costly at high resolution and usually requires large-scale pretraining or stronger data augmentation.","plainLanguage":"ViT cuts an image into patches and lets them look at one another much like tokens in language. It allows vision to use Transformers and large-scale pretraining, but it is not simply the next version of ResNet.","evidence":[{"title":"An Image is Worth 16x16 Words","note":"It split images into patches and encoded them directly with a Transformer."}],"actors":[{"name":"Google Research","role":"Originator","note":"It showed that a pure Transformer could encode images directly when trained with sufficient data."}]},"cap-scalable-vision":{"id":"cap-scalable-vision","label":"视觉可沿 Transformer 统一扩展","englishLabel":"Transformer-Scale Vision","summary":"Visual modeling can share tokens, attention and large-scale pretraining infrastructure with other modalities.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-fixed-visual-labels":{"id":"problem-fixed-visual-labels","label":"固定类别监督限制开放概念迁移","englishLabel":"Fixed Label Bottleneck","summary":"A closed label set cannot cover the new concepts that keep appearing in the real world.","why":"A closed label set cannot cover the new concepts that keep appearing in the real world.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-language":{"id":"cap-language","label":"长上下文语言理解与生成","englishLabel":"Long-context Language Understanding & Generation","summary":"Retains, understands and generates ordered information across increasingly long contexts.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-sequence-state":{"id":"problem-sequence-state","label":"变长序列需要保留历史状态","englishLabel":"Variable-Length Sequence State","summary":"A fixed window cannot represent inputs of arbitrary length or their temporal dependencies.","why":"A fixed window cannot represent inputs of arbitrary length or their temporal dependencies.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-hidden-markov":{"id":"tech-hidden-markov","label":"HMM / 隐马尔可夫模型","englishLabel":"Hidden Markov Models","summary":"Uses hidden states and probabilistic transitions to describe how a sequence evolves over time.","why":"The underlying state of speech or text cannot be observed directly, but it produces observable symbols.","mechanism":"It assumes that the current hidden state depends mainly on the previous state, then connects states to observations through emission probabilities.","changed":"It established a probabilistic framework for sequence models that could be trained and decoded.","limits":"Finite states and local-dependence assumptions struggle with long, continuous and semantically rich histories.","plainLanguage":"We can observe speech or text, but not the underlying state that produced it. An HMM explains those observations with a sequence of hidden states that change probabilistically; it became a classic method for early speech and sequence modeling.","evidence":[{"title":"A Tutorial on Hidden Markov Models and Selected Applications in Speech Recognition","note":"A classic account of probabilistic latent-state modeling with HMMs and its role in speech recognition."}],"actors":[{"name":"Lawrence Rabiner / Bell Labs","role":"Systematic advance","note":"He systematized forward-backward algorithms, parameter estimation and speech-recognition applications of HMMs, making them an engineering entry point for probabilistic sequence modeling."}]},"problem-handcrafted-sequence-state":{"id":"problem-handcrafted-sequence-state","label":"有限状态与局部假设难表达复杂历史","englishLabel":"Handcrafted Sequence State","summary":"Hand-designed finite states and local Markov assumptions cannot adequately carry complex, continuous context.","why":"Hand-designed finite states and local Markov assumptions cannot adequately carry complex, continuous context.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-rnn":{"id":"tech-rnn","label":"RNN / 循环神经网络","englishLabel":"Recurrent Neural Networks","summary":"Processes sequences of arbitrary length by repeatedly updating a hidden state.","why":"Sequences need a dynamic memory learned from data rather than a fixed window.","mechanism":"The same neural unit reads tokens step by step and compresses the history into a continuous hidden state.","changed":"It established a neural sequence-modeling tradition alongside probabilistic state models.","limits":"Gradients struggle to span long time intervals, and computation must proceed sequentially across time steps.","plainLanguage":"An RNN reads the current item while carrying forward a memory of what came before. It can process sequences of any length, but it must work one step at a time and tends to forget over long spans.","evidence":[{"title":"Finding Structure in Time","note":"Recurrent connections gave neural networks a learnable memory in the form of a continuous dynamic state, creating a sequence-modeling tradition alongside HMMs."}],"actors":[{"name":"Jeffrey Elman","role":"Key advance","note":"He used context units to retain the previous hidden state, clearly demonstrating how recurrent networks form temporal representations from sequences."}]},"problem-long-lag":{"id":"problem-long-lag","label":"梯度难跨越长期依赖","englishLabel":"Long Time-Lag Problem","summary":"Standard recurrent networks tend to forget early information and suffer from vanishing gradients on long sequences.","why":"Standard recurrent networks tend to forget early information and suffer from vanishing gradients on long sequences.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-lstm":{"id":"tech-lstm","label":"LSTM / 长短期记忆网络","englishLabel":"Long Short-Term Memory","summary":"Uses gated memory cells to decide what sequence information to retain, write, or forget.","why":"Standard RNNs suffer from vanishing gradients on long sequences, making early information difficult to preserve.","mechanism":"A separate cell state and input, forget, and output gates control the flow of information.","changed":"Greatly improved learning over long dependencies and became a long-standing backbone for speech, translation, and time-series tasks.","limits":"It remains sequential, and all history must still fit into a fixed-width state, so very long dependencies remain difficult.","plainLanguage":"A standard RNN quickly forgets information from far back in a sequence. LSTM adds gates that write, retain, and delete memories. This helps machines process long sentences and slow-changing patterns, but computation still proceeds step by step.","evidence":[{"title":"Long Short-Term Memory","note":"LSTM introduced gated memory to address long-term gradient problems in recurrent networks."}],"actors":[{"name":"Sepp Hochreiter & Jürgen Schmidhuber","role":"Originators","note":"They used memory cells and gated paths to reduce vanishing gradients over long dependencies, allowing recurrent networks to choose what to retain or forget."}]},"problem-variable-transduction":{"id":"problem-variable-transduction","label":"输入输出长度不同且需整体映射","englishLabel":"Sequence Transduction","summary":"Tasks such as machine translation must map one variable-length sequence to another.","why":"Tasks such as machine translation must map one variable-length sequence to another.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-seq2seq":{"id":"tech-seq2seq","label":"Seq2Seq / Encoder–Decoder","englishLabel":"Sequence-to-Sequence Encoder–Decoder","summary":"An encoder reads the input sequence, and a decoder produces a variable-length output.","why":"Inputs and outputs in tasks such as translation have different lengths, so position-by-position classification cannot capture the full mapping.","mechanism":"The encoder forms a representation of the input, and a conditional decoder generates the target sequence step by step.","changed":"Unified translation, summarization, and question answering as conditional sequence generation.","limits":"Compressing the entire input into one vector creates a severe bottleneck for long sequences.","plainLanguage":"Translation is not word-for-word substitution, and inputs and outputs often differ in length. Seq2Seq first reads the whole input and then generates another sequence step by step, turning translation, summarization, and question answering into the same basic task format.","evidence":[{"title":"Sequence to Sequence Learning with Neural Networks","note":"Used an encoder and decoder to map variable-length sequences end to end."}],"actors":[{"name":"Google Brain / Ilya Sutskever, Oriol Vinyals & Quoc Le","role":"Originators","note":"They used an encoder to compress an input sequence into a state and a decoder to generate the output step by step, establishing the general sequence-to-sequence learning paradigm."}]},"problem-fixed-context":{"id":"problem-fixed-context","label":"单一上下文向量成为信息瓶颈","englishLabel":"Fixed-Context Bottleneck","summary":"Compressing a long input into a single vector causes substantial information loss.","why":"Compressing a long input into a single vector causes substantial information loss.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-attention":{"id":"tech-attention","label":"Attention / 注意力机制","englishLabel":"Attention","summary":"Lets the model directly retrieve the most relevant context positions at each step based on content.","why":"A fixed-length context vector cannot preserve all information from a long input.","mechanism":"Matches queries with keys to obtain weights, then uses those weights to aggregate values.","changed":"Turned context from a fixed compressed package into external memory that can be accessed on demand.","limits":"When paired with an RNN, it still has a sequential bottleneck; global attention also grows quadratically with sequence length.","plainLanguage":"Earlier models had to squeeze the entire input into a fixed-size memory. Attention lets the model look back at the most relevant positions for each generation step, like an on-demand index into the context.","evidence":[{"title":"Neural Machine Translation by Jointly Learning to Align and Translate","note":"Identified the fixed-length encoding vector as a bottleneck and let the decoder retrieve input positions on demand."}],"actors":[{"name":"Dzmitry Bahdanau, Kyunghyun Cho & Yoshua Bengio","role":"Originators","note":"They enabled the decoder to read input positions dynamically by content, breaking through the fixed-context-vector bottleneck."}]},"cap-flexible-context":{"id":"cap-flexible-context","label":"生成时可按内容查找上下文","englishLabel":"Content-Addressable Context","summary":"The model can read relevant positions directly instead of compressing the entire input into one vector.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-serial-recurrence":{"id":"problem-serial-recurrence","label":"循环计算难并行，长距离路径过长","englishLabel":"Serial Recurrence Bottleneck","summary":"Token-by-token recurrence limits training throughput and lengthens the path over which dependencies must propagate.","why":"Token-by-token recurrence limits training throughput and lengthens the path over which dependencies must propagate.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-transformer":{"id":"tech-transformer","label":"Transformer","englishLabel":"Transformer","summary":"Models general sequences entirely with self-attention and feed-forward layers.","why":"Recurrent networks are difficult to parallelize, and distant information must traverse long computational paths.","mechanism":"Multi-head self-attention directly connects any pair of tokens, positional encoding preserves order, and all positions can be trained in parallel.","changed":"Created a scalable shared backbone for language, multimodal, and generative models.","limits":"Standard attention is expensive for long contexts, and the architecture alone does not guarantee truthfulness, reasoning, or persistent memory.","plainLanguage":"Earlier sequence models had to compute one position after another, making training slow and distant information hard to connect. Transformer lets positions inspect one another directly and train in parallel, so it became the common backbone for language, multimodal, and generative models.","evidence":[{"title":"Attention Is All You Need","note":"Replaced recurrence and convolution with attention to enable parallel sequence modeling."}],"actors":[{"name":"Google Brain / Google Research","role":"Originators","note":"They replaced recurrence and convolution with self-attention, establishing a general sequence backbone that scales through parallel computation."}]},"cap-parallel-sequence":{"id":"cap-parallel-sequence","label":"序列可并行训练并建模远距离关系","englishLabel":"Parallel Long-Range Sequence Modeling","summary":"Any pair of tokens can connect through a short path, while training is no longer locked to sequential time steps.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-transferable-representation":{"id":"cap-transferable-representation","label":"跨任务可迁移的表征","englishLabel":"Transferable Representations","summary":"General representations learned from large-scale data without depending on a single labeling scheme.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-relational-data":{"id":"problem-relational-data","label":"关系数据不是规则网格或单一序列","englishLabel":"Relational & Graph-Structured Data","summary":"Molecules, knowledge graphs, and social networks require explicit representations of variable entities and relations.","why":"Molecules, knowledge graphs, and social networks require explicit representations of variable entities and relations.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-gnn":{"id":"tech-gnn","label":"GNN / 图神经网络","englishLabel":"Graph Neural Networks","summary":"Lets nodes exchange information along graph edges to learn from relational structure.","why":"Social networks, molecules, and knowledge graphs are neither regular grids nor single sequences.","mechanism":"Repeatedly aggregates messages from neighbors and updates representations for nodes, edges, or the whole graph.","changed":"Extended deep learning beyond Euclidean grids to relational data.","limits":"Deep message passing can over-smooth representations, while long-range relations, dynamic graphs, and causal explanations remain difficult.","plainLanguage":"For molecules, social networks, and knowledge graphs, the key question is who connects to whom. GNNs let neighboring nodes exchange information and learn from the relationship structure itself instead of forcing the data into a table or a single sequence.","evidence":[{"title":"Semi-Supervised Classification with Graph Convolutional Networks","note":"Extended local message aggregation to graph-structured data."}],"actors":[{"name":"Thomas Kipf & Max Welling","role":"Landmark Advance","note":"They formulated local neighbor aggregation as end-to-end trainable graph convolution layers, allowing relational structure to enter neural networks directly."}]},"cap-relational-representation":{"id":"cap-relational-representation","label":"从图结构中学习实体关系","englishLabel":"Learn from Graph-Structured Relations","summary":"The model can use who is connected to whom without flattening relations into a table or sequence.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-sparse-symbols":{"id":"problem-sparse-symbols","label":"离散符号缺乏连续相似结构","englishLabel":"Sparse Symbol Representation","summary":"One-hot representations cannot naturally express semantic similarity or compositional patterns.","why":"One-hot representations cannot naturally express semantic similarity or compositional patterns.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-embeddings":{"id":"tech-embeddings","label":"Embedding / 分布式表征","englishLabel":"Distributed Representations & Embeddings","summary":"Maps discrete symbols into learnable continuous vectors.","why":"One-hot symbols are mutually orthogonal and cannot express that “cat” is closer to “dog” than to “interest rate.”","mechanism":"Adjusts vectors from co-occurrence or task signals so that similar concepts lie closer together in geometric space.","changed":"Made semantic similarity, analogies, and transfer reusable by downstream models through vector operations.","limits":"A single static vector struggles with polysemy, compositional structure, and reference to the real world.","plainLanguage":"Machines originally treated every word as an unrelated ID. Embeddings place words in a learnable space, so “cat” naturally ends up closer to “dog” than to “interest rate.”","evidence":[{"title":"Efficient Estimation of Word Representations in Vector Space","note":"Showed how continuous word vectors and semantic structure can be learned efficiently from large-scale data."}],"actors":[{"name":"Google / Tomas Mikolov 团队","role":"Landmark Advance","note":"They used lightweight context-prediction objectives to learn word vectors from massive text corpora, making semantic relations appear at scale as computable geometric structure."}]},"problem-label-dependence":{"id":"problem-label-dependence","label":"监督标签昂贵且任务割裂","englishLabel":"Label Dependence","summary":"When each task is labeled and trained separately, knowledge is difficult to share.","why":"When each task is labeled and trained separately, knowledge is difficult to share.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-self-supervised":{"id":"tech-self-supervised","label":"Self-Supervised Learning / 自监督学习","englishLabel":"Self-Supervised Learning","summary":"Constructs training signals from the data itself, learning general representations before adapting to specific tasks.","why":"High-quality human labels are expensive, and each labeling scheme serves only a narrow set of tasks.","mechanism":"Masks data, predicts the future, reconstructs inputs, or contrasts different views to force the model to extract stable structure.","changed":"Turned vast amounts of unlabeled text, images, and audio into usable training resources.","limits":"Pretraining objectives are proxy tasks; the correlations they teach may not support action, causality, or reliable reasoning.","plainLanguage":"Human labels are expensive, and one set of labels usually serves only one task. Self-supervised learning creates questions from the data itself—for example, hiding part of an input and asking the model to recover it—so the model can learn general abilities before adapting to a task.","evidence":[{"title":"Representation Learning with Contrastive Predictive Coding","note":"CPC learned transferable representations from unlabeled sequences by predicting future latent representations with a contrastive objective."},{"title":"BERT: Pre-training of Deep Bidirectional Transformers","note":"Used a masking objective to learn bidirectional contextual representations."},{"title":"A Simple Framework for Contrastive Learning of Visual Representations","note":"SimCLR directly demonstrated the core mechanism and value of contrastive self-supervised learning for visual representations."}],"actors":[{"name":"DeepMind","role":"Key Advance","note":"CPC created self-supervised signals by predicting future latent representations, showing that models can learn transferable representations directly from raw sequences across modalities."},{"name":"Google Research","role":"Scaled Practice","note":"SimCLR systematically showed how data augmentation, a contrastive objective, and large-batch training can bring unlabeled visual representations close to supervised performance."}]},"tech-masked-modeling":{"id":"tech-masked-modeling","label":"BERT 路线 / Masked Modeling","englishLabel":"Masked Modeling","summary":"Masks part of an input and reconstructs it using bidirectional context.","why":"Unidirectional language modeling cannot use information on both sides of a target word at the same time.","mechanism":"Randomly masks tokens or image patches, then predicts the hidden content or its representation.","changed":"Created bidirectional pretrained representations well suited to classification, extraction, and understanding tasks.","limits":"The model sees mask tokens during pretraining but not downstream, and the objective is not naturally suited to open-ended step-by-step generation.","plainLanguage":"The BERT approach is like a fill-in-the-blank exercise: hide part of a sentence or image, then use the surrounding context to reconstruct it. The resulting representations are especially useful for understanding, classification, and extraction tasks.","evidence":[{"title":"BERT: Pre-training of Deep Bidirectional Transformers","note":"Used a masking objective to learn bidirectional contextual representations."}],"actors":[{"name":"Google Research","role":"Originator and Scaled Practice","note":"BERT masked a subset of tokens and learned to recover them, enabling bidirectional Transformers to pretrain general language representations on unlabeled text."}]},"tech-autoregressive-pretraining":{"id":"tech-autoregressive-pretraining","label":"GPT 路线 / Autoregressive Pretraining","englishLabel":"Autoregressive Pretraining","summary":"Learns language distributions and generation by repeatedly predicting the next token.","why":"A unified objective was needed that could scale over unlabeled text while remaining aligned with generation tasks.","mechanism":"Factorizes sequence probability in causal order and predicts the next token from the preceding context.","changed":"Enabled one model to perform continuation, question answering, and multitask transfer through prompting.","limits":"Token-by-token generation is sequential and can accumulate errors; predicting fluent text does not guarantee factual accuracy.","plainLanguage":"The GPT approach trains on one simple task that can scale almost without limit: predict the next piece of information from the preceding text. At sufficient scale, the same model can continue text, answer questions, and adapt to many tasks through prompting.","evidence":[{"title":"Improving Language Understanding by Generative Pre-Training","note":"GPT-1 established the path of pretraining an autoregressive Transformer language model and then transferring it across tasks."}],"actors":[{"name":"OpenAI","role":"Landmark Advance","note":"GPT connected large-scale next-token prediction with downstream task fine-tuning, establishing autoregressive pretraining as a general capability foundation."}]},"cap-foundation-representation":{"id":"cap-foundation-representation","label":"一次预训练，可迁移到多种任务","englishLabel":"Pretrain Once, Adapt Broadly","summary":"The same foundation representation can serve different tasks through prompting, fine-tuning or lightweight adaptation.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-modality-silos":{"id":"problem-modality-silos","label":"语言、视觉与声音表征彼此割裂","englishLabel":"Modality Silos","summary":"Single-modality models struggle to benefit from the open vocabulary of language or knowledge from other modalities.","why":"Single-modality models struggle to benefit from the open vocabulary of language or knowledge from other modalities.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-contrastive-learning":{"id":"tech-contrastive-learning","label":"Contrastive Learning / 对比学习","englishLabel":"Contrastive Learning","summary":"Learn label-free representations by pulling positive pairs together and pushing negative pairs apart.","why":"Reconstructing every pixel or word can waste capacity on irrelevant detail, while human-defined classes are too narrow.","mechanism":"Construct different views of the same object or matched cross-modal samples, then train encoders using relative similarity.","changed":"Representations became invariant to data augmentation and useful for few-shot transfer and cross-modal retrieval.","limits":"Results depend heavily on how positive and negative pairs are defined, and similarity spaces may miss fine-grained structure and causal differences.","plainLanguage":"Contrastive learning does not ask a model to reproduce every detail. It teaches the model which examples are effectively the same thing and which are not, producing representations that transfer more easily and can connect images with language.","evidence":[{"title":"A Simple Framework for Contrastive Learning of Visual Representations","note":"SimCLR directly established the core mechanism and value of contrastive self-supervised learning for visual representations."}],"actors":[{"name":"Google Research","role":"Landmark advance","note":"SimCLR treated different augmentations of one image as positive pairs and other images as negatives, creating a clear and reusable recipe for visual contrastive learning."}]},"tech-clip":{"id":"tech-clip","label":"CLIP / 视觉—语言对比预训练","englishLabel":"Contrastive Language–Image Pretraining","summary":"Learn a shared semantic space from massive image–text pairs instead of learning only a fixed set of visual classes.","why":"Human-labeled classes are closed and expensive, so they cannot cover concepts that continually appear in the open world.","mechanism":"Pull matched image and text vectors together, push mismatched pairs apart, and use text prompts as dynamic classifiers.","changed":"Gave visual models zero-shot classification, open-vocabulary recognition and cross-modal retrieval capabilities.","limits":"Image–text co-occurrence is not fine-grained visual understanding; data bias and weak spatial reasoning remain significant.","plainLanguage":"CLIP learns whether an image matches a piece of text from huge numbers of image–caption pairs. New visual categories can then be described in language instead of requiring a fresh fixed-label dataset each time.","evidence":[{"title":"Learning Transferable Visual Models From Natural Language Supervision","note":"Image–text contrastive pretraining produced open-vocabulary transfer for visual models."}],"actors":[{"name":"OpenAI","role":"Proponent","note":"OpenAI used massive image–text pairs to learn open-vocabulary visual representations, making language an interface to vision."}]},"cap-open-vocabulary":{"id":"cap-open-vocabulary","label":"识别训练标签之外的开放概念","englishLabel":"Open-Vocabulary Recognition","summary":"Language semantics let a vision system handle concepts outside its fixed training label set.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-multimodal-foundation":{"id":"tech-multimodal-foundation","label":"VLM / 多模态基础模型","englishLabel":"Vision-Language & Multimodal Foundation Models","summary":"Connect language, images, audio and other modalities in one model.","why":"Training each modality separately creates semantic silos that cannot naturally share knowledge and capabilities.","mechanism":"Fuse multimodal representations through shared token spaces, cross-attention, alignment losses or joint generative objectives.","changed":"Models could see, hear, read, generate and answer questions about the same concept.","limits":"Alignment often remains based on co-occurrence, with limited spatial relations, physical causality and action feedback.","plainLanguage":"Seeing images, hearing sounds and reading text once required separate models. Multimodal foundation models connect them through a shared semantic and generative interface, so one model can see, hear, read and answer about the same thing.","evidence":[{"title":"On the Opportunities and Risks of Foundation Models","note":"The report defines the foundation-model paradigm of large-scale pretraining and cross-task adaptation, together with its systemic risks."},{"title":"Flamingo: a Visual Language Model for Few-Shot Learning","note":"Flamingo directly demonstrated the paradigm of combining a pretrained vision encoder with a large language model to form a multitask VLM."}],"actors":[{"name":"Google DeepMind","role":"Scaling advance","note":"Flamingo connected a pretrained language model to images and video through a vision encoder and cross-attention, demonstrating few-shot multimodal learning."}]},"problem-passive-multimodal":{"id":"problem-passive-multimodal","label":"多模态理解仍以被动观察为主","englishLabel":"Passive Multimodal Understanding","summary":"Recognizing and describing the world is not the same as understanding how actions will change it.","why":"Recognizing and describing the world is not the same as understanding how actions will change it.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-generative-modeling":{"id":"cap-generative-modeling","label":"复杂数据分布的学习与生成","englishLabel":"Generative Modeling","summary":"Learn the overall structure of complex data and generate new images, audio, text, video and structured objects.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-density-modeling":{"id":"problem-density-modeling","label":"高维分布难以显式建模和采样","englishLabel":"High-Dimensional Density Modeling","summary":"Real data has high-dimensional, multimodal and strongly correlated structure.","why":"Real data has high-dimensional, multimodal and strongly correlated structure.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-autoregressive-generation":{"id":"tech-autoregressive-generation","label":"Autoregressive Generation / 自回归生成","englishLabel":"Autoregressive Generation","summary":"Decompose a complex distribution into conditional probabilities that predict the next element in sequence.","why":"A high-dimensional joint distribution is difficult to describe directly, while neural networks can learn conditional probabilities.","mechanism":"Sample one token or pixel at a time in a fixed order, conditioning every step on earlier outputs.","changed":"Provided stable likelihood-based training and became the main architecture for modern language generation.","limits":"Sampling cannot be fully parallelized, and ordering bias and early errors affect later outputs.","plainLanguage":"Complex content is difficult to generate all at once, so autoregressive models break it into the question ‘what comes next?’ and continue step by step. Training is stable and broadly useful, but generation is sequential and early mistakes can propagate.","evidence":[{"title":"Pixel Recurrent Neural Networks","note":"PixelRNN explicitly decomposed image distributions into per-pixel conditional probabilities, directly supporting autoregressive generation as a cross-modal backbone."},{"title":"Improving Language Understanding by Generative Pre-Training","note":"GPT-1 established the route of pretraining an autoregressive Transformer language model and then transferring it across tasks."}],"actors":[{"name":"DeepMind","role":"Visual-generation advance","note":"PixelRNN generated image pixels one conditional probability at a time, showing that autoregressive factorization could model images precisely as well as language."}]},"tech-vae":{"id":"tech-vae","label":"VAE / 变分自编码器","englishLabel":"Variational Autoencoder","summary":"Learn a sampleable data-generating model in a continuous latent space.","why":"The posterior distribution of a complex latent-variable model is usually intractable.","mechanism":"An encoder approximates the posterior, a decoder generates the data, and reparameterization jointly optimizes reconstruction and a prior constraint.","changed":"Made latent-space interpolation, compressed representations and principled generative training practical.","limits":"Simple likelihood assumptions often produce blurry samples, and a powerful decoder may ignore the latent variables.","plainLanguage":"A VAE compresses complex data into a continuous internal space, then samples from that space and reconstructs the data. It gives interpolation and controllable generation a principled basis, but early results were often blurrier than GAN outputs.","evidence":[{"title":"Auto-Encoding Variational Bayes","note":"The work learns a continuous latent-variable generative model through variational inference."}],"actors":[{"name":"Diederik Kingma & Max Welling","role":"Proponents","note":"They jointly trained inference and generative networks for a latent-variable model, using reparameterization to backpropagate through stochastic latent variables."}]},"tech-gan":{"id":"tech-gan","label":"GAN / 生成对抗网络","englishLabel":"Generative Adversarial Network","summary":"Pit a generator against a discriminator to learn realistic samples directly.","why":"Explicit likelihoods are often difficult to formulate or produce conservative, blurry samples.","mechanism":"A discriminator learns to distinguish real samples from generated ones, while the generator learns to fool it through alternating optimization.","changed":"Sharply improved image-generation fidelity and advanced implicit generation without an explicit likelihood.","limits":"Training can be unstable and suffer mode collapse, while distribution coverage and evaluation are difficult to guarantee.","plainLanguage":"A GAN assigns one model to create fakes and another to detect them, so both improve through competition. This once produced much sharper images, but training can become unbalanced and the generator may learn only a narrow set of outputs.","evidence":[{"title":"Generative Adversarial Nets","note":"A generator and discriminator learn the data distribution through adversarial training."}],"actors":[{"name":"Ian Goodfellow 等","role":"Proponents","note":"They learned a data distribution by training a generator and discriminator against each other."}]},"tech-normalizing-flows":{"id":"tech-normalizing-flows","label":"Normalizing Flows / 归一化流","englishLabel":"Normalizing Flows","summary":"Map a simple distribution into a complex one through a sequence of invertible transformations.","why":"Generative models sought to combine exact likelihoods, invertible inference and high-quality sampling.","mechanism":"Track probability density through the change-of-variables formula, allowing exact computation in both forward and reverse directions.","changed":"Provided a rigorous, unified framework for density estimation and invertible representations.","limits":"Invertibility restricts network design, while Jacobian computation and scaling to high dimensions are costly.","plainLanguage":"Normalizing flows use a chain of reversible steps to turn simple random numbers into complex data. They can generate in one direction and compute exact probabilities in the other, but the need for reversibility limits model design.","evidence":[{"title":"Variational Inference with Normalizing Flows","note":"This classic work on modern normalizing flows transforms a simple distribution into a complex one through a sequence of invertible mappings."}],"actors":[{"name":"Danilo Rezende & Shakir Mohamed / DeepMind","role":"Key advance","note":"They progressively transformed simple distributions into complex ones through a sequence of invertible mappings while preserving exact density computation."}]},"cap-neural-generation":{"id":"cap-neural-generation","label":"可从数据学习如何生成","englishLabel":"Learn to Generate from Data","summary":"Models can learn complex data distributions instead of relying on hand-written generation rules.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-generative-tradeoff":{"id":"problem-generative-tradeoff","label":"质量、覆盖、稳定性与可控性难兼得","englishLabel":"Generative Modeling Trade-offs","summary":"GANs can be unstable and collapse modes, VAEs tend to blur outputs, and autoregressive generation is sequential.","why":"GANs can be unstable and collapse modes, VAEs tend to blur outputs, and autoregressive generation is sequential.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-diffusion":{"id":"tech-diffusion","label":"Diffusion Models / 扩散模型","englishLabel":"Diffusion & Score-Based Models","summary":"Learn to reverse a process that gradually adds noise, recovering data from noise.","why":"GANs are difficult to train and can miss modes of the distribution, creating demand for a more stable objective with better coverage.","mechanism":"Train a denoiser or score function, then sample through a multi-step reverse stochastic process.","changed":"Combined stable training, high fidelity and flexible conditioning, becoming a main architecture for image generation.","limits":"Pixel-space training is expensive, sampling usually takes many steps, and generation does not automatically confer world understanding.","plainLanguage":"A diffusion model gradually adds noise to data and then learns how to reverse the process into content. It is easier to train reliably and control than a GAN, but repeated denoising usually makes generation slower.","evidence":[{"title":"Denoising Diffusion Probabilistic Models","note":"The work achieves high-quality generation through iterative denoising."}],"actors":[{"name":"Jonathan Ho, Ajay Jain & Pieter Abbeel","role":"Landmark advance","note":"DDPM made iterative denoising a stable, high-quality modern generative backbone."}]},"cap-high-fidelity-generation":{"id":"cap-high-fidelity-generation","label":"可生成高质量且受条件控制的内容","englishLabel":"High-Fidelity Controllable Generation","summary":"Text, class labels or reference inputs can reliably guide high-fidelity generation.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-pixel-diffusion-cost":{"id":"problem-pixel-diffusion-cost","label":"像素空间训练与多步采样昂贵","englishLabel":"Pixel-Space Diffusion Cost","summary":"High-resolution generation requires substantial computation and introduces high latency.","why":"High-resolution generation requires substantial computation and introduces high latency.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-latent-diffusion":{"id":"tech-latent-diffusion","label":"Latent Diffusion / 潜空间扩散","englishLabel":"Latent Diffusion","summary":"Compress an image first, then run diffusion in a lower-dimensional latent space.","why":"Denoising high-resolution pixels directly spends large amounts of compute on perceptually unimportant detail.","mechanism":"Use an autoencoder to create a perceptually compressed space, model only the latent variables with diffusion, then decode the result.","changed":"Greatly reduced the training and inference cost of high-resolution text-to-image generation.","limits":"The compressor can lose detail and introduce artifacts, while the cost of multi-step sampling remains.","plainLanguage":"Repeatedly denoising high-resolution pixels is expensive. Latent diffusion first compresses the image, then generates in a smaller internal space, sharply reducing the cost of high-quality text-to-image generation.","evidence":[{"title":"High-Resolution Image Synthesis with Latent Diffusion Models","note":"Moving diffusion into a compressed latent space substantially reduced the cost of high-resolution generation."}],"actors":[{"name":"CompVis / LMU Munich","role":"Proponent","note":"The team moved diffusion into a compressed latent space, substantially reducing the cost of high-resolution generation."}]},"tech-dit":{"id":"tech-dit","label":"DiT / Diffusion Transformer","englishLabel":"Diffusion Transformer","summary":"Use a Transformer as the denoising backbone for latent diffusion.","why":"The convolutional structure of U-Nets did not align with the scaling infrastructure developed for large language models.","mechanism":"Split latents into patch tokens and use a Transformer conditioned on the timestep and other information to predict the denoising direction.","changed":"Gave diffusion models a clear path for scaling depth, width and compute.","limits":"Attention is expensive, and scaling still depends on massive high-quality datasets and faster sampling.","plainLanguage":"DiT replaces the image-processing backbone inside a diffusion model with a Transformer. This lets generative models reuse the scaling methods and training infrastructure developed for large models more directly.","evidence":[{"title":"Scalable Diffusion Models with Transformers","note":"The work replaced the U-Net with a Transformer and demonstrated scaling behavior in diffusion models."}],"actors":[{"name":"William Peebles & Saining Xie","role":"Proponents","note":"They replaced the U-Net backbone commonly used in diffusion models with a Transformer and showed that increased model compute reliably improved generation quality."}]},"tech-flow-matching":{"id":"tech-flow-matching","label":"Flow Matching / 流匹配","englishLabel":"Flow Matching","summary":"Learns a deterministic velocity field that continuously transports noise into data.","why":"The stochastic paths and many-step numerical solvers used by diffusion can add training or sampling overhead.","mechanism":"It chooses a probability path in advance and directly regresses the conditional velocity vector field at each point along that path.","changed":"It unifies several continuous generative paths and supports efficient sampling with ordinary differential equations.","limits":"Performance depends on the path and solver design, with remaining tradeoffs for few-step generation, high dimensions and discrete data.","plainLanguage":"Diffusion often follows a winding path of repeated denoising. Flow matching instead learns which direction data should move at each point on the way from noise to a finished sample, offering a more unified continuous-generation route that may require fewer steps.","evidence":[{"title":"Flow Matching for Generative Modeling","note":"It directly regresses the velocity field of a probability path, unifying the training of continuous normalizing flows."}],"actors":[{"name":"Meta AI & Weizmann Institute","role":"Originators","note":"They directly connected a simple distribution to the data distribution through a learned velocity field, establishing a more unified method for training continuous generative models."},{"name":"Physical Intelligence","role":"Robotics implementation","note":"π0 uses flow matching to generate continuous action chunks, showing that the mechanism also applies to dexterous robot control."},{"name":"Black Forest Labs","role":"Company approach","note":"FLUX.2 explicitly uses latent flow matching: it learns a continuous flow in a compressed latent space and uses a rectified-flow Transformer for both image generation and editing."}]},"cap-scalable-generative":{"id":"cap-scalable-generative","label":"同一生成骨干可扩展到多种模态","englishLabel":"Scalable Generative Backbone","summary":"Transformers and continuous generative objectives can be reused across image, video, audio and other modalities.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-video-generation":{"id":"tech-video-generation","label":"Video Generation / 视频生成模型","englishLabel":"Video Generative Models","summary":"Jointly generates visually continuous sequences that change over time.","why":"Unlike single-image generation, video generation must preserve object identity, motion and long-range event consistency.","mechanism":"It adds temporal attention, spatiotemporal latents or hierarchical motion modeling to a spatial generative backbone.","changed":"Models began to learn dynamic visual regularities and became a generative foundation for some interactive world models.","limits":"Long-term consistency, controllable cameras, physical causality and realistic responses to actions remain unreliable.","plainLanguage":"A single image only needs to look convincing. A video must also keep people, objects and motion consistent over time. Video models are beginning to learn dynamic visual patterns, but long-term consistency and realistic physics remain unreliable.","evidence":[{"title":"Video Diffusion Models","note":"It extended image diffusion naturally to spatiotemporal data and demonstrated conditional video generation."}],"actors":[{"name":"Google Research","role":"Landmark advance","note":"It extended image diffusion across the time dimension and generated continuous video with factorized spatiotemporal networks, helping establish the modern video-diffusion route."}]},"tech-diffusion-language":{"id":"tech-diffusion-language","label":"Diffusion Language Models / 扩散语言模型","englishLabel":"Diffusion Language Models","summary":"Generates text in parallel through iterative denoising or revision rather than strictly from left to right.","why":"Autoregressive language inference is sequential, and early tokens are difficult to revise globally once generated.","mechanism":"It starts from a masked or noisy discrete sequence, then predicts and corrects tokens in parallel over multiple rounds.","changed":"It introduced a new route to parallel generation, global editing and controllable inference.","limits":"Training, length control and generation quality in discrete diffusion have not yet consistently surpassed mainstream autoregressive approaches.","plainLanguage":"Conventional language models write from left to right, making early mistakes hard to revise. Diffusion language models try to begin with an incomplete draft and improve many tokens in parallel, offering another route to faster generation and global editing.","evidence":[{"title":"Structured Denoising Diffusion Models in Discrete State-Spaces","note":"D3PM extended denoising diffusion directly to discrete state spaces and validated it on text."}],"actors":[{"name":"Google Research","role":"Key advance","note":"D3PM recast continuous Gaussian denoising as discrete-state transitions, allowing diffusion training to cover text, graphs and other discrete data."}]},"problem-generative-grounding":{"id":"problem-generative-grounding","label":"生成逼真不等于理解可行动世界","englishLabel":"Generation–Understanding Gap","summary":"Photorealistic output may still lack persistent objects, causal dynamics and sensitivity to action.","why":"Photorealistic output may still lack persistent objects, causal dynamics and sensitivity to action.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-general-foundation-model":{"id":"cap-general-foundation-model","label":"广泛知识与上下文适应","englishLabel":"General Foundation Model Capability","summary":"A single model works across many tasks through prompting, context or limited adaptation.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-task-specific-models":{"id":"problem-task-specific-models","label":"每个任务单独建模，能力无法复用","englishLabel":"Task-Specific Model Fragmentation","summary":"Specialized models isolate and duplicate data, knowledge and engineering within each task.","why":"Specialized models isolate and duplicate data, knowledge and engineering within each task.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-foundation-models":{"id":"tech-foundation-models","label":"Foundation Models / 基础模型","englishLabel":"Foundation Models","summary":"A shared model base pretrained at scale on broad data, then adapted to many downstream tasks.","why":"Training each task from scratch prevented the reuse of data, knowledge and engineering capability.","mechanism":"A large model is pretrained with a unified self-supervised objective, then adapted to specific settings through prompting, fine-tuning or retrieval.","changed":"Models shifted from single-task components to general capability platforms that support entire ecosystems.","limits":"Capabilities and risks become concentrated, creating systemic externalities in training data, evaluation, deployment and governance.","plainLanguage":"Previously, each task often required its own model, making data and knowledge difficult to reuse. A foundation model first learns a shared base from broad data, then serves many tasks through prompting, fine-tuning or retrieval.","evidence":[{"title":"On the Opportunities and Risks of Foundation Models","note":"It defined the foundation-model paradigm of large-scale pretraining and cross-task adaptation, together with its systemic risks."}],"actors":[{"name":"Stanford CRFM","role":"Concept origin and systematization","note":"It introduced Foundation Model as a unifying concept, emphasizing that the same large pretrained model becomes a shared base—and a shared source of risk—for many downstream systems."}]},"tech-scaling-laws":{"id":"tech-scaling-laws","label":"Scaling Laws / 规模定律","englishLabel":"Scaling Laws & Compute-Optimal Training","summary":"Describes predictable power-law relationships among model size, data, compute and loss.","why":"Large-model training is expensive, so teams need to know where additional resources will have the greatest effect.","mechanism":"Empirical laws are fitted across model sizes, data volumes and compute budgets, then used to allocate training resources.","changed":"Expected gains could be estimated before training, shifting research from trial-and-error engineering toward planning at scale.","limits":"The laws depend on the data, architecture and objective distribution; lower loss does not guarantee that reliable capabilities grow at the same rate.","plainLanguage":"Training a large model is too expensive to rely entirely on trial and error. Scaling laws estimate how loss is likely to change as model size, data and compute increase, helping teams plan training resources in advance.","evidence":[{"title":"Scaling Laws for Neural Language Models","note":"It systematically characterized power-law relationships between loss and model size, dataset size and compute."},{"title":"Training Compute-Optimal Large Language Models","note":"It showed that model size and training tokens should scale together as compute increases."}],"actors":[{"name":"OpenAI","role":"Originator","note":"It systematically measured empirical power laws governing how language-model loss changes with model, data and compute scale."},{"name":"Google DeepMind","role":"Key correction","note":"Chinchilla further showed that, under a fixed compute budget, parameter count and training tokens should be scaled together."}]},"cap-predictable-scaling":{"id":"cap-predictable-scaling","label":"资源投入与模型收益可以预估","englishLabel":"Predictable Scaling","summary":"Empirical relationships among model size, data and compute budgets can guide training plans.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-dense-compute":{"id":"problem-dense-compute","label":"稠密模型每次计算激活全部参数","englishLabel":"Dense Compute Bottleneck","summary":"Increasing total capacity also raises the training and inference cost of every token.","why":"Increasing total capacity also raises the training and inference cost of every token.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-moe":{"id":"tech-moe","label":"MoE / Mixture of Experts","englishLabel":"Mixture of Experts","summary":"Activates only a small set of expert networks for each token, increasing model capacity through sparse computation.","why":"Dense models use every parameter on each pass, tying total capacity to the cost of each inference step.","mechanism":"A router selects the top-k experts for each token, while the remaining experts do not participate in that forward pass.","changed":"Total parameter count can grow far beyond the amount of computation actually used per token.","limits":"Routing and load balancing are complex, communication is costly, and experts do not always develop stable specializations.","plainLanguage":"A dense model uses all its parameters every time, so greater capacity means greater compute. MoE assigns each input to only a few experts, allowing total parameters to keep growing while each token uses only a small fraction of them.","evidence":[{"title":"Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer","note":"Modern sparse MoE had already demonstrated conditional computation and very large capacity before the Transformer foundation-model era."},{"title":"Switch Transformers","note":"It used sparse routing to expand parameter capacity while controlling computation per token."}],"actors":[{"name":"Google Brain","role":"Landmark advance","note":"Switch Transformer showed that sparse routing can expand parameter capacity while controlling per-token computation."},{"name":"Mistral AI","role":"Company approach","note":"At each layer, Mixtral routes every token to 2 of 8 feed-forward experts, giving a 46.7B-total-parameter model the active compute of roughly 12.9B parameters."},{"name":"DeepSeek","role":"Company approach","note":"DeepSeek-V2 uses more finely grained routed experts and shared experts to improve specialization while expanding total capacity without proportionally increasing active compute per token."}]},"problem-context-complexity":{"id":"problem-context-complexity","label":"注意力成本随上下文快速增长","englishLabel":"Long-Context Cost","summary":"Standard full attention creates memory and compute bottlenecks on long sequences.","why":"Standard full attention creates memory and compute bottlenecks on long sequences.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-ssm":{"id":"tech-ssm","label":"SSM / 状态空间模型","englishLabel":"State Space Models","summary":"Compresses sequence history into a recurrent state and processes long sequences at near-linear cost.","why":"The compute and memory requirements of standard global attention grow quadratically with context length.","mechanism":"Structured state updates carry history forward; selective SSMs make the update parameters depend on the current input.","changed":"Long-sequence modeling gained a high-throughput, low-cache backbone that does not rely on attention.","limits":"A compressed state can lose precise recall of earlier positions, while the ecosystem and cross-task evidence remain less mature than those of Transformers.","plainLanguage":"Attention becomes increasingly expensive as context grows. An SSM instead compresses the past into a continuously updated state, making long sequences cheaper to process, though it may recall a specific earlier position less precisely than attention.","evidence":[{"title":"Mamba: Linear-Time Sequence Modeling with Selective State Spaces","note":"Selective state-space models process content-dependent information with linear sequence complexity."}],"actors":[{"name":"Albert Gu & Tri Dao","role":"Originators","note":"Mamba made state-space parameters input-dependent and paired them with hardware-aware scans, enabling content-selective memory with linear scaling in sequence length."}]},"tech-hybrid-architectures":{"id":"tech-hybrid-architectures","label":"Attention–SSM Hybrids / 混合架构","englishLabel":"Hybrid Attention–SSM Architectures","summary":"Combines the precise content retrieval of attention with the linear long-range memory of SSMs in one model.","why":"Pure attention is expensive, while pure state compression can be weaker on tasks that require precise token-to-token interaction.","mechanism":"Attention and SSM modules alternate across layers or blocks, often with MoE added as well.","changed":"Models can strike new balances among quality, context length, throughput and memory for a given task.","limits":"The design space has not converged, and end-to-end gains depend on hardware, training recipes and the workload.","plainLanguage":"Attention is good at precise lookup, while SSMs retain long histories at lower cost. Hybrid architectures place both in the same model to seek a better balance among quality, speed and context length.","evidence":[{"title":"Jamba: A Hybrid Transformer-Mamba Language Model","note":"It demonstrated an architecture combining attention, SSMs and MoE."}],"actors":[{"name":"AI21 Labs","role":"Company approach","note":"Jamba interleaves Transformer, Mamba and MoE modules to preserve global retrieval quality while reducing memory and inference costs for long contexts."}]},"problem-objective-intent-gap":{"id":"problem-objective-intent-gap","label":"下一个 token 目标不等于用户意图","englishLabel":"Objective–Intent Gap","summary":"A pretrained model can continue text without necessarily understanding instructions, preferences or behavioral boundaries.","why":"A pretrained model can continue text without necessarily understanding instructions, preferences or behavioral boundaries.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-instruction-tuning":{"id":"tech-instruction-tuning","label":"Instruction Tuning / 指令微调","englishLabel":"Instruction Tuning","summary":"Uses instruction–response data to turn a foundation model into an assistant that understands task intent.","why":"Next-token pretraining learns broad knowledge but does not ensure that the model organizes and executes a task as the user requests.","mechanism":"The model is supervised-fine-tuned on multitask natural-language instruction data, making task descriptions a unified interface.","changed":"Users no longer need to train a new model for every task; natural language can transfer the model to unseen instructions.","limits":"Behavior is constrained by the coverage of demonstration data, and the model may learn response formats rather than the underlying goal.","plainLanguage":"A model trained only to predict the next token does not necessarily know what the user wants it to do. Instruction tuning uses many request–response examples to teach the model to treat natural-language requests as task interfaces.","evidence":[{"title":"Training Language Models to Follow Instructions with Human Feedback","note":"Instruction tuning and human feedback turned language models into more useful assistants."}],"actors":[{"name":"OpenAI","role":"Landmark advance","note":"InstructGPT used demonstrations and human preferences to turn a continuation model into a more useful instruction-following assistant."}]},"tech-rlhf":{"id":"tech-rlhf","label":"RLHF / 人类反馈强化学习","englishLabel":"Reinforcement Learning from Human Feedback","summary":"Trains a reward model from human preferences, then optimizes the language model's behavior against that reward.","why":"Supervised demonstrations cannot enumerate every good answer or directly express multidimensional subjective preferences.","mechanism":"People compare responses, those comparisons train a reward model, and reinforcement learning then improves the policy's reward.","changed":"Models became better aligned with human preferences for helpfulness, safety and interactive usability.","limits":"Feedback is expensive and biased, reward models can be gamed, and the optimization pipeline is complex.","plainLanguage":"Some qualities are hard to express as a single correct answer, but people can compare two responses and say which is better. RLHF turns those comparisons into a reward and trains the model to better match human expectations.","evidence":[{"title":"Training Language Models to Follow Instructions with Human Feedback","note":"Instruction tuning and human feedback turned language models into more useful assistants."}],"actors":[{"name":"OpenAI","role":"Landmark advance","note":"It trained human preferences into a reward signal, then used reinforcement learning to adjust model behavior."}]},"tech-dpo":{"id":"tech-dpo","label":"DPO / Direct Preference Optimization","englishLabel":"Direct Preference Optimization","summary":"Optimizes a language model directly from preference pairs, without training a separate reward model and running online RL.","why":"The classic RLHF pipeline uses multiple models and an unstable reinforcement-learning stage.","mechanism":"It rewrites preference probabilities and a reference-policy constraint as a classification-style loss.","changed":"Preference alignment became simpler to engineer and more stable to train.","limits":"It remains limited by preference data and offline coverage, and does not remove objective misalignment or overoptimization.","plainLanguage":"Classic RLHF requires a reward model followed by reinforcement learning, making the pipeline complex. DPO adjusts the model directly from paired examples of which answer is preferred, making preference training simpler and more stable.","evidence":[{"title":"Direct Preference Optimization","note":"It recast preference optimization as a stable classification-style objective, without an explicit reward model or online RL."}],"actors":[{"name":"Stanford University","role":"Originator","note":"It reformulated preference optimization as a direct classification objective, eliminating the explicit reward model and online RL."}]},"cap-instruction-following":{"id":"cap-instruction-following","label":"模型能按自然语言意图完成任务","englishLabel":"Instruction Following","summary":"Natural-language instructions become a unified interface for invoking a foundation model across tasks.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-alignment-generalization":{"id":"problem-alignment-generalization","label":"偏好代理会被投机，开放情境难覆盖","englishLabel":"Alignment Generalization","summary":"Static preference data cannot cover new tasks, long-horizon behavior, or out-of-distribution risks.","why":"Static preference data cannot cover new tasks, long-horizon behavior, or out-of-distribution risks.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-reliable-reasoning":{"id":"cap-reliable-reasoning","label":"可靠的复杂推理","englishLabel":"Reliable Complex Reasoning","summary":"Produces inspectable, searchable multi-step reasoning for mathematics, code, and open-ended problems.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-single-pass-reasoning":{"id":"problem-
