nsive, may overfit benchmarks, and still relies on people to define the search space and objective.","plainLanguage":"There are too many combinations of model architectures and training settings to test one by one. AutoML and NAS let a machine propose, train and filter candidate designs within a predefined space.","evidence":[{"title":"Neural Architecture Search with Reinforcement Learning","note":"The work uses a learned controller to search neural network architectures automatically."}],"actors":[{"name":"Google Brain","role":"Landmark advance","note":"A controller generated neural network architectures and received rewards from validation performance, turning architecture design into an automated search problem."}]},"tech-evolutionary-search":{"id":"tech-evolutionary-search","label":"Evolutionary & Open-Ended Search / 开放式进化搜索","englishLabel":"Evolutionary and Open-Ended Search","summary":"Let candidate solutions, tasks or environments continually produce novelty through variation and selection.","why":"Fixed tasks and a single score can trap optimization in local optima and prevent the continuing creation of new capabilities.","mechanism":"Maintain diverse populations, alternate between generating harder environments and stronger solutions, and select by fitness or novelty.","changed":"Search could discover problems and solutions together rather than optimizing only a predefined answer.","limits":"Resource use is enormous, progress is hard to measure, and novelty does not guarantee usefulness or safety.","plainLanguage":"Optimization focused on one fixed score tends to converge on one kind of solution. Open-ended evolutionary search preserves diversity and lets tasks, environments and solutions change together, continually exploring new directions.","evidence":[{"title":"POET: Paired Open-Ended Trailblazer","note":"POET jointly generates environments and solutions, representing open-ended evolutionary search."}],"actors":[{"name":"Sakana AI","role":"Frontier advance","note":"Sakana AI uses candidate archives, variation and external evaluation to maintain diverse improvement paths instead of climbing a single gradient."}]},"cap-automated-design":{"id":"cap-automated-design","label":"机器可提出并筛选模型设计","englishLabel":"Automated Design Search","summary":"A system can automate architecture and hyperparameter experiments within a defined search space.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-proxy-evaluation":{"id":"problem-proxy-evaluation","label":"自动搜索受限于可计算代理指标","englishLabel":"Proxy Evaluation Ceiling","summary":"Without a trustworthy evaluator, automated experimentation only optimizes the wrong objective faster.","why":"Without a trustworthy evaluator, automated experimentation only optimizes the wrong objective faster.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-verifiable-self-play":{"id":"tech-verifiable-self-play","label":"Verifiable Self-Play / 可验证自生成课程","englishLabel":"Verifiable Self-Play and Curriculum","summary":"Let a system generate increasingly difficult tasks and training data whose outcomes can still be verified.","why":"Human-created problem sets are limited, and pure imitation cannot keep pushing a model beyond the demonstration distribution.","mechanism":"A proposer, solver and verifier interact in a loop, retaining examples that add information and can be judged automatically.","changed":"Training curricula could grow with model capability, reducing dependence on static human-generated data.","limits":"The approach is reliable only in closed domains with explicit rules; generated tasks may be narrow, exploitable or misaligned with real value.","plainLanguage":"Human problem sets eventually run out, so the system creates harder problems that can still be graded automatically and then solves them itself. The curriculum can grow with capability, though this currently works best in rule-bound domains.","evidence":[{"title":"Absolute Zero: Reinforced Self-play Reasoning with Zero Data","note":"In a code-verifiable domain, the model both generates and solves tasks, directly supporting the node for verifiable self-generated curricula."}],"actors":[{"name":"Tsinghua University, BIGAI & Pennsylvania State University","role":"Proponents","note":"Absolute Zero has one model propose learnable tasks and solve them, while a code executor verifies both task validity and the answer, creating a self-play curriculum without external data."}]},"tech-ai-rd-loop":{"id":"tech-ai-rd-loop","label":"AI R&D Loops / 自动研究闭环","englishLabel":"AI R&D and Automated Science Loops","summary":"Use agents to connect hypothesis generation, coding, experimentation, result analysis and revision.","why":"Research iteration requires people to coordinate sequentially across many tools and long feedback cycles.","mechanism":"Connect literature, experimental environments, evaluators and version control in an agent workflow that records every step and supports rollback.","changed":"Machines could participate in the complete experimental cycle rather than answering isolated research questions.","limits":"Evaluators can be exploited, automation can amplify experimental costs and false conclusions, and genuine novelty remains difficult to judge.","plainLanguage":"Research is not one question; it means reading, coding, experimenting, interpreting results and revising the plan. An automated research loop connects these steps in a recorded, reversible workflow so AI can participate in the full iteration.","evidence":[{"title":"The AI Scientist","note":"This early system connected idea generation, experimentation, writing and review into an automated research workflow."}],"actors":[{"name":"Sakana AI","role":"Proponent and developer","note":"The AI Scientist connects idea generation, coding, experimentation and result writing in an automated research loop."},{"name":"Google DeepMind","role":"Frontier advance","note":"AlphaEvolve combines model generation, evolutionary search and executable verification for algorithm discovery."}]},"cap-closed-improvement-loop":{"id":"cap-closed-improvement-loop","label":"机器可参与提出—实验—评估—改进闭环","englishLabel":"Machine-Operated Improvement Loops","summary":"AI begins to connect the full R&D feedback loop instead of performing only one step.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-self-reference":{"id":"problem-self-reference","label":"系统尚不能稳定修改自身改进机制","englishLabel":"Self-Reference & Stability","summary":"Local automated optimization does not imply an improved ability to produce the next generation of improvements.","why":"Local automated optimization does not imply an improved ability to produce the next generation of improvements.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-self-modifying-agent":{"id":"tech-self-modifying-agent","label":"Self-Modifying Agents / 自修改 Agent","englishLabel":"Self-Modifying Agents","summary":"Let an agent modify its own prompts, code, tools or learning process and retain changes that pass evaluation.","why":"A fixed agent cannot turn problems discovered during long-running operation into structural improvements.","mechanism":"Propose self-patches, validate them in a sandbox and regression suite, then update internal components through a gated process.","changed":"Systems began to move from remembering experience toward changing the mechanisms that generate behavior.","limits":"Current evidence centers on coding benchmarks and human-defined evaluators; it does not show that general intelligence or recursive self-improvement has been achieved.","plainLanguage":"An ordinary agent can remember experience, but its structure stays fixed. A self-modifying agent proposes changes to its own prompts, code or tools, tests them in a sandbox and regression suite, and keeps only those that pass.","evidence":[{"title":"Darwin Gödel Machine: Open-Ended Evolution of Self-Improving Agents","note":"Code modification, an open-ended candidate archive and benchmark evaluation provide direct empirical evidence for self-modifying agents, but do not establish general RSI."}],"actors":[{"name":"Sakana AI RSI Lab","role":"Proponent and developer","note":"Darwin Gödel Machine lets an agent modify its own code, while external benchmarks decide which changes enter an open archive."}]},"thesis-rsi":{"id":"thesis-rsi","label":"RSI / 递归自我改进假设","englishLabel":"Recursive Self-Improvement","summary":"A theoretical hypothesis in which a system improves its own ability to improve, potentially producing recursive acceleration.","why":"If AI can perform AI research, could it further improve its own capacity to conduct that research?","mechanism":"It assumes that each gain in capability increases the efficiency of research, design and validation in the next round, creating positive feedback.","changed":"It provides a distant reference point for understanding some frontier labs and narratives of automated AI R&D.","limits":"There is no evidence that RSI has been achieved in open environments; goal stability, verification, resources and diminishing returns could all interrupt the recursion.","plainLanguage":"RSI is not an accomplished product path but a distant hypothesis: if AI can improve its own ability to do AI research, will the next round of improvement become faster? It provides a useful coordinate, but current evidence is far from showing that recursive acceleration has occurred.","evidence":[{"title":"The Basic AI Drives","note":"A theoretical argument for why sufficiently advanced goal-directed systems might seek self-improvement, not an empirically established paradigm."}],"actors":[{"name":"Sakana AI RSI Lab","role":"Research program","note":"It publicly connects self-modifying agents, evolutionary search and automated research in a modern RSI program; current evidence remains early and limited to constrained tasks."}]},"problem-rsi-control":{"id":"problem-rsi-control","label":"目标稳定、验证与可控性尚无解","englishLabel":"RSI Control & Verification","summary":"Recursive improvement lacks trustworthy cross-generation evaluation, goal preservation and safety boundaries.","why":"Recursive improvement lacks trustworthy cross-generation evaluation, goal preservation and safety boundaries.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-rapid-adaptation":{"id":"cap-rapid-adaptation","label":"以少量经验快速适应新任务","englishLabel":"Rapid & Continual Adaptation","summary":"Reuses existing knowledge to learn quickly as the data distribution changes, without excessive forgetting.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-train-from-scratch":{"id":"problem-train-from-scratch","label":"每个新任务都从头训练","englishLabel":"Training From Scratch","summary":"Representations and experience cannot be reused across tasks, repeatedly consuming data and compute.","why":"Representations and experience cannot be reused across tasks, repeatedly consuming data and compute.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-transfer-learning":{"id":"tech-transfer-learning","label":"Transfer Learning / 迁移学习","englishLabel":"Transfer Learning and Pretrain–Finetune","summary":"Transfers parameters or representations learned on a source task to a new task, then performs limited adaptation.","why":"Training every task from scratch wastes existing knowledge and requires large amounts of new labeled data.","mechanism":"A model is first pretrained on a large dataset or related task, then frozen, fine-tuned or adapted with lightweight modules.","changed":"Knowledge could be reused across tasks, laying the groundwork for the foundation-model training paradigm.","limits":"Transfer gains depend on similarity to the source objective; full fine-tuning can still overfit and forget prior capabilities.","plainLanguage":"A new task does not have to begin from zero. Transfer learning carries parameters or representations learned on an earlier task into the new one, then adapts them with a smaller amount of data.","evidence":[{"title":"Learning and Transferring Mid-Level Image Representations using Convolutional Neural Networks","note":"It directly showed that mid-level representations learned on a large dataset can transfer to new tasks with fewer examples."}],"actors":[{"name":"Maxime Oquab 等","role":"Key advance in deep transfer","note":"They transferred convolutional features learned on a large dataset to new visual tasks, showing that intermediate deep representations can be reused across label spaces."}]},"cap-knowledge-reuse":{"id":"cap-knowledge-reuse","label":"已有知识可用于更快学习新任务","englishLabel":"Reuse Knowledge Across Tasks","summary":"A new task does not have to begin from random parameters and zero experience.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-few-shot-adaptation":{"id":"problem-few-shot-adaptation","label":"微调仍需数据，且可能过拟合单一任务","englishLabel":"Few-Shot Adaptation","summary":"The goal is for a model to learn how to adapt quickly, not merely to reuse fixed parameters.","why":"The goal is for a model to learn how to adapt quickly, not merely to reuse fixed parameters.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-meta-learning":{"id":"tech-meta-learning","label":"Meta-Learning / 元学习","englishLabel":"Meta-Learning: Learning to Learn","summary":"Learns across many tasks a mechanism that can adapt to a new task from a small number of examples.","why":"Ordinary fine-tuning still needs substantial data and many steps and does not explicitly optimize the speed of adaptation.","mechanism":"It optimizes an initialization, update rule or memory across tasks so that a few examples or gradient steps are enough to adapt.","changed":"The process of learning a new task could itself become the training objective.","limits":"The meta-training task distribution defines the generalization boundary; out-of-distribution tasks may not be learned quickly.","plainLanguage":"Transfer learning reuses existing knowledge. Meta-learning goes further by directly training the model to learn new tasks faster, ideally adapting from a few examples and only a small number of updates.","evidence":[{"title":"Model-Agnostic Meta-Learning","note":"It learned an initialization that can adapt to new tasks quickly from a small number of examples."}],"actors":[{"name":"Chelsea Finn, Pieter Abbeel & Sergey Levine","role":"Originators","note":"MAML directly optimizes an initialization that adapts to new tasks in a few gradient steps, making rapid learning itself the objective."}]},"problem-catastrophic-forgetting":{"id":"problem-catastrophic-forgetting","label":"顺序学习新任务会灾难性遗忘","englishLabel":"Catastrophic Forgetting","summary":"Updating a model with new knowledge can damage capabilities it learned earlier.","why":"Updating a model with new knowledge can damage capabilities it learned earlier.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-continual-learning":{"id":"tech-continual-learning","label":"Continual Learning / 持续学习","englishLabel":"Continual Learning","summary":"Learns new tasks or distributions over time while preserving prior capabilities as much as possible.","why":"Static-training assumptions do not match real deployment, while direct updates cause catastrophic forgetting.","mechanism":"Replay, regularization, parameter isolation or dynamic architectures balance plasticity with stability.","changed":"Models could continue absorbing new experience without being retrained in full.","limits":"In open environments, task boundaries are unclear and storage, privacy, transfer and safety evaluation still lack unified solutions.","plainLanguage":"Real systems keep encountering new tasks. They cannot be fully retrained every time, nor can they learn the new and forget the old. Continual learning studies how to absorb new experience while preserving prior capabilities.","evidence":[{"title":"Overcoming catastrophic forgetting in neural networks","note":"EWC constrains updates on a new task according to parameter importance, a landmark original work on the stability–plasticity tradeoff in continual learning."}],"actors":[{"name":"Google DeepMind","role":"Landmark advance","note":"EWC limits later updates according to each parameter's importance for prior tasks, providing a clear mechanism for reducing catastrophic forgetting in neural networks."}]},"cap-lifelong-adaptation":{"id":"cap-lifelong-adaptation","label":"模型可持续吸收新经验而少忘旧知识","englishLabel":"Lifelong Adaptation","summary":"Learning expands from one-time training into a long-term process during deployment.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-continual-evaluation":{"id":"problem-continual-evaluation","label":"开放分布下难定义保留、迁移与安全边界","englishLabel":"Continual Evaluation","summary":"Real environments lack fixed task boundaries, and online updates also change the system's risk profile.","why":"Real environments lack fixed task boundaries, and online updates also change the system's risk profile.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"cap-autonomous-discovery":{"id":"cap-autonomous-discovery","label":"自主提出并验证科学新知识","englishLabel":"Autonomous Scientific Discovery","summary":"Enables AI to move beyond restating existing knowledge by proposing testable hypotheses, using tools or experiments, and revising its judgment in light of evidence.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-static-science":{"id":"problem-static-science","label":"只学习既有语料，无法验证关于未知世界的假设","englishLabel":"Static Scientific Knowledge","summary":"Papers and databases record the past; new scientific knowledge must confront reality through formal proof, simulation or physical experiment.","why":"Papers and databases record the past; new scientific knowledge must confront reality through formal proof, simulation or physical experiment.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-scientific-agents":{"id":"tech-scientific-agents","label":"Scientific Agents / 科学研究 Agent","englishLabel":"Scientific Tool-Using Agents","summary":"Uses agents to orchestrate retrieval, modeling, experimental design, execution, analysis and revision rather than answering a scientific question only once.","why":"A language model can restate papers or generate hypotheses, but it does not naturally turn an open question into an inspectable, iterative research process.","mechanism":"Literature, code, specialized models, experimental environments and evaluators are organized into a stateful workflow that selects the next step from each round's results.","changed":"AI began to cover multiple steps of the full research cycle, making research processes recordable, reproducible and repeatable.","limits":"A complete workflow does not ensure a reliable conclusion; evaluator bias, tool errors and automated review can amplify polished but low-quality research.","plainLanguage":"Scientific research is not simply summarizing papers. It turns an open question into testable hypotheses, experiments and next steps. Scientific agents connect literature, code, specialist tools and experimental environments into an iterative research process.","evidence":[{"title":"The AI Scientist","note":"An early system that connected idea generation, experimentation, writing and review into an automated research workflow."}],"actors":[{"name":"FutureHouse","role":"Frontier implementation","note":"It uses specialized agents for literature search, review, gap identification and experimental planning, then composes them into scientific workflows."},{"name":"Edison Scientific","role":"Company approach","note":"Kosmos performs literature work, data analysis, hypothesis generation and multistep scientific workflows for R&D teams."}]},"tech-formal-science-verification":{"id":"tech-formal-science-verification","label":"Formal Verification / 形式验证","englishLabel":"Formal Scientific Verification","summary":"Expresses mathematical, software or other formalizable claims as machine-checkable propositions and uses a small trusted kernel to determine whether a proof is valid.","why":"Natural-language arguments can sound fluent while containing gaps; scientific agents need low-ambiguity correctness feedback that can be decided automatically.","mechanism":"Definitions, propositions and proofs are encoded in a formal system such as Lean, where a type checker verifies step by step whether a candidate proof satisfies the original statement.","changed":"Some mathematical and computational claims could receive deterministic feedback and serve as verifiers in reasoning training and search.","limits":"It proves only internal correctness relative to a formal statement; it does not ensure that the statement faithfully represents reality, that the result is novel, or that the research question matters.","plainLanguage":"A natural-language proof can sound convincing and still hide a logical gap. Formal verification rewrites a claim so a machine can check each step, giving some mathematical and software problems a clear correctness signal.","evidence":[{"title":"The Lean 4 Theorem Prover and Programming Language","note":"Lean 4 uses a small trusted kernel to check formal proofs, providing a deterministic feedback interface for mathematics and formalizable systems."}],"actors":[{"name":"Harmonic","role":"Company approach","note":"It uses formal systems such as Lean to make mathematical reasoning machine-checkable rather than relying only on persuasive natural language."}]},"tech-autonomous-labs":{"id":"tech-autonomous-labs","label":"Autonomous Laboratories / 自主实验室","englishLabel":"Autonomous Laboratories","summary":"Connects machine-learning decisions, laboratory automation, robots and measurement instruments into a loop that selects and runs real experiments iteratively.","why":"Historical papers and static databases alone cannot determine whether a new hypothesis about an unknown material or biological system holds in reality.","mechanism":"The system selects experimental parameters from existing results, automatically performs preparation and measurement, then returns observations to active learning or a research agent.","changed":"AI could actively obtain new evidence through physical action rather than only predicting within a fixed dataset.","limits":"Experimental throughput, instrument coverage, contamination and failure, measurement error and human-defined objectives still limit autonomy; automated operation does not itself identify important questions.","plainLanguage":"Reading papers alone cannot tell AI whether a new material or biological hypothesis works in reality. An autonomous laboratory connects experiment selection, robotic operation, measurement and analysis into a real closed loop.","evidence":[{"title":"An autonomous laboratory for the accelerated synthesis of inorganic materials","note":"A-Lab connected robotics, materials databases, data interpretation and active learning in a real materials-synthesis loop, providing direct empirical evidence for autonomous laboratories."}],"actors":[{"name":"Periodic Labs","role":"Company approach","note":"It combines an AI scientist with a physical laboratory that the system can operate directly, allowing hypotheses to be tested through real experiments."},{"name":"LILA Sciences","role":"Company approach","note":"Its AI Science Factory connects reasoning models, instruments, automation and experimental verifiers in a closed loop."}]},"cap-hypothesis-test-loop":{"id":"cap-hypothesis-test-loop","label":"机器可运行假设—实验—解释闭环","englishLabel":"Machine-Operated Hypothesis–Test Loop","summary":"A system can turn an open question into testable propositions and choose the next step from formal or physical evidence.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-scientific-feedback":{"id":"problem-scientific-feedback","label":"一次性实验尚未形成可扩展的学习信号","englishLabel":"Scientific Feedback Bottleneck","summary":"Experimental throughput, retention of negative results, reward definition and attribution across experiments constrain whether the loop can keep learning.","why":"Experimental throughput, retention of negative results, reward definition and attribution across experiments constrain whether the loop can keep learning.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"tech-experiment-driven-learning":{"id":"tech-experiment-driven-learning","label":"Experiment-Driven Learning / 实验驱动学习","englishLabel":"Experiment-Driven Learning","summary":"Turns successes, failures and new measurements from each real experiment into data, rewards or curricula that continually update research strategies and models.","why":"A one-off automated experiment improves execution efficiency only; if its results do not enter the learning loop, the system does not become a better scientist by running more experiments.","mechanism":"Positive and negative results are retained with their experimental context; verifiers, information gain or task rewards select subsequent experiments, and accumulated data is used for model post-training.","changed":"The laboratory shifted from a tool invoked by an agent to an environment that continually expands the training distribution and verifiable feedback.","limits":"Sparse, delayed feedback is difficult to attribute and can optimize measurable but unimportant proxies; public evidence for transfer across instruments and domains remains limited.","plainLanguage":"Automating one experiment only saves labor. The system must also become better at research from both successes and failures. Experiment-driven learning turns each round of results back into training data or feedback that helps choose the next experiment.","evidence":[{"title":"An autonomous laboratory for the accelerated synthesis of inorganic materials","note":"A-Lab connected robotics, materials databases, data interpretation and active learning in a real materials-synthesis loop, providing direct empirical evidence for autonomous laboratories."},{"title":"Periodic Labs — AI scientists and autonomous laboratories","note":"Periodic explicitly distinguishes reading a finite corpus from generating new data through real experiments, treating the autonomous laboratory as the evidence interface for an AI scientist."},{"title":"Lila AI Science Factories","note":"Lila describes a closed loop of reasoning models, tools, automation and verifiers, and an experimental learning flywheel that turns each experiment into a post-training signal."}],"actors":[{"name":"Periodic Labs","role":"Company approach","note":"It treats nature as a verifiable environment and uses experiments to produce positive and negative training signals that do not exist on the internet."},{"name":"LILA Sciences","role":"Company approach","note":"It feeds each real experiment back as training tokens and reward signals for scientific reasoning models."}]},"cap-evidence-generating-ai":{"id":"cap-evidence-generating-ai","label":"AI 可通过行动持续产生新证据","englishLabel":"Evidence-Generating AI","summary":"Instead of only answering questions from a fixed benchmark, the system expands the set of learnable facts through proofs, simulations, or experiments.","why":"","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]},"problem-scientific-significance":{"id":"problem-scientific-significance","label":"可验证不等于新颖、重要或能跨领域泛化","englishLabel":"Scientific Significance & Generalization","summary":"A system may optimize easy-to-measure proxy objectives and produce many correct but inconsequential results that do not transfer.","why":"A system may optimize easy-to-measure proxy objectives and produce many correct but inconsequential results that do not transfer.","mechanism":"","changed":"","limits":"","plainLanguage":"","evidence":[],"actors":[]}},"edges":{},"rivers":{}}};</script>

    subtitle:"AI TECHNOLOGY · EVOLUTION MAP", search:"Find a capability, problem, paradigm, company or lab…", searchLabel:"Search the map", mapLabel:"AI technology evolution map", overview:"Overview", paths:"Evolution paths", presentation:"Read-only map", capabilityArchitecture:"AI Capability Architecture", overviewSummary:"Start with the six foundational capabilities, then enter an evolution path to see which bottleneck gave rise to each technical paradigm.", allPaths:"16 Evolution Paths", allPathsSub:"Each path connects a capability goal, a binding problem and the paradigms developed in response.", close:"Close", nodeType:"Node type", status:"Maturity", inPlainEnglish:"In plain English", summary:"What it is", why:"Why it emerged", mechanism:"How it works", changed:"What it changed", limits:"Limits", evidence:"Primary evidence", actors:"Who proposed it or is advancing it", noResults:"No matching node, company or lab.", home:"Fit view", plus:"Zoom in", minus:"Zoom out", relation:"Relation", language:"中文", footer:"Drag to pan · Pinch or Ctrl + wheel to zoom · Click a node for context", pathsFor:"Paths connected to this capability", route:"Open path", mapEyebrow:"AI Map", nodeContext:"Node context", legendCapability:"Capability", legendProblem:"Problem", legendParadigm:"Paradigm", source:"Source"

  };
  const kindMap = isEn ? {capability_root:"Long-term goal",foundation_capability:"Foundational capability",composite_capability:"Specific capability",capability_outcome:"Capability outcome",problem:"Binding problem",technical_route:"Technical paradigm",enabler:"Enabler",thesis:"Frontier thesis"} : {capability_root:"长期目标",foundation_capability:"基础能力",composite_capability:"具体能力",capability_outcome:"能力结果",problem:"核心问题",technical_route:"技术范式",enabler:"使能条件",thesis:"前沿假设"};
  const statusMap = isEn ? {historical:"Historical",established:"Established",frontier:"Frontier",emerging:"Emerging",hypothesis:"Hypothesis",horizon:"Capability horizon",evidence:"Evidence"} : {historical:"历史基底",established:"已建立",frontier:"前沿",emerging:"涌现中",hypothesis:"远端假设",horizon:"能力地平线",evidence:"证据层"};
  const relationMap = isEn ? {"包含":"Contains","具体化为":"Manifests as","受阻于":"Blocked by","催生":"Gives rise to","使能":"Enables","产生":"Produces","暴露":"Reveals","演化为":"Evolves into","分叉为":"Branches into","汇合于":"Converges into"} : {};
  const actorKindMap = isEn ? {"人物":"Person","人物与 Lab":"Person and lab","Frontier Lab":"Frontier lab","Lab":"Lab","Neo Lab":"Neo lab","研究团队":"Research team"} : {};
  const evidenceKindMap = isEn ? {paper:"Paper",book:"Book",ACM:"ACM",report:"Report","technical report":"Technical report",official:"Official source"} : {};
  const nodeById = Object.fromEntries(D.nodes.map(n => [n.id,n]));
  const riverById = Object.fromEntries(D.rivers.map(r => [r.id,r]));
  const overviewSet = new Set(D.overviewIds);
  let state = {riverId:null,selectedId:null,capabilityId:null,view:{...D.overviewView},targetView:null,anim:null};
  const $ = s => document.querySelector(s);
  const svg = $("#mapSvg"), edgeLayer=$("#edgeLayer"), labelLayer=$("#labelLayer"), nodeLayer=$("#nodeLayer");
  const pathDrawer=$("#pathDrawer"), detailDrawer=$("#detailDrawer"), searchResults=$("#searchResults"), searchInput=$("#searchInput");
  const safe = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const tNode = (node,key) => isEn ? (D.translations.nodes?.[node.id]?.[key] || node[key] || "") : (node[key] || "");
  const labelFor = node => isEn ? (D.translations.nodes?.[node.id]?.englishLabel || node.en || node.label) : node.label;
  const riverTitle = river => isEn ? (D.translations.rivers?.[river.id]?.title || river.titleEn || river.short) : river.title;
  const riverSummary = river => isEn ? (D.translations.rivers?.[river.id]?.summary || river.summaryEn || "") : river.summary;
  const riverSubtitle = river => isEn ? (river.shortEn || riverSummary(river)) : river.short;
  const relationFor = type => isEn ? (relationMap[type] || type) : type;
  const svgEl = (tag,attrs={}) => {const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el};

  // Presentation state only: never write coordinates or relationships into MAP_DATA.
  const offsets = new Map(), nodeElements = new Map(), edgeElements = new Map();
  const labelPositions = new Map();
  let geometryFrame = null, gesture = null, resetAnimation = null, labelAnimation = null;
  // Text metrics and node geometry share one cached layout, including after fonts load.
  const textMetrics = new Map(), nodeLayouts = new Map();
  const measureLayer=svgEl("g",{"aria-hidden":"true",visibility:"hidden","pointer-events":"none"});
  svg.append(measureLayer);
  function measureMapText(text,role,size){
    const key=`${role}:${size}:${text}`;
    if(textMetrics.has(key))return textMetrics.get(key);
    measureLayer.setAttribute("class",role==="relation"?"edge-label":"node");
    const probe=svgEl("text",{class:role,"font-size":size,x:0,y:0});
    probe.textContent=text;measureLayer.replaceChildren(probe);
    const box=probe.getBBox();
    const metrics={x:box.x,y:box.y,w:Math.max(box.width,probe.getComputedTextLength()),h:box.height};
    textMetrics.set(key,metrics);return metrics;
  }
  function wrapLabel(text,maxWidth,fontSize){
    const value=String(text).trim().replace(/\s+/g," ");
    const tokens=[...new Intl.Segmenter(isEn?"en":"zh",{granularity:"word"}).segment(value)].map(item=>item.segment);
    const lines=[];let line="";
    const fits=value=>measureMapText(value,"label",fontSize).w<=maxWidth;
    for(const token of tokens){

      if(fits(next)){line=next;continue}
      if(line.trim()){lines.push(line.trimEnd());line=""}

      // An unusually long word must wrap too; never truncate its content.
